# Subliminal Configuration File (template)
# Fill credentials manually (do NOT commit secrets).
# Schema matches subliminal 2.8.0 CLI (`subliminal --help` / `subliminal download --help`).
# NOTE: table names are singular ("provider"/"refiner"), not plural — subliminal
# silently drops the whole file on any TOML syntax error, so keep arrays comma-clean.

[default]
cache_dir = "~/.cache/subliminal"

[provider.addic7ed]
username = ""
password = ""

[provider.opensubtitles]
username = ""
password = ""

[provider.opensubtitlescom]
username = ""
password = ""

[refiner.omdb]
apikey = ""

[download]
# Default languages (used when -l/--language isn't passed explicitly)
language = ["tur", "tr", "eng"]
min_score = 0
# Subtitle category preference order (n=normal, fo=foreign-only, hi=hearing-impaired);
# replaces the deprecated "hearing_impaired" boolean
subtitle_categories = "n,fo,hi"
force = false
# opensubtitles (opensubtitles.org, legacy XML-RPC API — distinct from the
# newer opensubtitlescom) is ignored: its terminate() calls self.server.close()
# on an xmlrpc.client.ServerProxy, which has no real close() method, so the
# call gets forwarded as a bogus RPC to the server and always errors out with
# a noisy traceback on every successful run. Harmless (the subtitle is already
# saved by then) but silenced here since opensubtitlescom covers the same site.
ignore_provider = ["opensubtitles"]
# No other provider/extend_provider list here on purpose: subliminal 2.8.0
# already defaults to every remaining provider except the three that need a
# paid VIP account (bsplayer, opensubtitlesvip, opensubtitlescomvip). Add
# `extend_provider = [...]` here to pull one of those in once you have an
# account for it.
