# ─── 1) SERVER & TERMINAL ──────────────────────────────────────────────────────

# True-color + modern terminal capabilities.
# tmux-256color: rich terminfo (extended-keys, invisible mode, status line).
# terminal-features passes through the capabilities modern apps rely on:
#   RGB           — 24-bit truecolor
#   usstyle       — curly/dotted/dashed underlines (Claude Code, vim/nvim)
#   hyperlinks    — OSC 8 clickable hyperlinks
#   sync          — synchronized output (flicker-free render in yazi, nvim)
#   strikethrough — strikethrough text
#   overline      — overline text
#   focus         — focus-in/out events
#   title         — set window title
#   clipboard     — OSC 52 clipboard
#   ccolour       — change cursor color
#   cstyle        — change cursor style
#   sixel         — sixel graphics (foot, wezterm only — kitty & ghostty use KGP, not sixel)
#   extkeys       — CSI-u extended keys (kitty; also xterm-256color, which is kitty's TERM here)
set  -g  default-terminal "tmux-256color"
# Both arrays are appended to below, so reset them to tmux's defaults first —
# otherwise every reload (prefix R, huma autoreload) stacks another copy.
set  -su terminal-overrides
set  -su terminal-features
set  -as terminal-overrides ",*:E3=@"   # E3=@: 'clear' must not wipe the outer terminal's scrollback (RGB lives in terminal-features, 3.2+)
# The shared set lives in @term_common; each line only adds its terminal's extras.
set  -g  @term_common "RGB:usstyle:hyperlinks:sync:strikethrough:overline:focus:title:clipboard"
set  -asF terminal-features ",alacritty:#{@term_common}:ccolour:cstyle"
set  -asF terminal-features ",xterm-kitty:#{@term_common}:ccolour:cstyle:extkeys"
set  -asF terminal-features ",xterm-ghostty:#{@term_common}:ccolour:cstyle"
set  -asF terminal-features ",foot:#{@term_common}:ccolour:cstyle:sixel"
set  -asF terminal-features ",wezterm:#{@term_common}:ccolour:cstyle:sixel"
set  -asF terminal-features ",xterm-256color:#{@term_common}:ccolour:cstyle:extkeys"
set  -asF terminal-features ",tmux-256color:#{@term_common}"

# Let DCS passthrough sequences reach the outer terminal. Required for the Kitty
# graphics protocol / Sixel image preview in yazi (kitty, ghostty, foot, wezterm) —
# without it tmux eats the escapes and images render cut/garbled. Off by default
# since tmux 3.4. `all` (vs `on`) also lets non-visible panes pass through, so
# yazi can pre-render images from background windows.
set  -g  allow-passthrough all

# Refresh the server's environment from the client on attach (Wayland/X11/Qt/SSH drift).
# `set -g` replaces tmux's built-in list, so the defaults worth keeping (XAUTHORITY,
# SSH_*, WINDOWID, XDG_SESSION_TYPE) are spelled out. The compositor sockets
# (NIRI_SOCKET, HYPRLAND_INSTANCE_SIGNATURE) change per compositor start — without
# them `niri msg` / `hyprctl` in new panes would talk to a dead socket.
set  -g  update-environment "DISPLAY WAYLAND_DISPLAY XAUTHORITY WINDOWID XDG_RUNTIME_DIR DBUS_SESSION_BUS_ADDRESS SSH_AUTH_SOCK SSH_AGENT_PID SSH_ASKPASS SSH_CONNECTION BROWSER DESKTOP_SESSION XDG_SESSION_TYPE XDG_SESSION_DESKTOP XDG_CURRENT_DESKTOP QT_QPA_PLATFORMTHEME QT_QPA_PLATFORMTHEME_QT6 QT_STYLE_OVERRIDE XCURSOR_THEME HYPRCURSOR_THEME NIRI_SOCKET HYPRLAND_INSTANCE_SIGNATURE"

# TPM and plugins live under the XDG layout. This env var lets TPM find the plugin
# directory; it propagates to child shells.
set-environment -g TMUX_PLUGIN_MANAGER_PATH "$HOME/.config/tmux/plugins/"

# Performance / responsiveness
set  -sg repeat-time 300
set  -s  escape-time 10          # 0 risks mis-split ESC sequences over ssh/slow ptys
set  -s  extended-keys on        # CSI-u extended keys for apps that request them (nvim on kitty)
set  -s  extended-keys-format csi-u  # send them as CSI-u (S-Enter, C-i vs Tab); drop this line to go back to xterm format
set  -s  set-clipboard on        # inner apps' OSC 52 (nvim yank) reaches the system clipboard
set  -s  copy-command "~/.config/tmux/plugins/tmux-anka/bin/anka clip"  # argument-less copy-pipe* pipes here (auto wayland/X/OSC52)
set  -s  history-file "$HOME/.local/state/tmux/history"  # ':' prompt history survives restarts
set  -g  focus-events on
set  -g  aggressive-resize on
set  -g  history-limit 100000
set  -g  display-panes-time 5000
set  -g  display-time 2000       # status messages; the 750 ms default vanished too fast
set  -g  status-keys emacs       # ':' prompt in emacs mode — no vi normal-mode trap


# ─── Palette · Catppuccin Mocha ────────────────────────────────────────────────
# Referenced from format/style lines via `#{@cat_<name>}`. To re-theme, just edit
# the hex values below — the theme blocks and status bar follow automatically.

# Backgrounds (dark → light)
set -g @cat_base     "#1e1e2e"
set -g @cat_surface0 "#313244"
set -g @cat_surface1 "#45475a"
# Greys / text (dim → bright)
set -g @cat_overlay0 "#6c7086"
set -g @cat_overlay2 "#9399b2"
set -g @cat_subtext0 "#a6adc8"
set -g @cat_subtext1 "#bac2de"
# Accents
set -g @cat_accent   "#50AAA7"   # primary — active tab, session
set -g @cat_blue     "#89b4fa"
set -g @cat_mauve    "#cba6f7"
set -g @cat_lavender "#b4befe"
set -g @cat_green    "#a6e3a1"
set -g @cat_peach    "#fab387"
set -g @cat_yellow   "#f9e2af"
set -g @cat_pink     "#f38ba8"
# Muted accents — soft text on the dim window-tab states. Analogous to the teal
# accent (sky = blue neighbour, sage = green neighbour) for a cohesive look.
set -g @cat_sky_soft  "#82b2d2"
set -g @cat_sage_soft "#9cbeaa"

# Theme style blocks — each unique #[fg=...,bg=...] combo gets its own user-option.
# Format options reference these via `#{@theme_bN}`; to recolor, only update the
# @cat_ palette above.
set -gF @theme_b1 '#[bold]'
set -gF @theme_b2 '#[nobold]'
set -gF @theme_b3 '#[fg=#{@cat_base},bg=#{@cat_accent}]'
set -gF @theme_b4 '#[fg=#{@cat_base},bg=#{@cat_accent},bold]'
set -gF @theme_b5 '#[fg=#{@cat_accent},bg=#{@cat_base}]'
set -gF @theme_b6 '#[fg=#{@cat_accent},bg=#{@cat_surface0}]'
set -gF @theme_b7 '#[fg=#{@cat_subtext1},bg=#{@cat_surface0}]'
set -gF @theme_b8 '#[fg=#{@cat_surface0},bg=#{@cat_surface1}]'
set -gF @theme_b9 '#[fg=#{@cat_subtext0},bg=#{@cat_surface1},bold]'
set -gF @theme_b10 '#[fg=#{@cat_surface1},bg=#{@cat_surface0}]'
set -gF @theme_b11 '#[fg=#{@cat_base},bg=#{@cat_surface0},bold]'
set -gF @theme_b12 '#[fg=#{@cat_surface0},bg=#{@cat_base}]'
set -gF @theme_b13 '#[fg=#{@cat_subtext0},bg=#{@cat_surface0}]'
set -gF @theme_b14 '#[fg=#{@cat_base},bg=#{@cat_surface0}]'
set -gF @theme_b15 '#[fg=#{@cat_overlay2},bg=#{@cat_base}]'
set -gF @theme_b16 '#[fg=#{@cat_overlay0},bg=#{@cat_surface0}]'
set -gF @theme_b17 '#[fg=#{@cat_subtext0},bg=#{@cat_overlay0}]'
set -gF @theme_b18 '#[fg=#{@cat_blue},bg=#{@cat_overlay0}]'
set -gF @theme_b19 '#[fg=#{@cat_base},bg=#{@cat_blue},bold]'
set -gF @theme_b20 '#[fg=#{@cat_accent},bg=#{@cat_blue}]'

# Window-tab state blocks: same rounded shape as the active tab but muted — a
# dim surface fill with soft-coloured text (last/previous = soft sky, activity =
# soft sage), both analogous to the teal active tab so they sit quietly beside it.
# Only the text differs; the caps reuse @theme_b14 (left) and @theme_b12 (right).
set -gF @theme_wlast_txt '#[fg=#{@cat_sky_soft},bg=#{@cat_surface0},bold]'
set -gF @theme_wact_txt  '#[fg=#{@cat_sage_soft},bg=#{@cat_surface0},bold]'

# Foreground-only blocks (for choose-tree -F formats, etc.)
set -gF @theme_fg_mauve '#[fg=#{@cat_mauve}]'
set -gF @theme_fg_green '#[fg=#{@cat_green}]'

# ─── 2) WINDOW / PANE / SESSION ────────────────────────────────────────────────

set  -g  base-index 1
set  -g  pane-base-index 1
set  -g  renumber-windows on
# allow-rename off: a program (or remote ssh output) renaming the window via
# an escape sequence would silently disable automatic-rename for that window —
# the classic reason the huma-icon names below "randomly" stop updating.
set  -g  allow-rename off
set  -g  automatic-rename on
set  -g  automatic-rename-format "#(~/.config/tmux/plugins/tmux-huma/bin/huma icon #{q:pane_current_command}) #{b:pane_current_path}"
set  -g  set-titles on
set  -g  set-titles-string '#h ❐ #S ❙ #I ❙ #W'
set  -g  detach-on-destroy off
set  -g  mouse on
setw -g  mode-keys vi

# Activity / bell — drives the flags (window-status-{activity,bell}-style apply here)
setw -g  monitor-activity on
setw -g  monitor-bell     on
set  -g  visual-activity  off
set  -g  visual-bell      off
set  -g  bell-action      any

# Pane borders + optional header (running command + directory per pane)
set  -g  pane-border-lines single
set  -gF  pane-border-style       'fg=#{@cat_overlay0},bg=default'
set  -gF  pane-active-border-style 'fg=#{@cat_mauve},bg=default'
# Pane border title (disabled — uncomment to enable; shows the running command +
# directory along each pane's top edge)
#set  -g  pane-border-status top
#set  -g  pane-border-format ' #[fg=#{?pane_active,#{@cat_mauve},#{@cat_subtext0}},bold]#{pane_current_command} #[fg=#{@cat_overlay0},italics,nobold]· #{b:pane_current_path}#[default] '


# ─── 3) KEY BINDINGS ───────────────────────────────────────────────────────────

# Prefix → C-a (screen-compatible, easy to reach)
unbind C-b
set  -g  prefix C-a
bind a   send-prefix     # C-a a   → send a literal C-a to the inner app (screen-style)
bind C-a last-window     # C-a C-a → toggle last window (screen-style)

# Reload config
bind R source-file ~/.config/tmux/tmux.conf \; display-message "Config reloaded!"

# ── Window
bind A      command-prompt -I "#W" "rename-window '%%'"
bind q      confirm-before -p "Kill window #W? (y/n)" kill-window
bind x      kill-pane
bind C-n    next-window
bind C-p    previous-window
bind Tab    run-shell "sesh last"
bind c      run-shell -b "~/.local/bin/tm tmx --layout 1 >/dev/null 2>&1"
bind 0      run-shell -b "~/.local/bin/tm tmx --layout 3 >/dev/null 2>&1"

# Pane number indicator (Turkish keyboard 'ü')
bind -T prefix ü display-panes -d 0

# ── Pane navigation (vim-style)
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# ── Pane resize (repeatable)
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5

# ── Pane split (open in the current directory)
bind _ split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"

# ── Pane controls
bind z resize-pane -Z
bind Y set-window-option synchronize-panes \; display-message "synchronize-panes: #{?pane_synchronized,on,off}"

# ── Pane swap (reorder within a window)
bind -r '{'     swap-pane -U                                   # swap with the previous pane
bind -r '}'     swap-pane -D                                   # swap with the next pane
bind -r S-Left  swap-pane -U
bind -r S-Right swap-pane -D

# (prefix + 1-9 → window N: tmux's own defaults already do exactly this)

# ── Vim/nvim-aware pane navigation (Ctrl + h/j/k)
#   If vim/nvim is running in the pane, the key is forwarded to vim (navigates
#   vim windows). Otherwise it navigates tmux panes.
#   Zero-spawn: a format regex on #{pane_current_command} replaces the old
#   ps|grep pipeline that forked two processes on every keypress. Bonus: a
#   Ctrl-Z'd vim reports the shell as the pane command, so keys correctly
#   fall back to tmux while vim is suspended.
#   C-l is deliberately unbound: it stays clear-screen in the shell (and vim's
#   own redraw inside vim) — go right with prefix+l.
#   The key also passes through when there is nowhere to navigate (a single
#   pane, or a zoomed one) — so C-k stays kill-line and C-j newline there
#   instead of being swallowed by a no-op select-pane.
set  -g  @nav_passthru '#{||:#{m/ri:^g?(view|n?vim?x?)(diff)?$,#{pane_current_command}},#{||:#{==:#{window_panes},1},#{window_zoomed_flag}}}'
bind -n C-h if -F "#{E:@nav_passthru}" 'send-keys C-h' 'select-pane -L'
bind -n C-j if -F "#{E:@nav_passthru}" 'send-keys C-j' 'select-pane -D'
bind -n C-k if -F "#{E:@nav_passthru}" 'send-keys C-k' 'select-pane -U'

# ── Copy mode
bind Enter copy-mode
bind -T copy-mode-vi v   send-keys -X begin-selection
bind -T copy-mode-vi C-v send-keys -X rectangle-toggle
bind -T copy-mode-vi h   send-keys -X cursor-left
bind -T copy-mode-vi l   send-keys -X cursor-right
bind -T copy-mode-vi k   send-keys -X cursor-up
bind -T copy-mode-vi j   send-keys -X cursor-down
bind -T copy-mode-vi e   send-keys -X next-word-end
bind -T copy-mode-vi H   send-keys -X start-of-line
bind -T copy-mode-vi L   send-keys -X end-of-line
bind -T copy-mode-vi K   send-keys -N 5 -X cursor-up
bind -T copy-mode-vi J   send-keys -N 5 -X cursor-down

# ── Clipboard: copy via `anka clip` (the copy-command option in section 1 — replaces tmux-yank)
# Enter copies and exits (and-cancel); y and mouse selection keep it (no-clear, old @yank_action).
bind -T copy-mode-vi Enter             send-keys -X copy-pipe-and-cancel
bind -T copy-mode-vi y                 send-keys -X copy-pipe-no-clear
bind -T copy-mode-vi MouseDragEnd1Pane send-keys -X copy-pipe-no-clear
# Double/triple click: copy word/line. Inside copy mode the selection stays
# visible (no-clear); from the root table it copies and returns to the shell.
# The root binds keep tmux's own guard: an app that asked for the mouse (nvim,
# yazi, htop) gets the click instead of being dropped into copy mode.
bind -T copy-mode-vi DoubleClick1Pane select-pane \; send-keys -X select-word \; send-keys -X copy-pipe-no-clear
bind -T copy-mode-vi TripleClick1Pane select-pane \; send-keys -X select-line \; send-keys -X copy-pipe-no-clear
bind -n DoubleClick1Pane select-pane -t = \; if -F "#{||:#{pane_in_mode},#{mouse_any_flag}}" { send-keys -M } { copy-mode -M ; send-keys -X select-word ; send-keys -X copy-pipe-and-cancel }
bind -n TripleClick1Pane select-pane -t = \; if -F "#{||:#{pane_in_mode},#{mouse_any_flag}}" { send-keys -M } { copy-mode -M ; send-keys -X select-line ; send-keys -X copy-pipe-and-cancel }
# Paste: clipboard → tmux (<), buffer → clipboard (>); when wl-copy/xclip exist (anka clip is copy-only).
# `<` goes through a named scratch buffer: -p = bracketed paste (multi-line text
# is not executed line by line), -d = drop the buffer afterwards.
if-shell 'command -v wl-copy >/dev/null 2>&1' {
    bind > choose-buffer 'run "tmux save-buffer -b %% - | wl-copy"'
    bind < run 'wl-paste | tmux load-buffer -b _clip - && tmux paste-buffer -p -d -b _clip'
} {
    if-shell 'command -v xclip >/dev/null 2>&1' {
        bind > choose-buffer 'run "tmux save-buffer -b %% - | xclip -selection clipboard"'
        bind < run 'xclip -selection clipboard -o | tmux load-buffer -b _clip - && tmux paste-buffer -p -d -b _clip'
    }
}

# ── Clipse (clipboard history popup)
bind C-v display-popup -E -w 80% -h 70% clipse

# ── Buffer
bind b choose-buffer
bind + choose-buffer 'delete-buffer -b %%'

# ── Cheatsheet popup (prefix + ?) — the text lives in cheatsheet.txt next to this
# file; update it there when a binding changes.
bind '?' display-popup -E -w 80% -h 80% "less -R ~/.config/tmux/cheatsheet.txt"
# Live keybinding dump (the quoted-heredoc form never expanded $(...) — it
# printed the literal command instead of the list).
bind -n M-'?' display-popup -E -w 80% -h 80% "tmux list-keys | grep -v '^bind-key -T copy-mode-vi' | less -R"

# ── Choose-tree (window + session picker) — prefix + w
bind w choose-tree -Zw -F '#{?pane_in_mode,#{@theme_fg_mauve}●,○} #{?#{==:#{session_attached},0},,#{@theme_fg_green}} #{session_name}: #{session_windows}W'

# ── Session picker — prefix + s. Static, name-sorted (no usage-based reshuffle).
# In the menu: O cycles the sort field, r reverses.
bind s choose-tree -Zs -O name

# ── Popups (anote / tm / large terminal)
bind 'e' display-popup -w 60% -h 60% -E "~/.local/bin/anote -t"
bind 'E' display-popup -w 60% -h 60% -E "~/.local/bin/anote -Ms"
bind 'i' display-popup -w 60% -h 60% -E "~/.local/bin/anote -S"
# These four used to be root-table Alt-m/h/b/k, which stole the keys from every
# app (Alt-b is backward-word in zsh/readline, Alt-h/k are common nvim maps).
bind 'N' display-popup -w 60% -h 60% -E "~/.local/bin/anote"
bind 'B' display-popup -w 60% -h 60% -E "~/.local/bin/tm buffer"
bind 'V' display-popup -w 60% -h 60% -E "~/.local/bin/tm clip"
bind 'G' display-popup -w 60% -h 60% -E "~/.local/bin/tm speed"
bind T display-popup -E -d "#{pane_current_path}" -w 80% -h 80%

# ── Session: new / rename / sesh switcher
# New session starts in the current pane's directory and is switched to
# (%1, not %%: only the first %% in a template is substituted).
bind S command-prompt -p "New session:" "new-session -d -s '%1' -c '#{pane_current_path}' ; switch-client -t '=%1'"
bind K command-prompt -I "#S" -p "Rename session:" "rename-session '%%'"
# NOTE: --hide-duplicates intentionally omitted — sesh 2.26.2's path-keyed
# dedup is buggy (drops config entries sharing a path, e.g. 6 Podman VPNs all
# under ~/.podman/vpn). Fix landed upstream in aa8cc11 but isn't in 2.26.2.
bind C-t run-shell "sesh connect \"$(
  sesh list --icons --hide-attached | fzf-tmux -p 80%,70% \
    --no-sort --ansi --border-label ' sesh ' --prompt '⚡  ' \
    --header '  ^a all ^t tmux ^g configs ^x zoxide ^d tmux kill ^f find ^r refresh' \
    --bind 'tab:down,btab:up' \
    --bind 'ctrl-a:change-prompt(⚡  )+reload(sesh list --icons --hide-attached)' \
    --bind 'ctrl-t:change-prompt(🪟  )+reload(sesh list -t --icons --hide-attached)' \
    --bind 'ctrl-g:change-prompt(⚙️  )+reload(sesh list -c --icons)' \
    --bind 'ctrl-x:change-prompt(📁  )+reload(sesh list -z --icons)' \
    --bind 'ctrl-f:change-prompt(🔎  )+reload(fd -H -d 2 -t d -E .Trash . ~)' \
    --bind 'ctrl-d:execute-silent(tmux kill-session -t {2..})+change-prompt(🪟  )+reload(sesh list -t --icons --hide-attached)' \
    --bind 'ctrl-r:reload(sesh list --icons --hide-attached)' \
    --preview-window 'right:55%,wrap' \
    --preview 'sesh preview {}'
)\""


# ─── 4) STATUS BAR ─────────────────────────────────────────────────────────────

set  -g  status              on
set  -g  status-position     top
set  -g  status-interval     5
set  -g  status-justify      left
set  -g  status-left-length  1000
set  -g  status-right-length 1000

# Global status style (empty-space color)
set  -gF  status-style         'fg=#{@cat_subtext0},bg=#{@cat_base},none'
set  -gF  status-left-style    'fg=#{@cat_subtext0},bg=#{@cat_base},none'
set  -gF  status-right-style   'fg=#{@cat_subtext0},bg=#{@cat_base},none'

# Message / command / mode (selection) styles
set  -gF  message-style         'fg=#{@cat_base},bg=#{@cat_lavender},bold'
set  -gF  message-command-style 'fg=#{@cat_yellow},bg=#{@cat_base},bold'
setw -gF  mode-style            'fg=#{@cat_base},bg=#{@cat_mauve},bold'

# Popup / menu frames (display-popup, anka menus) — themed like the rest
set  -g   popup-border-lines rounded
set  -gF  popup-border-style 'fg=#{@cat_mauve}'
set  -gF  popup-style        'bg=#{@cat_base}'
set  -g   menu-border-lines  rounded
set  -gF  menu-border-style  'fg=#{@cat_mauve}'
set  -gF  menu-style         'fg=#{@cat_subtext1},bg=#{@cat_base}'
set  -gF  menu-selected-style 'fg=#{@cat_base},bg=#{@cat_accent},bold'

# Copy-mode search / mark highlights ('/' search, anka search jump)
set  -gF  copy-mode-match-style         'fg=#{@cat_yellow},bg=#{@cat_surface1}'
set  -gF  copy-mode-current-match-style 'fg=#{@cat_base},bg=#{@cat_peach},bold'
set  -gF  copy-mode-mark-style          'fg=#{@cat_base},bg=#{@cat_mauve}'

# Clock mode
setw -gF clock-mode-colour '#{@cat_accent}'
setw -g  clock-mode-style  24

# Window status (per-window slot)
setw -gF  window-status-style          'fg=#{@cat_overlay2},bg=#{@cat_base},none'
setw -gF  window-status-current-style  'fg=#{@cat_base},bg=#{@cat_accent},bold'
# activity-style must stay set: tmux's default is `reverse`, which would invert
# the activity block below. Its colours are overridden by the format.
setw -gF  window-status-activity-style 'fg=#{@cat_mauve},bg=default,bold'
setw -gF  window-status-bell-style     'fg=#{@cat_peach},bg=default,bold'

# window-status-format is state-aware: a window with activity gets a muted
# rounded block with soft-sage text (+ ●), the last/previous window the same
# block with soft-sky text, and normal windows plain dim text (bell still
# shows ⚠). Both blocks carry their own colours, so window-status-last-style
# is left at its default. The active window uses
# window-status-current-format below (accent block).
#   bell        → window-status-bell-style      (peach, bold — no blink)
setw -g  window-status-format         "#{?window_activity_flag,#{@theme_b14}#{@sep_l_main}#{@theme_wact_txt} #I #W#{?window_zoomed_flag,  ,} ● #{@theme_b12}#{@sep_l_main},#{?window_last_flag,#{@theme_b14}#{@sep_l_main}#{@theme_wlast_txt} #I #W#{?window_zoomed_flag,  ,} #{@theme_b12}#{@sep_l_main},#{@theme_b1} #I #{@theme_b2}#W#{?window_zoomed_flag,  ,} #{?window_bell_flag,⚠ ,}}}"
setw -g  window-status-current-format "#{@theme_b3}#{@sep_l_main}#{@theme_b4} #I #W#{?window_zoomed_flag,  ,} #{@theme_b5}#{@sep_l_main}"
setw -g  window-status-separator      ""

# ── Powerline separator glyphs (Nerd Font) factored into variables
#   change a value to restyle: triangle E0B0-E0B3 / round E0B4-E0B7 / flame E0C0-E0C3
set  -g  @sep_l_main ''
set  -g  @sep_l_sub  ''
set  -g  @sep_r_main ''
set  -g  @sep_r_sub  ''

# ── Status-left: the left block
#   Separator glyphs (Nerd Font):
#     main  U+E0B0  · solid left triangle  (at background-change boundaries)
#     sub   U+E0B1  · thin chevron         (sub-divider / end-fade within one bg)
#   Flow: teal " ◉ #S " → surface0 " ⧉ #pairing " → surface1 " online " →
#         (surface1→surface0) → (sub chevron on surface0) → base
set  -g  status-left  "#{E:@status_left}"
set  -g  @status_left "#{@theme_b4} ◉ #S #{@theme_b6}#{@sep_l_main}#{@theme_b7} ⧉ #{?session_many_attached,⚇ ,}#{@theme_b8}#{@sep_l_main}#{@theme_b9} #{@huma_online} #{@theme_b10}#{@sep_l_main}#{@theme_b11}#{@sep_l_sub}#{@theme_b12}#{@sep_l_main} "

# ── Status-right: the right block
#   Separator glyphs (Nerd Font):
#     main  U+E0B2  · solid right triangle (at background-change boundaries)
#     sub   U+E0B3  · thin chevron         (sub-divider / begin-fade within one bg)
#   Flow: base → (sub chevron on surface0) → (surface0→base intro) → anka status
#         → segments between the main triangles →
#         ... → blue " ⚿ ssh " → teal " ⌘ #h "
set  -g  status-right  "#{E:@status_right}"
set  -g  @status_right "#{@theme_b12}#{@sep_r_main}#{@theme_b13} #{E:@huma_mode}#{@theme_b14}#{@sep_r_main}#{@theme_b15} ◉ #{@anka_status} #{@theme_b12}#{@sep_r_main}#{@theme_b13} ♪ #{@huma_player} #{@theme_b16}#{@sep_r_main}#{@theme_b17} #{@huma_kripto} #{@theme_b18}#{@sep_r_main}#{@theme_b19} ⚿ #{@huma_ssh} #{@theme_b20}#{@sep_r_main}#{@theme_b4} ⌘ #h "


# ─── 5) PLUGIN LIST ────────────────────────────────────────────────────────────

set -g @plugin 'tmux-plugins/tpm'                      # plugin manager (itself)
set -g @plugin 'kenanpelit/tmux-anka'                  # session save/restore + switcher + sessionist (replaces resurrect + continuum + sessionx + sessionist)
set -g @plugin 'kenanpelit/tmux-huma'                  # status + window-icon + sane defaults (replaces online-status, prefix-highlight, ssh-status, kripto, playerctl, nerd-font-window-name, sensible)


# ─── 6) PLUGIN SETTINGS ────────────────────────────────────────────────────────

# tmux-huma (online + mode + battery + load + ssh + kripto + player)
# Widgets: #{@huma_online} #{E:@huma_mode} #{@huma_battery} #{@huma_load}
#          #{@huma_ssh} #{@huma_kripto} #{@huma_player}
set -g @huma-online-host    '1.1.1.1:443'   # TCP probe (53 is blocked on some networks)
set -g @huma-online-latency 'on'
# kripto (replaces tmux-kripto — daemon with a TTL-cached CoinGecko fetch)
set -g @huma-kripto-coins    'bitcoin,ethereum'  # comma-separated; each coin gets its glyph (₿ Ξ …)
set -g @huma-kripto-currency 'usd'
set -g @huma-kripto-symbol   '$'            # prefixes the price: $62,487
set -g @huma-kripto-ttl      '300'          # the API is hit at most this often
# player (replaces tmux-plugin-playerctl — daemon playerctl wrapper)
set -g @huma-player-max     '40'
set -g @huma-player-playing '▶'
set -g @huma-player-paused  '■'

# prefix+u: dedicated URL picker → open in browser (anka url, native picker).
# Open URL: capture the pane → anka url, which runs `@anka-url-browser <url>`.
# $BROWSER points at heavy Semsumo launchers (start-<engine>-<profile>) that
# ignore the URL arg, so we use `url-open`: it follows $BROWSER and opens the URL
# as a new tab in the already-running default-browser instance (brave/helium via
# profile_<engine>, firefox/others directly, else xdg-open). Engine-agnostic, so
# changing the default browser needs no edit here. Source: modules/scripts/bin/url-open.sh
set -g @anka-url-browser 'url-open'
bind u run-shell -b "~/.config/tmux/plugins/tmux-anka/bin/anka url --pane '#{pane_id}'"

# anka menu: prefix+F → command/keybinding/process/window/pane (replaces tmux-fzf)
# (bound via @anka-menu-key='F' inside anka.tmux; no separate setting needed)

# anka search: prefix+m → fuzzy-search the scrollback → jump to line (replaces tmux-fuzzback)
# (bound via @anka-search-key='m' inside anka.tmux)

# tmux-anka (replaces resurrect + continuum — a single Rust binary)
set -g @anka-capture-pane-contents 'on'
set -g @anka-restore-processes     'ssh psql mysql sqlite3 npm yarn nvim yazi claude ai-claude agy'
set -g @anka-strategy-nvim         'session'
set -g @anka-save-interval         '60'   # 10s + pane contents meant constant disk writes; the detach hook already covers the critical moments
set -g @anka-restore-on-start      'on'
set -g @anka-pick-key              'P'    # leave C-p for previous-window

# anka session management (replaces sessionx + sessionist, native)
# Switcher on prefix+o (so prefix+s stays tmux choose-tree). Keep my own prefix+S=new
# and prefix+K=rename, so disable anka's conflicting new + last.
set -g @anka-new-key       'none'   # prefix+S is already new session (bind S)
set -g @anka-last-key      'none'   # prefix+Tab is already last session (sesh last)
set -g @anka-switch-preview 'on'    # framed, colored live preview (v0.8.2)
# The rest stay at anka defaults: switcher=o, kill=X, promote=@, switch-by-name=g

# Switcher/pick popup size (prefix+o and prefix+P). Default 80%/75%.
set -g @anka-popup-width  '90%'
set -g @anka-popup-height '80%'

# huma icon settings (replaces nerd-font-window-name — the window name is built
# above in automatic-rename-format via `huma icon`; empty = built-in command map)
set -g @huma-icon-shell ''
set -g @huma-icon-editor ''

# huma suspend (replaces tmux-suspend): F12 disables the prefix so keys pass
# through to a nested ssh/byobu session; F12 again resumes (badge in @huma_mode).
# @huma-suspend-key 'none' disables it. Bound from huma.tmux on root+suspended.
# huma autoreload (replaces tmux-autoreload): the daemon re-sources the config on
# save (5s mtime poll, no entr). Off by default upstream; enabled here.
set -g @huma-autoreload on
set -g @huma-suspend-key  'F12'   # suspend/resume toggle key ('none'/'off' = disable)
set -g @huma-interval     5       # daemon tick (s) — aligned with status-interval 5 (a 3s tick just fed a 5s redraw)

# anka grab: prefix+Space → extract tokens from the screen (url/path/word/line, Tab=filter)
# → Enter=copy / ^v=paste / ^o=open (replaces extrakto; anka.tmux @anka-grab-key='Space')

# (clipboard is now anka clip + the copy-mode binds — see the Clipboard section above)


# ─── 7) TPM INIT ───────────────────────────────────────────────────────────────
#  Must be the last line. Scans the @plugin declarations and installs/loads them.
#  First-time setup: prefix + I (install), prefix + U (update).

run '~/.config/tmux/plugins/tpm/tpm'
