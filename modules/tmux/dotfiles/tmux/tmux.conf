# ═══════════════════════════════════════════════════════════════════════════════
#  tmux configuration · Catppuccin Mocha · Powerline · TPM
# ───────────────────────────────────────────────────────────────────────────────
#  Tek dosya, tüm ayar burada. Bölümler:
#    1) Server, terminal, palette   4) Status bar
#    2) Window / pane / session     5) Plugin list
#    3) Key bindings                6) Plugin settings
#                                   7) TPM init (en sonda)
#  Prefix: C-a  ·  Reload: prefix R  ·  Cheatsheet: prefix ?
# ═══════════════════════════════════════════════════════════════════════════════


# ─── 1) SERVER & TERMINAL ──────────────────────────────────────────────────────

# True-color + modern terminal capabilities.
# tmux-256color: zengin terminfo (extended-keys, invis mode, status line).
# terminal-features modern apps'ın kullandığı capability'leri passthrough eder:
#   RGB           — 24-bit truecolor
#   usstyle       — curly/dotted/dashed underline (Claude Code, vim/nvim)
#   hyperlinks    — OSC 8 clickable hyperlinks
#   sync          — synchronized output (yazi, nvim flicker-free render)
#   strikethrough — strikethrough text
#   overline      — overline text
#   focus         — focus-in/out events
#   title         — set window title
#   clipboard     — OSC 52 clipboard
#   ccolour       — change cursor color
#   cstyle        — change cursor style
set  -g  default-terminal "tmux-256color"
set  -ag terminal-overrides ",alacritty:RGB,xterm-256color:RGB,xterm-kitty:RGB,xterm-ghostty:RGB,foot:RGB,wezterm:RGB,*:E3=@"
set  -as terminal-features ",alacritty:RGB:usstyle:hyperlinks:sync:strikethrough:overline:focus:title:clipboard:ccolour:cstyle"
set  -as terminal-features ",xterm-kitty:RGB:usstyle:hyperlinks:sync:strikethrough:overline:focus:title:clipboard:ccolour:cstyle:sixel"
set  -as terminal-features ",xterm-ghostty:RGB:usstyle:hyperlinks:sync:strikethrough:overline:focus:title:clipboard:ccolour:cstyle"
set  -as terminal-features ",foot:RGB:usstyle:hyperlinks:sync:strikethrough:overline:focus:title:clipboard:ccolour:cstyle"
set  -as terminal-features ",wezterm:RGB:usstyle:hyperlinks:sync:strikethrough:overline:focus:title:clipboard:ccolour:cstyle"
set  -as terminal-features ",xterm-256color:RGB:usstyle:hyperlinks:sync:strikethrough:overline:focus:title:clipboard:ccolour:cstyle"
set  -as terminal-features ",tmux-256color:RGB:usstyle:hyperlinks:sync:strikethrough:overline:focus:title:clipboard"

# Attach sırasında client env'sini server'a güncelle (Wayland/X11/Qt/SSH drift).
set  -g  update-environment "DISPLAY WAYLAND_DISPLAY XDG_RUNTIME_DIR DBUS_SESSION_BUS_ADDRESS SSH_AUTH_SOCK BROWSER DESKTOP_SESSION XDG_SESSION_DESKTOP XDG_CURRENT_DESKTOP QT_QPA_PLATFORMTHEME QT_QPA_PLATFORMTHEME_QT6 QT_STYLE_OVERRIDE XCURSOR_THEME HYPRCURSOR_THEME SWAYSOCK I3SOCK"

# TPM ve plugin'ler XDG layout altında. Bu env var TPM'in plugin dizinini bulması
# için lazım; child shell'lere propagate olur.
set-environment -g TMUX_PLUGIN_MANAGER_PATH "$HOME/.config/tmux/plugins/"

# Performans / yanıt süresi
set  -sg repeat-time 300
set  -s  escape-time 0
set  -g  focus-events on
set  -g  aggressive-resize on
set  -g  history-limit 100000
set  -g  display-panes-time 5000


# Palette → user-options. Format/style satırlarında `#{@cat_<name>}` ile referans verilir.
# Tema değiştirmek için sadece aşağıdaki hex'leri güncelle, geri kalan her şey otomatik takip eder.
set -g @cat_base     "#1e1e2e"
set -g @cat_surface0 "#313244"
set -g @cat_surface1 "#45475a"
set -g @cat_overlay0 "#6c7086"
set -g @cat_overlay2 "#9399b2"
set -g @cat_subtext0 "#a6adc8"
set -g @cat_subtext1 "#bac2de"
set -g @cat_pink     "#f38ba8"
set -g @cat_peach    "#fab387"
set -g @cat_yellow   "#f9e2af"
set -g @cat_blue     "#89b4fa"
set -g @cat_lavender "#b4befe"
set -g @cat_mauve    "#cba6f7"
set -g @cat_green    "#a6e3a1"
set -g @cat_accent   "#50AAA7"

# Theme style blocks — her unique #[fg=...,bg=...] kombinasyonu kendi user-option'una atanır.
# Format options bunlara `#{@theme_bN}` ile referans verir; renkleri değiştirmek
# için sadece yukarıdaki @cat_ palette'ini güncelle.
set -gF @theme_b1 '#[bold]'
set -gF @theme_b2 '#[nobold]'
set -gF @theme_b3 '#[fg=#{@cat_base},bg=#{@cat_accent}]'
set -gF @theme_b4 '#[fg=#{@cat_base},bg=#{@cat_accent},bold]'
set -gF @theme_b5 '#[fg=#{@cat_accent},bg=#{@cat_base}]'
set -gF @theme_b6 '#[fg=#{@cat_accent},bg=#{@cat_surface0}]'
set -gF @theme_b7 '#[fg=#{@cat_subtext1},bg=#{@cat_surface0}]'
set -gF @theme_b8 '#[fg=#{@cat_surface0},bg=#{@cat_surface1}]'
set -gF @theme_b9 '#[fg=#{@cat_subtext0},bg=#{@cat_surface1},bold]'
set -gF @theme_b10 '#[fg=#{@cat_surface1},bg=#{@cat_surface0}]'
set -gF @theme_b11 '#[fg=#{@cat_base},bg=#{@cat_surface0},bold]'
set -gF @theme_b12 '#[fg=#{@cat_surface0},bg=#{@cat_base}]'
set -gF @theme_b13 '#[fg=#{@cat_subtext0},bg=#{@cat_surface0}]'
set -gF @theme_b14 '#[fg=#{@cat_base},bg=#{@cat_surface0}]'
set -gF @theme_b15 '#[fg=#{@cat_overlay2},bg=#{@cat_base}]'
set -gF @theme_b16 '#[fg=#{@cat_overlay0},bg=#{@cat_surface0}]'
set -gF @theme_b17 '#[fg=#{@cat_subtext0},bg=#{@cat_overlay0}]'
set -gF @theme_b18 '#[fg=#{@cat_blue},bg=#{@cat_overlay0}]'
set -gF @theme_b19 '#[fg=#{@cat_base},bg=#{@cat_blue},bold]'
set -gF @theme_b20 '#[fg=#{@cat_accent},bg=#{@cat_blue}]'

# Fg-only blocks (choose-tree -F formatı vs. için)
set -gF @theme_fg_mauve '#[fg=#{@cat_mauve}]'
set -gF @theme_fg_green '#[fg=#{@cat_green}]'

# ─── 2) WINDOW / PANE / SESSION ────────────────────────────────────────────────

set  -g  base-index 1
set  -g  pane-base-index 1
set  -g  renumber-windows on
set  -g  allow-rename on
set  -g  automatic-rename on
set  -g  automatic-rename-format '#{b:pane_current_path}'
set  -g  set-titles on
set  -g  set-titles-string '#h ❐ #S ❙ #I ❙ #W'
set  -g  detach-on-destroy off
set  -g  mouse on
setw -g  mode-keys vi
setw -g  alternate-screen on

# Activity / bell — flag'ler için (window-status-{activity,bell}-style burada çalışır)
setw -g  monitor-activity on
setw -g  monitor-bell     on
set  -g  visual-activity  off
set  -g  visual-bell      off
set  -g  bell-action      any

# Pane çerçevesi + üst başlık (her pane'in üzerinde çalışan komut + dizin)
set  -g  pane-border-lines single
set  -gF  pane-border-style       'fg=#{@cat_overlay0},bg=default'
set  -gF  pane-active-border-style 'fg=#{@cat_mauve},bg=default'
# Pane border başlık (kapalı — açmak için yorum kaldır; her pane'in üst kenarında
# çalışan komut + dizin yazar)
#set  -g  pane-border-status top
#set  -g  pane-border-format ' #[fg=#{?pane_active,#{@cat_mauve},#{@cat_subtext0}},bold]#{pane_current_command} #[fg=#{@cat_overlay0},italics,nobold]· #{b:pane_current_path}#[default] '


# ─── 3) KEY BINDINGS ───────────────────────────────────────────────────────────

# Prefix → C-a (screen uyumlu, kolay)
unbind C-b
set  -g  prefix C-a
bind C-a send-prefix
bind C-a last-window

# Config reload
bind R source-file ~/.config/tmux/tmux.conf \; display-message "Config reloaded!"

# ── Window
bind A      command-prompt "rename-window %%"
bind q      confirm-before -p "Kill window #W? (y/n)" kill-window
bind C-q    confirm-before -p "Kill pane? (y/n)" kill-pane
bind x      kill-pane
bind C-n    next-window
bind C-p    previous-window
bind Tab    run-shell "sesh last"
bind c      run-shell -b "~/.local/bin/tm tmx --layout 1 >/dev/null 2>&1"
bind 0      run-shell -b "~/.local/bin/tm tmx --layout 3 >/dev/null 2>&1"

# Pane numarası göstergesi (Türkçe klavye 'ü')
bind -T prefix ü display-panes -d 0

# ── Pane navigation (vim tarzı)
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# ── Pane resize (repeatable)
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5

# ── Pane split (mevcut dizinde aç)
bind _ split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"

# ── Pane kontrolleri
bind z resize-pane -Z
bind Y set-window-option synchronize-panes \; display-message "synchronize-panes: #{?pane_synchronized,on,off}"

# ── Pane swap (window içinde yer değiştir)
bind -r '{'     swap-pane -U                                   # bir önceki pane ile yer değiştir
bind -r '}'     swap-pane -D                                   # bir sonraki pane ile yer değiştir
bind -r S-Left  swap-pane -U
bind -r S-Right swap-pane -D

# ── Window switching by number  (prefix + N → window N, 1-9)
bind 1 select-window -t :=1
bind 2 select-window -t :=2
bind 3 select-window -t :=3
bind 4 select-window -t :=4
bind 5 select-window -t :=5
bind 6 select-window -t :=6
bind 7 select-window -t :=7
bind 8 select-window -t :=8
bind 9 select-window -t :=9

# ── Vim/nvim-aware pane navigation (Ctrl + h/j/k/l)
#   Pane'de vim/nvim çalışıyorsa key vim'e gider (vim window'larını gezer).
#   Çalışmıyorsa tmux pane'lerini gezer.
#   C-l ayrıca shell clear-screen davranışını korur (vim dışında).
bind -n C-h if-shell "ps -o state= -o comm= -t '#{pane_tty}' | grep -iqE '^[^TXZ ]+ +(\\S+/)?g?(view|n?vim?x?)(diff)?$'" 'send-keys C-h' 'select-pane -L'
bind -n C-j if-shell "ps -o state= -o comm= -t '#{pane_tty}' | grep -iqE '^[^TXZ ]+ +(\\S+/)?g?(view|n?vim?x?)(diff)?$'" 'send-keys C-j' 'select-pane -D'
bind -n C-k if-shell "ps -o state= -o comm= -t '#{pane_tty}' | grep -iqE '^[^TXZ ]+ +(\\S+/)?g?(view|n?vim?x?)(diff)?$'" 'send-keys C-k' 'select-pane -U'
bind -n C-l if-shell "ps -o state= -o comm= -t '#{pane_tty}' | grep -iqE '^[^TXZ ]+ +(\\S+/)?g?(view|n?vim?x?)(diff)?$'" 'send-keys C-l' 'send-keys C-l'

# ── Copy mode
bind Enter copy-mode
bind -T copy-mode-vi v   send-keys -X begin-selection
bind -T copy-mode-vi C-v send-keys -X rectangle-toggle
bind -T copy-mode-vi h   send-keys -X cursor-left
bind -T copy-mode-vi l   send-keys -X cursor-right
bind -T copy-mode-vi k   send-keys -X cursor-up
bind -T copy-mode-vi j   send-keys -X cursor-down
bind -T copy-mode-vi e   send-keys -X next-word-end
bind -T copy-mode-vi K   send-keys -N 5 -X cursor-up
bind -T copy-mode-vi J   send-keys -N 5 -X cursor-down

# ── Clipboard (Wayland → wl-copy, X11 → xclip, fallback → in-tmux)
if-shell 'command -v wl-copy >/dev/null 2>&1' {
    bind -T copy-mode-vi Enter             send-keys -X copy-pipe-and-cancel "wl-copy"
    bind -T copy-mode-vi y                 send-keys -X copy-pipe-and-cancel "wl-copy"
    bind -T copy-mode-vi MouseDragEnd1Pane send-keys -X copy-pipe-and-cancel "wl-copy"
    bind > choose-buffer 'run "tmux save-buffer -b %% - | wl-copy"'
    bind < run 'wl-paste | tmux load-buffer - && tmux paste-buffer'
} {
    if-shell 'command -v xclip >/dev/null 2>&1' {
        bind -T copy-mode-vi Enter             send-keys -X copy-pipe-and-cancel "xclip -selection clipboard"
        bind -T copy-mode-vi y                 send-keys -X copy-pipe-and-cancel "xclip -selection clipboard"
        bind -T copy-mode-vi MouseDragEnd1Pane send-keys -X copy-pipe-and-cancel "xclip -selection clipboard"
        bind > choose-buffer 'run "tmux save-buffer -b %% - | xclip -selection clipboard"'
        bind < run 'xclip -selection clipboard -o | tmux load-buffer - && tmux paste-buffer'
    } {
        bind -T copy-mode-vi Enter             send-keys -X copy-selection-and-cancel
        bind -T copy-mode-vi y                 send-keys -X copy-selection-and-cancel
        bind -T copy-mode-vi MouseDragEnd1Pane send-keys -X copy-selection-and-cancel
    }
}

# ── Clipse (clipboard history popup)
bind C-v display-popup -E -w 80% -h 70% clipse

# ── Buffer
bind b choose-buffer
bind + choose-buffer 'delete-buffer -b %%'

# ── Cheatsheet popup (prefix + ?)
bind '?' display-popup -E -w 80% -h 80% "cat <<'CHEAT' | less -R
╔════════════════════════════════════════════════════════════════════════════╗
║                  TMUX KISAYOL REHBERİ · Prefix: Ctrl-a                     ║
╚════════════════════════════════════════════════════════════════════════════╝

 SESSION
   prefix + S        Yeni session
   prefix + K        Rename session
   prefix + Tab      Son session (sesh last)
   prefix + Ctrl-t   Sesh switcher (fzf, preview)
   prefix + s        tmux choose-tree (oturum ağacı, önizlemeli)
   prefix + o        anka switcher (live + snapshot + zoxide, 1-9 jump)
   prefix + X        Session öldür (anka)
   prefix + @        Pane'i yeni session yap (anka)
   prefix + g        İsimle session'a geç (anka)

 WINDOW
   prefix + c        Yeni window (tm tmx layout 1)
   prefix + 0        Yeni window (tm tmx layout 3, multi-pane)
   prefix + 1-9      Window N'e geç
   prefix + Ctrl-n   Sonraki window
   prefix + Ctrl-p   Önceki window
   prefix + A        Pencereyi yeniden adlandır
   prefix + q        Pencereyi kapat (onay)
   prefix + R        Config reload
   prefix + w        Choose-tree (session+window picker)

 PANE NAVIGATION
   Ctrl + h/j/k/l    Vim/tmux-aware pane gezme
   prefix + h/j/k/l  Sol/aşağı/yukarı/sağ pane'e geç
   prefix + ü        Pane numaralarını göster (5sn)

 PANE RESIZE & SWAP
   prefix + H/J/K/L  Pane boyutlandır (tekrarlanabilir)
   prefix + {        Bir önceki pane ile yer değiştir
   prefix + }        Bir sonraki pane ile yer değiştir
   prefix + Shift+◀  Pane swap önceki
   prefix + Shift+▶  Pane swap sonraki

 PANE KONTROLLERİ
   prefix + _        Dikey bölme (mevcut dizinde)
   prefix + -        Yatay bölme (mevcut dizinde)
   prefix + z        Zoom aç/kapat
   prefix + x        Pane kapat
   prefix + Y        Sync-panes aç/kapat

 COPY MODE
   prefix + Enter    Copy mode'a gir
   v                 Seçimi başlat (vi)
   Ctrl-v            Dikdörtgen seçim
   y / Enter         Kopyala (Wayland/X11 clipboard)
   e/H/L/K/J         Word-end/start/end of line/5 yukarı/5 aşağı

 BUFFER & CLIPBOARD
   prefix + b        Buffer listesi
   prefix + +        Buffer sil
   prefix + Ctrl-v   Clipse (clipboard history popup)
   prefix + > / <    Buffer'ı clipboard'a / yapıştır

 POPUP'LAR
   prefix + e        Anote text notu
   prefix + E        Anote markdown
   prefix + i        Anote snippet
   prefix + T        Büyük terminal popup
   Alt-m             Anote (genel)
   Alt-h             tm buffer
   Alt-b             tm clip
   Alt-k             tm speed
   Alt-p             Plugin install
   Alt-?             Bu cheatsheet

 PLUGIN BINDINGS
   prefix + u        URL seçici → tarayıcıda aç (extrakto motoru)
   prefix + Ctrl-f   Tmux fzf ana menü
   prefix + m        Fuzzback (history arama)
   prefix + Space    extrakto (fzf ile metin/yol/URL kopyala-yapıştır-aç)
   prefix + I        TPM install
   prefix + U        TPM update

╔════════════════════════════════════════════════════════════════════════════╗
║                       q ile çık ·  /pattern ile ara                        ║
╚════════════════════════════════════════════════════════════════════════════╝
CHEAT
"
bind -n M-'?' display-popup -E -w 80% -h 80% "cat <<'CHEAT' | less -R
$(tmux list-keys 2>/dev/null | grep -v '^bind-key -T copy-mode-vi')
CHEAT
"

# ── Choose-tree (window+session picker) — prefix + w
bind w choose-tree -Zw -F '#{?pane_in_mode,#{@theme_fg_mauve}●,○} #{?#{==:#{session_attached},0},,#{@theme_fg_green}} #{session_name}: #{session_windows}W'

# ── Popup'lar (anote / tm / büyük terminal)
bind 'e' display-popup -w 60% -h 60% -E "~/.local/bin/anote -t"
bind 'E' display-popup -w 60% -h 60% -E "~/.local/bin/anote -Ms"
bind 'i' display-popup -w 60% -h 60% -E "~/.local/bin/anote -S"
bind -n M-m display-popup -w 60% -h 60% -E "~/.local/bin/anote"
bind -n M-h display-popup -w 60% -h 60% -E "~/.local/bin/tm buffer"
bind -n M-b display-popup -w 60% -h 60% -E "~/.local/bin/tm clip"
bind -n M-k display-popup -w 60% -h 60% -E "~/.local/bin/tm speed"
bind T display-popup -w 80% -h 80%

# ── Plugin install popup (Alt-p)
bind -n M-p display-message "Plugin Yükleniyor..." \; display-popup -w 60% -h 60% -E "bash -c 'osc-tmux-plugins-install'"

# ── Session: yeni / rename / sesh switcher
bind S command-prompt -p "New session:" "new-session -d -s '%%'"
bind K command-prompt -p "Rename session:" "rename-session '%%'"
# NOTE: --hide-duplicates intentionally omitted — sesh 2.26.2's path-keyed
# dedup is buggy (drops config entries sharing a path, e.g. 6 Podman VPNs all
# under ~/.podman/vpn). Fix landed upstream in aa8cc11 but isn't in 2.26.2.
bind -r C-t run-shell "sesh connect \"$(
  sesh list --icons --hide-attached | fzf-tmux -p 80%,70% \
    --no-sort --ansi --border-label ' sesh ' --prompt '⚡  ' \
    --header '  ^a all ^t tmux ^g configs ^x zoxide ^d tmux kill ^f find ^r refresh' \
    --bind 'tab:down,btab:up' \
    --bind 'ctrl-a:change-prompt(⚡  )+reload(sesh list --icons --hide-attached)' \
    --bind 'ctrl-t:change-prompt(🪟  )+reload(sesh list -t --icons --hide-attached)' \
    --bind 'ctrl-g:change-prompt(⚙️  )+reload(sesh list -c --icons)' \
    --bind 'ctrl-x:change-prompt(📁  )+reload(sesh list -z --icons)' \
    --bind 'ctrl-f:change-prompt(🔎  )+reload(fd -H -d 2 -t d -E .Trash . ~)' \
    --bind 'ctrl-d:execute-silent(tmux kill-session -t {2..})+change-prompt(🪟  )+reload(sesh list -t --icons --hide-attached)' \
    --bind 'ctrl-r:reload(sesh list --icons --hide-attached)' \
    --preview-window 'right:55%,wrap' \
    --preview 'sesh preview {}'
)\""


# ─── 4) STATUS BAR ─────────────────────────────────────────────────────────────

set  -g  status              on
set  -g  status-position     top
set  -g  status-interval     5
set  -g  status-justify      left
set  -g  status-left-length  1000
set  -g  status-right-length 1000

# Genel status stili (boş alan rengi)
set  -gF  status-style         'fg=#{@cat_subtext0},bg=#{@cat_base},none'
set  -gF  status-left-style    'fg=#{@cat_subtext0},bg=#{@cat_base},none'
set  -gF  status-right-style   'fg=#{@cat_subtext0},bg=#{@cat_base},none'

# Mesaj / komut / mode (selection) stilleri
set  -gF  message-style         'fg=#{@cat_base},bg=#{@cat_lavender},bold'
set  -gF  message-command-style 'fg=#{@cat_yellow},bg=#{@cat_base},bold'
setw -gF  mode-style            'fg=#{@cat_base},bg=#{@cat_mauve},bold'

# Clock-mode
setw -gF clock-mode-colour '#{@cat_accent}'
setw -g  clock-mode-style  24

# Window status (per-window slot)
setw -gF  window-status-style          'fg=#{@cat_overlay2},bg=#{@cat_base},none'
setw -gF  window-status-current-style  'fg=#{@cat_base},bg=#{@cat_accent},bold'
setw -gF  window-status-activity-style 'fg=#{@cat_mauve},bg=default,blink,bold,underscore'
setw -gF  window-status-bell-style     'fg=#{@cat_peach},bg=default,blink,bold,reverse'
setw -gF  window-status-last-style     'fg=#{@cat_blue},bg=default,none'

# NOT: explicit `#[fg=...]` koymadan; böylece tmux otomatik olarak şu state'lere
# göre window-status-{last,activity,bell}-style'ı uygular:
#   normal   → window-status-style          (subtext, plain)
#   son aktif → window-status-last-style     (blue)
#   aktivite  → window-status-activity-style (underscore)
#   bell      → window-status-bell-style     (blink + bold)
setw -g  window-status-format         "#{@theme_b1} #I #{@theme_b2}#W#{?window_zoomed_flag,  ,} #{?window_activity_flag,● ,}#{?window_bell_flag,⚠ ,}"
setw -g  window-status-current-format "#{@theme_b3}#{@theme_b4} #I #W#{?window_zoomed_flag,  ,} #{@theme_b5}"
setw -g  window-status-separator      ""

# ── Status-left: sol blok
#   Separator karakterleri (Nerd Font):
#     main  ``  U+E0B0  · solid left triangle  (bg-change sınırlarında)
#     sub   ``  U+E0B1  · thin chevron         (aynı bg içinde sub-divider / end-fade)
#   Akış: teal " ◉ #S " → surface0 " ⧉ #pairing " → surface1 " online " →
#         (surface1→surface0) → (sub chevron on surface0) → base
set  -g  status-left "#{@theme_b4} ◉ #S #{@theme_b6}#{@theme_b7} ⧉ #{?session_many_attached,⚇ ,}#{@theme_b8}#{@theme_b9} #{@huma_online} #{@theme_b10}#{@theme_b11}#{@theme_b12} "

# ── Status-right: sağ blok
#   Separator karakterleri (Nerd Font):
#     main  ``  U+E0B2  · solid right triangle (bg-change sınırlarında)
#     sub   ``  U+E0B3  · thin chevron         (aynı bg içinde sub-divider / begin-fade)
#   Akış: base → (sub chevron on surface0) → (surface0→base intro) → continuum_save
#         → main triangles arası segment'ler →
#         ... → blue " ⚿ ssh " → teal " ⌘ #h "
set  -g  status-right "#{@theme_b12}#{@theme_b13} #{E:@huma_mode}#{@theme_b14}#{@theme_b15} ◉ #{@anka_status} #{@theme_b12}#{@theme_b13} ♪ #{playerctl_status} #{playerctl_short} #{@theme_b16}#{@theme_b17} #{@huma_battery} #{kripto} #{@theme_b18}#{@theme_b19} ⚿ #{ssh_status} #{@theme_b20}#{@theme_b4} ⌘ #h "


# ─── 5) PLUGIN LIST ────────────────────────────────────────────────────────────

set -g @plugin 'tmux-plugins/tpm'                      # plugin yöneticisi (kendisi)
set -g @plugin 'tmux-plugins/tmux-sensible'            # makul varsayılanlar
set -g @plugin 'kenanpelit/tmux-anka'                  # session kaydet/yükle + switcher + sessionist (resurrect+continuum+sessionx+sessionist yerine)
set -g @plugin 'kenanpelit/tmux-huma'                  # status widget'ları: online + mode + battery + load (online-status + prefix-highlight yerine)
set -g @plugin 'tmux-plugins/tmux-yank'                # gelişmiş yank/clipboard
set -g @plugin 'kenanpelit/tmux-fzf'                   # ana fzf menüsü
set -g @plugin 'kenanpelit/tmux-ssh-status'            # SSH bağlantı göstergesi
set -g @plugin 'roosta/tmux-fuzzback'                  # geçmiş arama (fuzzback)
set -g @plugin 'joshmedeski/tmux-nerd-font-window-name' # Nerd Font icon'lu pencere isimleri
set -g @plugin 'vascomfnunes/tmux-kripto'              # kripto fiyat göstergesi
set -g @plugin 'TheSast/tmux-nav-master'               # vim/tmux pane navigasyon
set -g @plugin 'richin13/tmux-plugin-playerctl'        # MPRIS / playerctl
set -g @plugin 'laktak/extrakto'                       # fzf ile ekrandan metin kopyala/yapıştır/aç


# ─── 6) PLUGIN SETTINGS ────────────────────────────────────────────────────────

# tmux-huma (online + mode + battery + load — online-status + prefix-highlight yerine)
# Widget'lar status-left/right'ta: #{@huma_online} #{E:@huma_mode} #{@huma_battery} #{@huma_load}
set -g @huma-online-host    '1.1.1.1:443'   # TCP probe (53 bazı ağlarda kapalı)
set -g @huma-online-latency 'on'
set -g @huma-load-mem       'on'

# URL açma artık extrakto motoruyla (tmux-fzf-url + tmux-open yerine):
# extrakto popup'ı (prefix+Space) tarayıcıda açsın + url/path filtrelerine erişsin
set -g @extrakto_open_tool    'helium-kenp-default'
set -g @extrakto_filter_order 'all url path word line'
# prefix+u: adanmış URL seçici → tarayıcıda aç (extrakto'nun url motorunu kullanır)
# run-shell yakalar (pane id kesin genişler), sonra popup'ta fzf dosyadan okur.
bind u run-shell -b "tmux capture-pane -p -J -t '#{pane_id}' -S -3000 | python3 ~/.config/tmux/plugins/extrakto/extrakto.py -u | sort -u > /tmp/huma-url.txt; tmux display-popup -E 'fzf --multi < /tmp/huma-url.txt | xargs -r -n1 helium-kenp-default'"

# tmux-fzf (ana menü)
set -g @fzf-bind    'C-f'
set -g @fzf-order   'session|window|pane|command|keybinding|clipboard|process'
set -g @fzf-options '-p -w 50% -h 30% -m'

# tmux-fuzzback
set -g @fuzzback-bind       'm'
set -g @fuzzback-popup       1
set -g @fuzzback-popup-size '70%'

# tmux-kripto
set -g @kripto_id              "bitcoin"
set -g @kripto_currency_symbol " $"
set -g @kripto_ttl             300

# tmux-plugin-playerctl
set -g @short_length    "40"
set -g @status_playing  "▶"
set -g @status_paused   "■"
set -g @status_stopped  "■"

# tmux-anka (resurrect + continuum yerine — tek Rust binary)
set -g @anka-capture-pane-contents 'on'
set -g @anka-restore-processes     'ssh psql mysql sqlite3 npm yarn nvim yazi'
set -g @anka-strategy-nvim         'session'
set -g @anka-save-interval         '10'
set -g @anka-restore-on-start      'on'
set -g @anka-pick-key              'P'    # C-p previous-window'da kalsın

# anka session management (sessionx + sessionist yerine, native)
# Switcher prefix+o (prefix+s tmux choose-tree'de kalsın). Kendi prefix+S=yeni ve
# prefix+K=rename bind'lerimi koruyup anka'nın çakışan new+last'ını kapatıyorum.
set -g @anka-new-key       'none'   # prefix+S zaten yeni session (bind S)
set -g @anka-last-key      'none'   # prefix+Tab zaten son session (sesh last)
set -g @anka-switch-preview 'on'    # çerçeveli renkli canlı önizleme (v0.8.2)
# Geri kalanlar anka varsayılanı: switcher=o, kill=X, promote=@, switch-by-name=g

# tmux-nerd-font-window-name (window name'e icon ekler — komuta göre nvim/git/docker/zsh)
set -g @nerd-font-window-name-show-name 'true'
set -g @nerd-font-window-name-shell-icon ''
set -g @nerd-font-window-name-editor-icon ''

# tmux-nav-master (Ctrl-hjkl yukarıdaki bind -n satırlarınca yönetildiği için pasif kalır)
set -g @navigator-keybindings-no-prefix on

# extrakto (tmux-thumbs yerine — fzf popup)
set -g @extrakto_key       'space'      # prefix + Space
set -g @extrakto_clip_tool 'wl-copy'    # Wayland sistem panosu
# split_direction varsayılan 'a' (auto) → tmux popup kullanır. Filtreler
# (word/path/url/quote) extrakto varsayılanı; ~/.config/extrakto/extrakto.conf ile özelleştirilebilir.

# tmux-yank
set -g @yank_action          'copy-pipe-no-clear'
set -g @yank_with_mouse       on
set -g @yank_selection       'clipboard'
set -g @yank_selection_mouse 'clipboard'


# ─── 7) TPM INIT ───────────────────────────────────────────────────────────────
#  En son satırda olmalı. @plugin deklarasyonlarını tarayıp install/load eder.
#  İlk kurulumda: prefix + I (install), prefix + U (update).

run '~/.config/tmux/plugins/tpm/tpm'
