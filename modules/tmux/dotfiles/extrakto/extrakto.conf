# Kullanıcı extrakto override'ları (~/.config/extrakto/extrakto.conf'a symlink).
# Sadece değiştirmek istediğin alanları yaz; gerisi extrakto varsayılanından gelir.

# URL filtresi: sondaki noktalama/markdown karakterlerini de kırp.
# Varsayılan rstrip ",):" sondaki '.' ve onun koruduğu ')' karakterini bırakıyordu
# (ör. "(https://github.com/kenanpelit/tmux-anka)." → "...tmux-anka).").
# '.' eklenince "...tmux-anka)." → "...tmux-anka" temizlenir.
[url]
rstrip: ,):.
