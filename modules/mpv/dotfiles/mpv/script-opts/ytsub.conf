# Preferred subtitle languages for Alt+Y auto-load.
# The first available language becomes the primary subtitle,
# the second available language becomes the secondary subtitle.
source_langs=en,tr

# Legacy single-language fallback. Leave empty when using source_langs.
source_lang=

# Key bindings
load_autosub_binding=alt+y
autoload_autosub_binding=alt+Y

# Subtitle cache directory relative to $HOME
cache_dir=.cache/ytsub/

# Filter VTT subtitles to single-line output
filter_sub_single_line=no
