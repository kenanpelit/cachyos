# margo-progressbar.lua: the thin line at the bottom that shows where the file is.
# It stays when margo-osc is off (visibility=never) and steps aside while the OSC's controls are on screen.
enabled=yes
# height in a 720-high canvas (3 = 3 px at 720p, scaled with the window like margo-osc)
height=3
# color of the played part (progressbar.lua's purple)
color=#886AD3
# chapter notches on the line
markers=yes
marker_color=#2D2D2D
# the cached ranges of a stream, behind the played part
buffer=no
buffer_color=#886AD3
buffer_alpha=160
# hide while margo-osc's controls are visible (their seekbar shows the same)
hide_with_osc=yes
