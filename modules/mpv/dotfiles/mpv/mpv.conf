############################################################
# mpv.conf — Intel Meteor Lake / i915 / Wayland / PipeWire
# Donanım: ThinkPad E14 Gen 6 / Core Ultra 7 155H / Intel Arc MTL
#
# Bu sürümün hedefi:
#  - Ses/görüntü uyumunu korumak
#  - Lag/micro-stutter hissini azaltmak
#  - YouTube'da AV1'i tamamen dışlamak
#  - 1440p60 yerine 1080p60'ı varsayılan yapmak
#  - VP9'u öncelemek, sorun olursa H.264'e düşmek
#  - PipeWire + VAAPI + Wayland ile sade ve stabil çalışmak
#
# Not:
#  - display-resample ve interpolation bu sistemde A/V sync bozduğu için kapalıdır.
#  - 1440p60 istersen manuel olarak --profile=youtube-1440p kullan.
############################################################

script-opts=ytdl_hook-ytdl_path=yt-dlp-mpv

#######################
# GPU / Video Backend
#######################

vo=gpu
gpu-api=opengl
gpu-context=wayland

# Intel Meteor Lake iGPU için VAAPI donanım decode.
# CPU yükünü düşürür, VP9/H.264/HEVC videolarda daha stabil oynatma sağlar.
hwdec=vaapi

# AV1 bilinçli olarak yok.
# YouTube format seçiminde de AV1 ayrıca dışlanıyor.
hwdec-codecs=h264,hevc,vp8,vp9

# Tek Intel iGPU kullandığın için render node'u açıkça belirtiyoruz.
vaapi-device=/dev/dri/renderD128

# VP9/HEVC decode sırasında yüzey kuyruğunu rahatlatır.
# 4K/1440p içerikte kısa takılmaları azaltabilir.
hwdec-extra-frames=32

# Kaliteyi bozmamak için fast decode kapalı.
vd-lavc-fast=no
vd-lavc-skiploopfilter=none
vd-lavc-check-hw-profile=yes

# Direct rendering: mümkünse gereksiz kopyalamayı azaltır.
vd-lavc-dr=yes
vd-lavc-assume-old-x264=no

# Intel Mesa/OpenGL tarafında texture aktarımını rahatlatır.
opengl-pbo=yes

# display-resample kullanmadığımız için erken flush tekrar açık.
# Wayland'de latency hissini azaltabilir.
opengl-early-flush=yes

gpu-shader-cache-dir=~/.cache/mpv/shaders

# Wayland compositor ile çakışmayı azaltmak için auto.
wayland-internal-vsync=auto
wayland-edge-pixels-pointer=10
wayland-edge-pixels-touch=10

#######################
# Video Sync / A-V Uyum
#######################

# Bu sistemde display-resample A/V uyumu bozduğu için kullanılmıyor.
# Ses ana referans alınır, video sese yetişir.
video-sync=audio

# Interpolation bu sistemde hem lag hem desync yaptığı için kapalı.
interpolation=no

# Video geride kalırsa decoder seviyesinde frame drop'a izin verir.
# Bu, ses/görüntü uyumunu korumak için önemlidir.
framedrop=decoder

# Çok dar tolerans micro-stutter yapabilir, çok geniş tolerans desync hissi verir.
# 100ms dengeli bir değerdir.
video-sync-max-video-change=0.100
video-sync-max-audio-change=0.100

#######################
# Ölçekleme / Görüntü Kalitesi
#######################

# spline36 yerine lanczos:
# Daha hafif, hâlâ kaliteli, frame pacing açısından daha güvenli.
scale=lanczos
cscale=lanczos

# Downscale için dengeli ve temiz sonuç.
dscale=mitchell

# Deband kapalı.
# Açılırsa GPU frametime artabilir ve lag hissi oluşabilir.
# deband=yes
# deband-iterations=2
# deband-threshold=48
# deband-range=16
# deband-grain=32

#######################
# Seek / Playback
#######################

hr-seek=yes

# Seek sonrası takılmayı azaltmak için frame drop'a izin verilir.
hr-seek-framedrop=yes

save-position-on-quit=yes
resume-playback=yes
watch-later-directory=~/.cache/mpv/watch_later

# YouTube playlist prefetch arka planda gereksiz yük oluşturabilir.
prefetch-playlist=no

#######################
# Cache / I-O
#######################

demuxer-thread=yes
cache=yes

# Çok büyük cache her zaman daha akıcı yapmaz.
# YouTube tarafında daha dengeli buffer tercih edildi.
demuxer-readahead-secs=30
cache-secs=90
demuxer-max-bytes=180MiB
demuxer-max-back-bytes=50MiB

# Buffer düşükse kısa süre bekler.
# 2.5 sn yerine 1.5 sn: daha az bekleme, yeterli toparlama.
cache-pause=yes
cache-pause-wait=1.5
cache-pause-initial=yes

#######################
# Threading
#######################

# VAAPI aktifken decode işi çoğunlukla GPU'dadır.
# Aşırı thread scheduling yükü yaratmasın diye makul değerler.
vd-lavc-threads=4
ad-lavc-threads=2

#######################
# Ses / PipeWire
#######################

ao=pipewire

# Hız değişimlerinde pitch bozulmasını engeller.
audio-pitch-correction=yes

audio-channels=stereo
gapless-audio=weak
audio-normalize-downmix=yes

# YouTube ve modern streamlerde doğal değer.
audio-samplerate=48000

# 0.15 bazı sistemlerde düşük kalabilir.
# 0.20 PipeWire için daha güvenli.
audio-buffer=0.20

# PipeWire'da gereksiz sessizlik stream'i açmıyoruz.
audio-stream-silence=no
audio-wait-open=0.5

# ÖNEMLİ:
# pulse-buffer ve pulse-latency-hacks kaldırıldı.
# Çünkü ao=pipewire kullanılıyor; PulseAudio hack'leri burada gereksizdir.

#######################
# Pencere / UI
#######################

input-ipc-server=/tmp/mpvsocket

border=no
keep-open=yes
idle=once
msg-color=yes
msg-module=yes

cursor-autohide=300
cursor-autohide-fs-only=no

# Margo floating window-rule mpv'yi 640x360'a sabitliyor; autofit'i de
# onunla eşitledik. Aksi halde mpv kendi (daha büyük) boyutunda buffer
# açıp compositor'un 640x360 frame'iyle desync olur -> içerik pencereye
# ölçeklenmeden açılır, ancak elle resize edince düzelir.
autofit=640x360
autofit-larger=640x360
# Video yüklenince mpv buffer'ı kendi boyutuna geri büyütmesin (desync'in
# asıl tetikleyicisi); boyutu compositor yönetsin.
auto-window-resize=no

# geometry kaldırıldı.
# Wayland compositor pencere yönetimini kendisi daha sağlıklı yapar.
force-window=immediate

osc=no

osd-bar=yes
osd-bar-align-y=1
osd-bar-h=2
osd-bar-w=60
osd-duration=2000
osd-level=1

osd-font='Hack Nerd Font'
osd-font-size=24
osd-color='#CCFFFFFF'
osd-border-color='#DD322640'
osd-border-size=1
osd-shadow-color='#000000'
osd-shadow-offset=1
osd-spacing=0.5

#######################
# Altyazı
#######################

# Eski config'teki tekrar eden sub-auto temizlendi.
sub-auto=fuzzy

# Tek satırda tüm altyazı klasörleri.
sub-file-paths=subs;subtitles;ass;srt;sub

sub-scale=1.0
sub-fix-timing=yes
sub-ass-override=force
sub-gauss=0.6
sub-filter-sdh=yes
sub-filter-regex-warn=no
sub-visibility=yes

# iGPU için daha hafif.
blend-subtitles=no

sub-fonts-dir=~/.local/share/fonts
sub-font='Hack Nerd Font'
sub-font-size=36
sub-color='#FFFFFF'
sub-border-color='#000000'
sub-border-size=2
sub-shadow-offset=1
sub-shadow-color='#000000'

#######################
# Screenshot
#######################

screenshot-directory=~/Pictures/mpv-screenshots
screenshot-template="%F-%P"
screenshot-format=png
screenshot-high-bit-depth=yes
screenshot-png-compression=7
screenshot-tag-colorspace=yes

#######################
# Dil
#######################

slang=tur,tr,eng,en
alang=tur,tr,eng,en

#######################
# Ağ / Stream Dayanıklılığı
#######################

network-timeout=20
rtsp-transport=tcp
tls-verify=yes

# Stream kopmalarında yeniden bağlanma.
stream-lavf-o-append=reconnect_streamed=1
stream-lavf-o-append=reconnect_on_network_error=1
stream-lavf-o-append=reconnect_on_http_error=4xx,5xx
stream-lavf-o-append=reconnect_delay_max=20
stream-lavf-o-append=multiple_requests=1

# YouTube CDN tarafında bağlantı rotasyonuna daha toleranslı olabilir.
stream-lavf-o-append=http_persistent=0

#######################
# Log
#######################

msg-level=ffmpeg=error
msg-level=demux=error
msg-level=cplayer=warn
msg-level=vaapi=info

############################################################
# PROTOKOL PROFİLLERİ
############################################################

[protocol.https]
profile-desc="HTTPS / YouTube Smooth-Stable Streaming"

cache=yes
demuxer-max-bytes=180MiB
demuxer-readahead-secs=25
cache-secs=90
force-window=immediate

[protocol.http]
profile-desc="HTTP Smooth-Stable Streaming"

cache=yes
demuxer-max-bytes=120MiB
demuxer-readahead-secs=20
cache-secs=60
force-window=immediate

[protocol.file]
profile-desc="Local File Playback"

# Lokal dosyada cache genellikle gereksizdir.
cache=no
demuxer-max-bytes=50MiB
force-seekable=yes
force-window=immediate

############################################################
# OTOMATİK PROFİLLER
############################################################

[youtube-content]
profile-desc="YouTube: AV1 Disabled, VP9 Preferred, 1080p60 Stable"
profile-cond=path and path:match("youtu%.?be") ~= nil
profile=protocol.https

# Varsayılan YouTube seçimi:
#  1) 1080p60 VP9
#  2) 1080p60 H.264 / AVC1
#  3) 1440p30 VP9
#  4) AV1 olmayan fallback
#
# Neden 1080p60?
# 1440p60 VP9 bazı Wayland/i915 kombinasyonlarında lag/micro-stutter yapabiliyor.
# Önce akıcılık ve A/V sync garantiye alınıyor.
ytdl-format=bestvideo*[height<=?1080][fps<=?60][vcodec*=vp9]+bestaudio/bestvideo*[height<=?1080][fps<=?60][vcodec*=avc1]+bestaudio/bestvideo*[height<=?1440][fps<=?30][vcodec*=vp9]+bestaudio/bestvideo*[height<=?1440][fps<=?60][vcodec!*=av01][vcodec!*=av1]+bestaudio/best[height<=?1440]

# Sadece Türkçe ve İngilizce altyazı.
ytdl-raw-options-append=sub-langs=tr.*,en.*
ytdl-raw-options-append=write-subs=
ytdl-raw-options-append=write-auto-subs=

# Playlist otomatik açılmasın.
ytdl-raw-options-append=no-playlist=

# Canlı yayınlarda baştan başlatma davranışını kapat.
ytdl-raw-options-append=no-live-from-start=

# YouTube'da da ana sync politikası korunur.
video-sync=audio
interpolation=no
framedrop=decoder

demuxer-lavf-o-append=analyzeduration=2000000

[4k-video]
profile-desc="4K Content: AV1 Disabled, Bigger Buffer"

profile-cond=(width and width >= 3840) or (height and height >= 2160)

hwdec=vaapi
hwdec-extra-frames=40

# 4K için buffer artırıldı ama eski config kadar agresif değil.
demuxer-max-bytes=500MiB
demuxer-readahead-secs=45
cache-secs=180

# 4K'da da A/V sync korunur.
video-sync=audio
interpolation=no
framedrop=decoder

# 4K YouTube açılırsa AV1 yine dışarıda.
ytdl-format=bestvideo*[height<=?2160][fps<=?60][vcodec*=vp9]+bestaudio/bestvideo*[height<=?2160][fps<=?60][vcodec*=avc1]+bestaudio/bestvideo*[height<=?2160][fps<=?60][vcodec!*=av01][vcodec!*=av1]+bestaudio/best[height<=?2160]

[live-hls]
profile-desc="Live HLS/DASH: Low Latency, Audio-Sync"

# Canlı yayında büyük cache gecikme üretir.
cache=yes
cache-secs=8
demuxer-readahead-secs=10
demuxer-max-bytes=80MiB

# Canlı yayında ses uyumu ve düşük latency öncelikli.
video-sync=audio
interpolation=no
framedrop=decoder

hr-seek=no
audio-buffer=0.10

# Bozuk frame/segment gelirse atla.
demuxer-lavf-o-append=fflags=+discardcorrupt

# Hızlı analiz.
demuxer-lavf-analyzeduration=5

[live-hls-auto]
profile-desc="Auto-detect HLS/m3u8 Streams"

profile-cond=(path and path:match("%.m3u8")) or (demuxer == "hls")
profile=live-hls

[twitch]
profile-desc="Twitch Streaming"

profile-cond=path and path:match("twitch%.tv") ~= nil
profile=live-hls

# Twitch tarafında persistent/multiple request faydalı olabilir.
demuxer-lavf-o-append=http_persistent=1
demuxer-lavf-o-append=http_multiple_requests=1

############################################################
# MANUEL PROFİLLER
############################################################

[youtube-1440p]
profile-desc="Manual YouTube 1440p60, AV1 Disabled"

# Varsayılan değil.
# Sadece 1080p60 akıcıysa bunu dene.
ytdl-format=bestvideo*[height<=?1440][fps<=?60][vcodec*=vp9]+bestaudio/bestvideo*[height<=?1440][fps<=?60][vcodec*=avc1]+bestaudio/bestvideo*[height<=?1440][fps<=?60][vcodec!*=av01][vcodec!*=av1]+bestaudio/best[height<=?1440]

[force-h264]
profile-desc="Force H.264 / AVC1 for YouTube if VP9 lags"

# VP9 decode veya frame pacing sorun çıkarırsa bunu kullan.
# Kalite/verim VP9 kadar iyi olmayabilir ama bazı sistemlerde daha akıcıdır.
ytdl-format=bestvideo*[height<=?1080][fps<=?60][vcodec*=avc1]+bestaudio/bestvideo*[height<=?1080][vcodec*=avc1]+bestaudio/best[height<=?1080]

[avsync-audio-master]
profile-desc="Strict Audio Master Sync"

video-sync=audio
interpolation=no
framedrop=decoder+vo

[high-quality]
profile-desc="Maximum Quality, More GPU Load"

# Lag yoksa kalite artırmak için.
scale=ewa_lanczossharp
cscale=ewa_lanczossharp
dscale=mitchell
deband=yes
deband-iterations=4
deband-threshold=50
deband-range=16
deband-grain=48

[vulkan]
profile-desc="Experimental Vulkan Renderer"

# Deneysel.
# Sorun çıkarırsa OpenGL'e dön.
vo=gpu-next
gpu-api=vulkan
gpu-context=wayland
hwdec=vaapi

[low-latency]
profile-desc="Minimal Latency"

# Kayıt/ekran paylaşımı/canlı içerik için.
video-sync=audio
interpolation=no
cache=no
demuxer-thread=no
audio-buffer=0.05
untimed=yes

[fast]
profile-desc="Troubleshooting / Low Load"

# Decode ve scaler yükünü minimuma indirir.
vo=gpu
gpu-api=opengl
gpu-context=wayland
hwdec=no
video-sync=audio
interpolation=no
framedrop=decoder
scale=bilinear
cscale=bilinear
dscale=bilinear

############################################################
# KULLANIM NOTLARI
#
# Normal:
#   mpv URL
#
# YouTube 1440p60 denemesi:
#   mpv --profile=youtube-1440p URL
#
# VP9 hâlâ lag yaparsa H.264 zorla:
#   mpv --profile=force-h264 URL
#
# A/V sync hâlâ kayarsa:
#   mpv --profile=avsync-audio-master URL
#
# 4K takılırsa:
#   mpv --hwdec=vaapi-copy URL
#   veya:
#   mpv --profile=fast URL
#
# VAAPI aktif mi görmek için:
#   mpv --msg-level=vaapi=debug URL
#
# Oynatma sırasında istatistik:
#   Shift+i
############################################################
