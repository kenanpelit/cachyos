# ════════════════════════════════════════════════════════════════════════════
# Walker — Application launcher (margo / wlroots)
#
# Hangi compositor:  margo (dwl/wlroots)
# Pencere yönetimi:  zwlr_foreign_toplevel_v1 → walker windows çalışır
# IPC:               mctl dispatch ...   (mmsg DEĞİL, hatırla!)
# Bar/shell:         mshell (~/.config/margo/mshell.toml)
#
# Bu config Walker v2 + Elephant ile çalışır. Bütün "providers"
# satırlarındaki isimler  `elephant listproviders`  çıktısına birebir
# eşleşir.  Açmak için margo keybind:
#
#   bind = super,space,spawn,walker             # toggle (close_when_open)
#   bind = super,delete,spawn,walker -m menus:sysops
# ════════════════════════════════════════════════════════════════════════════

# ── General ────────────────────────────────────────────────────────────────
force_keyboard_focus     = true
close_when_open          = true     # Aynı binding tekrar basılırsa kapat
click_to_close           = true
selection_wrap           = false
global_argument_delimiter = "#"
exact_search_prefix      = "'"
theme                    = "default"
disable_mouse            = false
debug                    = false

# NOT: Walker'da TOML üzerinden width/height geçerli değil. Boyut GTK CSS
# tarafından belirleniyor → themes/default/style.css içindeki
# `.box-wrapper { min-width / min-height }` kuralı ayarlıyor.

# ── Layer-shell konumu ─────────────────────────────────────────────────────
# Walker layer surface ekranın TAMAMINI kaplar (overlay layer, 4 anchor),
# içindeki  .box-wrapper  CSS halign/valign = center ile orta-orta'ya
# yerleşir. Tüm 4'ü false yaparsan compositor 0,0 köşeye koyar — istemediğin
# davranış. Bu yüzden hepsi true.
[shell]
exclusive_zone = -1
layer          = "overlay"
anchor_top     = true
anchor_bottom  = true
anchor_left    = true
anchor_right   = true

# ── Placeholders ───────────────────────────────────────────────────────────
[placeholders]
"default"             = { input = "Ara...",              list = "Sonuç yok" }
"desktopapplications" = { input = "Uygulama başlat",      list = "Uygulama bulunamadı" }
"files"               = { input = "Dosya ara",            list = "Dosya yok" }
"runner"              = { input = "Komut çalıştır",       list = "Komut yok" }
"calc"                = { input = "Hesapla",              list = "Sonuç yok" }
"websearch"           = { input = "Webde ara",            list = "Arama motoru seç" }
"clipboard"           = { input = "Pano geçmişi",         list = "Pano boş" }
"windows"             = { input = "Pencere seç",          list = "Açık pencere yok" }
"symbols"             = { input = "Emoji / sembol",       list = "Sonuç yok" }
"todo"                = { input = "Yapılacak iş",         list = "Liste boş" }
"menus:sysops"        = { input = "Sistem işlemleri",     list = "Eşleşme yok" }
"menus:margo"         = { input = "Margo / mshell",       list = "Eşleşme yok" }
"menus:wallpapers"    = { input = "Duvar kâğıdı",         list = "Eşleşme yok" }
"menus:scripts"       = { input = "Script",               list = "Eşleşme yok" }
"menus:other"         = { input = "Hızlı işlem",          list = "Eşleşme yok" }

# ── Keybindings (Vim + Emacs hybrid) ───────────────────────────────────────
[keybinds]
close              = ["Escape", "ctrl c", "ctrl q"]
next               = ["Down", "ctrl j", "ctrl n"]
previous           = ["Up", "ctrl k", "ctrl p"]
page_down          = ["Page_Down", "ctrl f"]
page_up            = ["Page_Up", "ctrl b"]
first              = ["Home", "g g"]
last               = ["End", "shift g"]
forward_word       = ["ctrl Right", "alt f"]
backward_word      = ["ctrl Left", "alt b"]
toggle_exact       = ["ctrl e"]
resume_last_query  = ["ctrl r"]
quick_activate     = ["1", "2", "3", "4", "5", "6", "7", "8", "9", "ctrl Return"]

# ── Providers ──────────────────────────────────────────────────────────────
[providers]
# Boş arama ile karışık sonuçlar göstereceği için DEFAULT'u dar tut.
default = [
  "desktopapplications",
  "calc",
  "runner",
  "websearch",
  "windows",
]

# Boş input — sık kullanılanlar görünür. Windows önce gelir ki Alt-Tab
# benzeri akış doğal olsun (wlr-foreign-toplevel margo'da destekli).
empty = [
  "windows",
  "desktopapplications",
  "menus:scripts",
  "menus:sysops",
]

max_results = 100

# ── Prefix routing (hızlı erişim) ─────────────────────────────────────────
# Tek harfli prefix + boşluk → o provider'a girer. Örn: "c 2+2", "w" (pencere
# listesi), "ms reboot".
[[providers.prefixes]]
prefix = "p"
provider = "providerlist"

[[providers.prefixes]]
prefix = "f"
provider = "files"

[[providers.prefixes]]
prefix = "r"
provider = "runner"

[[providers.prefixes]]
prefix = "c"
provider = "calc"

[[providers.prefixes]]
prefix = "q"
provider = "websearch"

[[providers.prefixes]]
prefix = "v"
provider = "clipboard"

[[providers.prefixes]]
prefix = "e"
provider = "symbols"

[[providers.prefixes]]
prefix = "t"
provider = "todo"

[[providers.prefixes]]
prefix = "m"
provider = "menus"

[[providers.prefixes]]
prefix = "w"
provider = "windows"

[[providers.prefixes]]
prefix = "b"
provider = "bluetooth"

[[providers.prefixes]]
prefix = "s"
provider = "snippets"

[[providers.prefixes]]
prefix = "u"
provider = "unicode"

# ── İki-harfli menu kısayolları ───────────────────────────────────────────
[[providers.prefixes]]
prefix = "mo"
provider = "menus:other"

[[providers.prefixes]]
prefix = "ms"
provider = "menus:scripts"

[[providers.prefixes]]
prefix = "mt"
provider = "menus:sysops"     # T = sysoT — "sistem"

[[providers.prefixes]]
prefix = "mw"
provider = "menus:wallpapers"

[[providers.prefixes]]
prefix = "mm"
provider = "menus:margo"        # margo + mshell kontrol paneli

# ── Provider-spesifik ayar ────────────────────────────────────────────────
[providers.clipboard]
time_format = "%d.%m. - %H:%M"

# ── Per-provider max results ──────────────────────────────────────────────
[providers.max_results_provider]
desktopapplications = 50
files               = 30
runner              = 20
websearch           = 10
clipboard           = 100
windows             = 30
todo                = 30
bluetooth           = 15
snippets            = 25
menus               = 20
symbols             = 30
unicode             = 30

# ── Provider actions (her provider için keybind seti) ─────────────────────
[providers.actions]
desktopapplications = [
  { action = "start",         default = true, bind = "Return" },
  { action = "start:keep",    label = "aç + kalsın", bind = "shift Return", after = "KeepOpen" },
  { action = "pin",           bind = "ctrl p", after = "AsyncReload" },
  { action = "unpin",         bind = "ctrl p", after = "AsyncReload" },
  { action = "erase_history", label = "geçmişi sil", bind = "ctrl h", after = "AsyncReload" },
]

files = [
  { action = "open",     default = true, bind = "Return" },
  { action = "opendir",  label = "dizini aç", bind = "ctrl Return" },
  { action = "copypath", label = "yolu kopyala", bind = "ctrl shift c" },
  { action = "copyfile", label = "dosyayı kopyala", bind = "ctrl c" },
]

runner = [
  { action = "run",         default = true, bind = "Return" },
  { action = "runterminal", label = "terminalde çalıştır", bind = "shift Return" },
  { action = "erase_history", label = "geçmişi sil", bind = "ctrl h", after = "Reload" },
]

calc = [
  { action = "copy",   default = true, bind = "Return" },
  { action = "delete", bind = "ctrl d", after = "AsyncReload" },
  { action = "save",   bind = "ctrl s", after = "AsyncClearReload" },
]

websearch = [
  { action = "search",        default = true, bind = "Return" },
  { action = "erase_history", label = "geçmişi sil", bind = "ctrl h", after = "Reload" },
]

clipboard = [
  { action = "copy",          default = true, bind = "Return" },
  { action = "remove",        bind = "ctrl d", after = "ClearReload" },
  { action = "remove_all",    global = true, label = "hepsini sil", bind = "ctrl shift d", after = "ClearReload" },
  { action = "toggle_images", global = true, label = "resim aç/kapa", bind = "ctrl i", after = "ClearReload" },
  { action = "edit",          bind = "ctrl o" },
]

symbols = [
  { action = "run_cmd", label = "seç", default = true, bind = "Return" },
  { action = "erase_history", label = "geçmişi sil", bind = "ctrl h", after = "Reload" },
]

unicode = [
  { action = "run_cmd", label = "seç", default = true, bind = "Return" },
  { action = "erase_history", label = "geçmişi sil", bind = "ctrl h", after = "Reload" },
]

providerlist = [
  { action = "activate", default = true, bind = "Return", after = "ClearReload" },
]

todo = [
  { action = "save",     default = true, bind = "Return", after = "ClearReload" },
  { action = "delete",   bind = "ctrl d", after = "ClearReload" },
  { action = "active",   bind = "Return", after = "ClearReload" },
  { action = "inactive", bind = "Return", after = "ClearReload" },
  { action = "done",     bind = "ctrl f", after = "ClearReload" },
  { action = "clear",    bind = "ctrl x", after = "ClearReload", global = true },
]

bluetooth = [
  { action = "find",       global = true, bind = "ctrl f", after = "AsyncClearReload" },
  { action = "trust",      bind = "ctrl t", after = "AsyncReload" },
  { action = "untrust",    bind = "ctrl t", after = "AsyncReload" },
  { action = "pair",       bind = "Return", after = "AsyncReload" },
  { action = "remove",     bind = "ctrl d", after = "AsyncReload" },
  { action = "connect",    bind = "Return", after = "AsyncReload" },
  { action = "disconnect", bind = "Return", after = "AsyncReload" },
]

# margo: walker windows zwlr_foreign_toplevel_v1 üzerinden çalışır.
# focus → toplevel.activate; close → toplevel.close.
windows = [
  { action = "focus", default = true, bind = "Return" },
  { action = "close", bind = "ctrl w" },
]

snippets = [
  { action = "paste", default = true, bind = "Return" },
  { action = "copy",  bind = "ctrl c" },
]

menus = [
  { action = "open", default = true, bind = "Return" },
]

# ════════════════════════════════════════════════════════════════════════════
# KISAYOL ÖZETİ
# ════════════════════════════════════════════════════════════════════════════
#
# NAVIGATION
#   j / k                Alt / üst
#   Ctrl+f / Ctrl+b      Sayfa alt / üst
#   gg / G               Liste başı / sonu
#
# PROVIDER PREFIX (bir harf + boşluk)
#   p   providerlist          c   calc                v   clipboard
#   f   files                 q   websearch           e   symbols (emoji)
#   r   runner                w   windows             u   unicode
#   t   todo                  b   bluetooth           s   snippets
#   m   menus                 mo  menus:other         ms  menus:scripts
#   mt  menus:sysops          mw  menus:wallpapers
#
# SEARCH
#   '            Exact-match prefix (yazmadan önce ')
#   Ctrl+E       Exact toggle
#   Ctrl+R       Önceki sorguyu geri getir
#
# COMMON ACTIONS
#   Return            Activate / aç
#   Shift+Return      Alternatif (terminalde, sekmede, vs.)
#   Ctrl+P            Pin / unpin
#   Ctrl+D            Sil
#   Ctrl+H            Geçmişi temizle
#   1..9 / Ctrl+Ret   Quick activate (kapatmadan tetikle)
#
# EXIT
#   Esc / Ctrl+C / Ctrl+Q     Walker'ı kapat
#
# ════════════════════════════════════════════════════════════════════════════
