# ════════════════════════════════════════════════════════════════════════════
# Walker — margo (dwl/wlroots) için launcher
#
#   IPC client     :  mctl   (mmsg DEĞİL)
#   Pencere listesi:  zwlr_foreign_toplevel_v1  → windows provider çalışır
#   Bar/shell      :  mshell  (~/.config/margo/mshell.toml)
#   Menü dosyaları :  ~/.config/elephant/menus/*.toml
#
#   Provider isimleri  `elephant listproviders`  çıktısına birebir eşleşir.
#
# Margo keybind:
#   bind = super,space,spawn,walker                       # toggle
#   bind = super,delete,spawn,walker -m menus:sysops      # power menu
#
# Boyut: Walker TOML'da width/height YOK — themes/default/style.css içinde
# `.box-wrapper { min-width / min-height }` belirler.
# ════════════════════════════════════════════════════════════════════════════

# ── General ────────────────────────────────────────────────────────────────
force_keyboard_focus      = true
close_when_open           = true     # aynı binding tekrar basılırsa kapat
click_to_close            = true
selection_wrap            = false
global_argument_delimiter = "#"
exact_search_prefix       = "'"
theme                     = "default"
disable_mouse             = false
debug                     = false

# ── Layer-shell ────────────────────────────────────────────────────────────
# Surface tüm ekranı kaplar (4 anchor true); içerideki .box-wrapper CSS
# halign/valign=center ile orta-orta'ya yerleşir. Anchor'lardan biri false
# olursa compositor 0,0 köşeye yerleştirir.
[shell]
exclusive_zone = -1
layer          = "overlay"
anchor_top     = true
anchor_bottom  = true
anchor_left    = true
anchor_right   = true

# ── Placeholders ───────────────────────────────────────────────────────────
[placeholders]
"default"             = { input = "Ara...",           list = "Sonuç yok" }
"desktopapplications" = { input = "Uygulama başlat",  list = "Uygulama bulunamadı" }
"files"               = { input = "Dosya ara",        list = "Dosya yok" }
"runner"              = { input = "Komut çalıştır",   list = "Komut yok" }
"calc"                = { input = "Hesapla",          list = "Sonuç yok" }
"websearch"           = { input = "Webde ara",        list = "Arama motoru seç" }
"clipboard"           = { input = "Pano geçmişi",     list = "Pano boş" }
"windows"             = { input = "Pencere seç",      list = "Açık pencere yok" }
"symbols"             = { input = "Emoji / sembol",   list = "Sonuç yok" }
"todo"                = { input = "Yapılacak iş",     list = "Liste boş" }
"bluetooth"           = { input = "Bluetooth cihazı", list = "Cihaz yok" }
"snippets"            = { input = "Snippet",          list = "Snippet yok" }
"menus:margo"         = { input = "Margo / mshell",   list = "Eşleşme yok" }
"menus:sysops"        = { input = "Sistem işlemleri", list = "Eşleşme yok" }
"menus:network"       = { input = "Ağ / VPN",         list = "Eşleşme yok" }
"menus:other"         = { input = "Hızlı işlem",      list = "Eşleşme yok" }
"menus:scripts"       = { input = "Script",           list = "Eşleşme yok" }
"menus:wallpapers"    = { input = "Duvar kâğıdı",     list = "Eşleşme yok" }

# ── Keybinds (Vim + Emacs hybrid) ──────────────────────────────────────────
[keybinds]
close             = ["Escape", "ctrl c", "ctrl q"]
next              = ["Down", "ctrl j", "ctrl n"]
previous          = ["Up", "ctrl k", "ctrl p"]
page_down         = ["Page_Down", "ctrl f"]
page_up           = ["Page_Up", "ctrl b"]
first             = ["Home", "g g"]
last              = ["End", "shift g"]
forward_word      = ["ctrl Right", "alt f"]
backward_word     = ["ctrl Left", "alt b"]
toggle_exact      = ["ctrl e"]
resume_last_query = ["ctrl r"]
quick_activate    = ["1", "2", "3", "4", "5", "6", "7", "8", "9", "ctrl Return"]

# ── Providers ──────────────────────────────────────────────────────────────
[providers]
# DEFAULT — kullanıcı bir şey yazınca bakılan provider'lar. Geniş tutma,
# karışık sonuç gelir.
default = [
  "desktopapplications",
  "calc",
  "runner",
  "websearch",
  "windows",
]

# EMPTY — boş input'ta görünenler. Üstten alta sıra: önce pencereler
# (Alt-Tab benzeri), sonra sık uygulamalar, scripts (Helium ilk),
# son olarak power menüsü.
empty = [
  "windows",
  "desktopapplications",
  "menus:scripts",
  "menus:sysops",
]

max_results = 100

# ── Provider prefix'leri ───────────────────────────────────────────────────
# Tek harf + boşluk → o provider'a girer.  Örnek:  "c 2+2",  "ms reboot"

# Çekirdek arama
[[providers.prefixes]]
prefix = "p"
provider = "providerlist"
[[providers.prefixes]]
prefix = "f"
provider = "files"
[[providers.prefixes]]
prefix = "r"
provider = "runner"
[[providers.prefixes]]
prefix = "c"
provider = "calc"
[[providers.prefixes]]
prefix = "q"
provider = "websearch"
[[providers.prefixes]]
prefix = "w"
provider = "windows"

# Veri / pano / sembol
[[providers.prefixes]]
prefix = "v"
provider = "clipboard"
[[providers.prefixes]]
prefix = "s"
provider = "snippets"
[[providers.prefixes]]
prefix = "e"
provider = "symbols"
[[providers.prefixes]]
prefix = "u"
provider = "unicode"

# Görev / cihaz
[[providers.prefixes]]
prefix = "t"
provider = "todo"
[[providers.prefixes]]
prefix = "b"
provider = "bluetooth"

# Menüler — tek harfli ana giriş + iki harfli kısayollar
[[providers.prefixes]]
prefix = "m"
provider = "menus"
[[providers.prefixes]]
prefix = "mm"
provider = "menus:margo"        # margo + mshell
[[providers.prefixes]]
prefix = "mt"
provider = "menus:sysops"       # T = sysoT (power)
[[providers.prefixes]]
prefix = "mn"
provider = "menus:network"      # mullvad + bluetooth toggle + IP
[[providers.prefixes]]
prefix = "mo"
provider = "menus:other"        # ses/parlaklık/SS/renk
[[providers.prefixes]]
prefix = "ms"
provider = "menus:scripts"      # start-* başlatıcılar
[[providers.prefixes]]
prefix = "mw"
provider = "menus:wallpapers"

# ── Provider-spesifik ayar ─────────────────────────────────────────────────
[providers.clipboard]
time_format = "%d.%m. - %H:%M"

# ── Per-provider max results ───────────────────────────────────────────────
[providers.max_results_provider]
desktopapplications = 50
files               = 30
runner              = 20
websearch           = 10
clipboard           = 100
windows             = 30
todo                = 30
bluetooth           = 15
snippets            = 25
menus               = 50
symbols             = 30
unicode             = 30

# ── Provider actions ───────────────────────────────────────────────────────
[providers.actions]
desktopapplications = [
  { action = "start",         default = true, bind = "Return" },
  { action = "start:keep",    label = "aç + kalsın",   bind = "shift Return", after = "KeepOpen" },
  { action = "pin",           bind = "ctrl p", after = "AsyncReload" },
  { action = "unpin",         bind = "ctrl p", after = "AsyncReload" },
  { action = "erase_history", label = "geçmişi sil", bind = "ctrl h", after = "AsyncReload" },
]

files = [
  { action = "open",     default = true, bind = "Return" },
  { action = "opendir",  label = "dizini aç",       bind = "ctrl Return" },
  { action = "copypath", label = "yolu kopyala",    bind = "ctrl shift c" },
  { action = "copyfile", label = "dosyayı kopyala", bind = "ctrl c" },
]

runner = [
  { action = "run",           default = true, bind = "Return" },
  { action = "runterminal",   label = "terminalde çalıştır", bind = "shift Return" },
  { action = "erase_history", label = "geçmişi sil",         bind = "ctrl h", after = "Reload" },
]

calc = [
  { action = "copy",   default = true, bind = "Return" },
  { action = "delete", bind = "ctrl d", after = "AsyncReload" },
  { action = "save",   bind = "ctrl s", after = "AsyncClearReload" },
]

websearch = [
  { action = "search",        default = true, bind = "Return" },
  { action = "erase_history", label = "geçmişi sil", bind = "ctrl h", after = "Reload" },
]

clipboard = [
  { action = "copy",          default = true, bind = "Return" },
  { action = "remove",        bind = "ctrl d", after = "ClearReload" },
  { action = "remove_all",    global = true, label = "hepsini sil",   bind = "ctrl shift d", after = "ClearReload" },
  { action = "toggle_images", global = true, label = "resim aç/kapa", bind = "ctrl i",       after = "ClearReload" },
  { action = "edit",          bind = "ctrl o" },
]

symbols = [
  { action = "run_cmd",       label = "seç",         default = true, bind = "Return" },
  { action = "erase_history", label = "geçmişi sil", bind = "ctrl h", after = "Reload" },
]

unicode = [
  { action = "run_cmd",       label = "seç",         default = true, bind = "Return" },
  { action = "erase_history", label = "geçmişi sil", bind = "ctrl h", after = "Reload" },
]

providerlist = [
  { action = "activate", default = true, bind = "Return", after = "ClearReload" },
]

todo = [
  { action = "save",     default = true, bind = "Return", after = "ClearReload" },
  { action = "delete",   bind = "ctrl d", after = "ClearReload" },
  { action = "active",   bind = "Return", after = "ClearReload" },
  { action = "inactive", bind = "Return", after = "ClearReload" },
  { action = "done",     bind = "ctrl f", after = "ClearReload" },
  { action = "clear",    bind = "ctrl x", after = "ClearReload", global = true },
]

bluetooth = [
  { action = "find",       global = true, bind = "ctrl f", after = "AsyncClearReload" },
  { action = "trust",      bind = "ctrl t", after = "AsyncReload" },
  { action = "untrust",    bind = "ctrl t", after = "AsyncReload" },
  { action = "pair",       bind = "Return", after = "AsyncReload" },
  { action = "remove",     bind = "ctrl d", after = "AsyncReload" },
  { action = "connect",    bind = "Return", after = "AsyncReload" },
  { action = "disconnect", bind = "Return", after = "AsyncReload" },
]

# windows: zwlr_foreign_toplevel_v1 → focus = toplevel.activate, close = toplevel.close
windows = [
  { action = "focus", default = true, bind = "Return" },
  { action = "close", bind = "ctrl w" },
]

snippets = [
  { action = "paste", default = true, bind = "Return" },
  { action = "copy",  bind = "ctrl c" },
]

menus = [
  { action = "open", default = true, bind = "Return" },
]

# ════════════════════════════════════════════════════════════════════════════
# KISAYOL ÖZETİ
# ────────────────────────────────────────────────────────────────────────────
# NAVIGATION    j/k · Ctrl+f/b (page) · gg/G (baş/son) · 1..9 (quick)
# SEARCH        '<term>  exact · Ctrl+E exact toggle · Ctrl+R önceki sorgu
# COMMON        Return aç · Shift+Return alternatif · Ctrl+D sil
#               Ctrl+P pin/unpin · Ctrl+H geçmişi temizle
# EXIT          Esc · Ctrl+C · Ctrl+Q
#
# PROVIDER PREFIX'LERİ
#   Çekirdek    p providerlist   f files        r runner
#               c calc           q websearch    w windows
#   Veri        v clipboard      s snippets     e symbols      u unicode
#   Görev       t todo           b bluetooth
#   Menüler     m  menus (hepsi)
#               mm margo         mt sysops      mn network
#               mo other         ms scripts     mw wallpapers
# ════════════════════════════════════════════════════════════════════════════
