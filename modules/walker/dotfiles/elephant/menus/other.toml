# ════════════════════════════════════════════════════════════════════════════
# menus:other — Hızlı widget'lar
#
# Sadece aksiyon: ses/parlaklık ayarı, renk seçici, ekran görüntüsü, takvim.
# Sistem stats (CPU/RAM/disk/pil) zaten mshell bar'da.
#
# Açmak için:   walker -m menus:other   veya prefix:  mo
# ════════════════════════════════════════════════════════════════════════════
name        = "other"
name_pretty = "Diğer"
icon        = "applications-other"

# ── Ses & Mikrofon ─────────────────────────────────────────────────────────
[[entries]]
text   = "Ses"
async  = "wpctl get-volume @DEFAULT_AUDIO_SINK@"
icon   = "audio-volume-high"
keywords = ["volume", "ses", "sound", "audio"]
[entries.actions]
volume_raise  = "wpctl set-volume @DEFAULT_AUDIO_SINK@ 0.05+"
volume_lower  = "wpctl set-volume @DEFAULT_AUDIO_SINK@ 0.05-"
volume_mute   = "wpctl set-mute   @DEFAULT_AUDIO_SINK@ 1"
volume_unmute = "wpctl set-mute   @DEFAULT_AUDIO_SINK@ 0"
volume_set    = "wpctl set-volume @DEFAULT_AUDIO_SINK@ %VALUE%"

[[entries]]
text   = "Mikrofon"
async  = "wpctl get-volume @DEFAULT_AUDIO_SOURCE@"
icon   = "audio-input-microphone"
keywords = ["mic", "mikrofon", "input"]
[entries.actions]
mic_mute   = "wpctl set-mute   @DEFAULT_AUDIO_SOURCE@ 1"
mic_unmute = "wpctl set-mute   @DEFAULT_AUDIO_SOURCE@ 0"
mic_set    = "wpctl set-volume @DEFAULT_AUDIO_SOURCE@ %VALUE%"

# ── Parlaklık ──────────────────────────────────────────────────────────────
[[entries]]
text     = "Parlaklık"
async    = "brightnessctl get"
icon     = "display-brightness"
keywords = ["brightness", "parlaklık", "ekran", "backlight"]
[entries.actions]
brightness_up   = "brightnessctl set +10%"
brightness_down = "brightnessctl set 10%-"
brightness_set  = "brightnessctl set %VALUE%%"

# ── Renk Seçici ────────────────────────────────────────────────────────────
[[entries]]
text     = "Renk Seçici"
keywords = ["color", "picker", "renk", "hex"]
icon     = "color-picker"
actions  = { "cp_use" = "sh -c 'wl-copy \"$(hyprpicker -a -n)\"'" }

# ── Ekran Görüntüsü ────────────────────────────────────────────────────────
[[entries]]
text     = "Ekran Görüntüsü — Alan"
keywords = ["screenshot", "capture", "ss", "alan", "area"]
icon     = "camera-photo"
actions  = { "screenshot" = "bash -c 'screenshot ri'" }

[[entries]]
text     = "Ekran Görüntüsü — Tam Ekran"
keywords = ["screenshot", "fullscreen", "tam", "ekran"]
icon     = "camera-photo"
actions  = { "screenshot" = "bash -c 'screenshot fi'" }

[[entries]]
text     = "Ekran Kaydı"
keywords = ["screenshot", "record", "kayıt", "rec", "video"]
icon     = "camera-video"
actions  = { "screenshot" = "bash -c 'screenshot rec'" }

# ── Takvim ─────────────────────────────────────────────────────────────────
[[entries]]
text     = "Takvimi Aç"
keywords = ["calendar", "takvim", "ajanda"]
icon     = "x-office-calendar"
actions  = { "open_cal" = "xdg-open https://calendar.google.com" }
