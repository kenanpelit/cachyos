# ════════════════════════════════════════════════════════════════════════════
# menus:other — Hızlı sistem widget'ları (margo / wlroots)
#
# Eski osc-shell / quickshell yer tutucularının walker karşılığı.
# wpctl / brightnessctl / hyprpicker hepsi wlroots altında çalışır.
# ════════════════════════════════════════════════════════════════════════════
name        = "other"
name_pretty = "Diğer"
icon        = "applications-other"

# ── Renk Seçici (wlroots screencopy ile çalışır) ──────────────────────────
[[entries]]
text     = "Renk Seçici"
keywords = ["color", "picker", "renk"]
icon     = "color-picker"
actions  = { "cp_use" = "sh -c 'wl-copy \"$(hyprpicker -a -n)\"'" }

# ── Ses (PipeWire / Wireplumber üzerinden) ────────────────────────────────
# OSD'li +/- için margo keybind  mshell msg volume-up  kullanıyor; buradakiler
# %VALUE ile mutlak ayar yapmak için.
[[entries]]
text   = "Ses"
async  = "wpctl get-volume @DEFAULT_AUDIO_SINK@"
icon   = "audio-volume-high"
keywords = ["volume", "ses", "sound", "audio"]
[entries.actions]
volume_raise  = "wpctl set-volume @DEFAULT_AUDIO_SINK@ 0.05+"
volume_lower  = "wpctl set-volume @DEFAULT_AUDIO_SINK@ 0.05-"
volume_mute   = "wpctl set-mute   @DEFAULT_AUDIO_SINK@ 1"
volume_unmute = "wpctl set-mute   @DEFAULT_AUDIO_SINK@ 0"
volume_set    = "wpctl set-volume @DEFAULT_AUDIO_SINK@ %VALUE%"

[[entries]]
text   = "Mikrofon"
async  = "wpctl get-volume @DEFAULT_AUDIO_SOURCE@"
icon   = "audio-input-microphone"
keywords = ["mic", "mikrofon", "input"]
[entries.actions]
mic_set = "wpctl set-volume @DEFAULT_AUDIO_SOURCE@ %VALUE%"

# ── Parlaklık ──────────────────────────────────────────────────────────────
[[entries]]
text     = "Parlaklık"
async    = "brightnessctl get"
icon     = "display-brightness"
keywords = ["brightness", "parlaklık", "ekran", "backlight"]
[entries.actions]
brightness_up   = "brightnessctl set +10%"
brightness_down = "brightnessctl set 10%-"
brightness_set  = "brightnessctl set %VALUE%%"

# ── Disk / Bellek / CPU özetleri ──────────────────────────────────────────
[[entries]]
text     = "Disk"
keywords = ["disk", "drive", "space", "alan"]
icon     = "drive-harddisk"
async    = """df -h / | tail -1 | awk '{print "Used: " $3 " | Avail: " $4 " | Total: " $2}'"""
actions  = { "disk_copy" = "wl-copy '%VALUE%'" }

[[entries]]
text     = "Sistem"
keywords = ["system", "cpu", "ram", "bellek", "mem"]
icon     = "computer"
async    = """printf "Mem: %s/%s | CPU: %s%%" "$(free -h | awk '/^Mem:/ {print $3}')" "$(free -h | awk '/^Mem:/ {print $2}')" "$(top -bn1 | awk -F'[, ]+' '/Cpu\\(s\\)/{printf \"%.1f\", 100-$8}')""""

[[entries]]
text     = "Bugün"
keywords = ["date", "today", "calendar", "bugün", "tarih"]
icon     = "clock"
async    = """date "+%H:%M - %d.%m. %A - KW %V""""
actions  = { "open_cal" = "xdg-open https://calendar.google.com" }

# ── Ekran görüntüsü (kullanıcının ~/.local/bin/screenshot script'i) ───────
[[entries]]
text     = "Ekran Görüntüsü — Alan"
keywords = ["screenshot", "capture", "ss", "alan", "area"]
icon     = "camera-photo"
actions  = { "screenshot" = "bash -c 'screenshot ri'" }

[[entries]]
text     = "Ekran Görüntüsü — Kayıt"
keywords = ["screenshot", "record", "kayıt", "rec"]
icon     = "camera-video"
actions  = { "screenshot" = "bash -c 'screenshot rec'" }
