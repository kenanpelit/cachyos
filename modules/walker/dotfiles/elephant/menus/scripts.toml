# ════════════════════════════════════════════════════════════════════════════
# menus:scripts — ~/.cachy/modules/scripts/start altındaki tüm başlatıcılar
#
# Kurulum sırasında .sh uzantısı düşürülerek ~/.local/bin'e kopyalanıyor.
# Bu yüzden  actions  içinde  start-helium-ai  (uzantısız) olarak çağırıyoruz.
#
# Sıralama:  Zen (varsayılan tarayıcı) → Helium → Brave → Chrome →
#            iletişim → medya → terminal
# ════════════════════════════════════════════════════════════════════════════
name        = "scripts"
name_pretty = "Scripts"
icon        = "application-x-executable"

# ── Zen — varsayılan browser ─────────────────────────────────────────────────
[[entries]]
text     = "Zen — Kenp"
keywords = ["zen", "kenp", "browser", "tarayıcı"]
icon     = "zen-browser"
actions  = { "run" = "start-zen-kenp" }

[[entries]]
text     = "Zen — AI"
keywords = ["zen", "ai", "browser"]
icon     = "zen-browser"
actions  = { "run" = "start-zen-ai" }

[[entries]]
