# ════════════════════════════════════════════════════════════════════════════
# menus:sysops — Güç & oturum
#
# Klasik power menu. Margo/mshell  mm  prefix'inde, ağ  mn  prefix'inde.
#
# Açmak için:    walker -m menus:sysops    (keybind: super,delete)
#                veya prefix:  mt
# ════════════════════════════════════════════════════════════════════════════
name        = "sysops"
name_pretty = "Sistem"
icon        = "preferences-system"

[[entries]]
text     = "Kilitle"
keywords = ["lock", "kilit", "lockscreen"]
icon     = "system-lock-screen"
actions  = { "lock" = "loginctl lock-session" }

[[entries]]
text     = "Askıya Al"
keywords = ["suspend", "sleep", "uyku", "askı"]
icon     = "system-suspend"
actions  = { "suspend" = "systemctl suspend -i" }

[[entries]]
text     = "Derin Uyku"
keywords = ["hibernate", "hazırda bekle", "derin uyku"]
icon     = "system-suspend-hibernate"
actions  = { "hibernate" = "systemctl hibernate -i" }

[[entries]]
text     = "Yeniden Başlat"
keywords = ["reboot", "restart", "yeniden başlat"]
icon     = "system-reboot"
actions  = { "osc-safer-reboot" = "systemctl reboot -i" }

[[entries]]
text     = "UEFI'ye Yeniden Başlat"
keywords = ["uefi", "bios", "firmware"]
icon     = "system-reboot"
actions  = { "reboot_uefi" = "systemctl reboot --firmware-setup" }

[[entries]]
text     = "Oturumu Kapat"
keywords = ["logout", "signout", "exit", "oturum"]
icon     = "system-log-out"
actions  = { "logout" = "loginctl terminate-user $USER" }

[[entries]]
text     = "Kapat"
keywords = ["shutdown", "poweroff", "kapat", "off"]
icon     = "system-shutdown"
actions  = { "shutdown" = "systemctl poweroff -i" }
