# ════════════════════════════════════════════════════════════════════════════
# menus:margo — margo compositor + mshell kontrol paneli
#
# Sadece aksiyon. Tag-switch zaten margo keybind ile (Super+1..9), durum
# inspeksiyonu terminalden  mctl  ile. Burada günlük "tıkla-yap" işleri.
#
# Açmak için:    walker -m menus:margo     veya prefix:  mm
# ════════════════════════════════════════════════════════════════════════════
name        = "margo"
name_pretty = "Margo"
icon        = "preferences-desktop"

# ── Config / shell ─────────────────────────────────────────────────────────
[[entries]]
text     = "Margo: Reload Config"
keywords = ["margo", "reload", "config", "yenile"]
icon     = "view-refresh"
actions  = { "reload" = "mctl reload" }

[[entries]]
text     = "Mshell: Yeniden Başlat"
keywords = ["mshell", "shell", "bar", "restart", "yenile"]
icon     = "view-refresh"
actions  = { "restart" = "sh -c 'pkill -x mshell; nohup mshell >/dev/null 2>&1 & disown'" }

[[entries]]
text     = "Mshell: Bar Aç/Kapa"
keywords = ["mshell", "bar", "toggle", "gizle"]
icon     = "view-fullscreen"
actions  = { "toggle_bar" = "mshell msg toggle-visibility" }

# ── Aktif pencere ──────────────────────────────────────────────────────────
[[entries]]
text     = "Pencereyi Kapat"
keywords = ["kill", "close", "kapat"]
icon     = "window-close"
actions  = { "kill" = "mctl dispatch killclient" }

[[entries]]
text     = "Tam Ekran"
keywords = ["fullscreen", "tam", "ekran"]
icon     = "view-fullscreen"
actions  = { "fs" = "mctl dispatch togglefullscreen" }

[[entries]]
text     = "Yüzen Yap"
keywords = ["float", "yüzen", "floating"]
icon     = "object-flip-vertical"
actions  = { "float" = "mctl dispatch togglefloating" }

[[entries]]
text     = "Düzeni Değiştir"
keywords = ["layout", "düzen"]
icon     = "view-grid"
actions  = { "layout" = "mctl dispatch switchlayout" }

[[entries]]
text     = "Genel Bakış"
keywords = ["overview", "genel"]
icon     = "view-restore"
actions  = { "overview" = "mctl dispatch toggleoverview" }

[[entries]]
text     = "Twilight: Aç/Kapa"
keywords = ["twilight", "redshift", "gamma", "renk", "gece", "night"]
icon     = "weather-clear-night"
actions  = { "twilight" = "mctl dispatch twilight" }
