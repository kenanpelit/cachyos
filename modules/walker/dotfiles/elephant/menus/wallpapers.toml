# ════════════════════════════════════════════════════════════════════════════
# menus:wallpapers — margo + mshell duvar kâğıdı kontrolü
#
# Duvar kâğıdı yönetimi mshell'in içinde:  ~/.config/margo/mshell.toml
# içinde  [wallpaper.tags]  (tag → dosya yolu) ve  [wallpaper.shuffle]
# (otomatik rastgele) ile yapılıyor. Burada genelde dosya yolunu
# güncellemek + mshell'i tetiklemek lazım.
#
# Açmak için:    walker -m menus:wallpapers      veya prefix:  mw
# ════════════════════════════════════════════════════════════════════════════
name        = "wallpapers"
name_pretty = "Duvar Kâğıdı"
icon        = "preferences-desktop-wallpaper"

# ── Hızlı kontrol ──────────────────────────────────────────────────────────
[[entries]]
text     = "mshell.toml'u Düzenle"
keywords = ["edit", "config", "düzenle", "toml"]
icon     = "text-editor"
actions  = { "edit" = "xdg-open ~/.config/margo/mshell.toml" }

[[entries]]
text     = "Duvar Kâğıdı Klasörünü Aç"
keywords = ["browse", "folder", "klasör", "aç"]
icon     = "folder-pictures"
actions  = { "open_dir" = "xdg-open ~/Pictures/wallpapers" }

[[entries]]
text     = "Rastgele — Aktif Tag"
keywords = ["random", "shuffle", "rastgele", "yeni"]
icon     = "view-refresh"
actions  = { "shuffle_tag" = "sh -c 'mshell-wallpaper-shuffle current 2>/dev/null || notify-send \"mshell-wallpaper-shuffle script bulunamadı\" \"~/.local/bin/ altına bir script yaz: aktif tag\\'in [wallpaper.tags] satırını rastgele bir dosya ile değiştir.\"'" }

[[entries]]
text     = "Rastgele — Tüm Tag'ler"
keywords = ["random", "shuffle", "rastgele", "all", "hepsi"]
icon     = "view-refresh"
actions  = { "shuffle_all" = "sh -c 'mshell-wallpaper-shuffle all 2>/dev/null || notify-send \"mshell-wallpaper-shuffle script bulunamadı\" \"~/.local/bin/ altına bir script yaz: tüm [wallpaper.tags] satırlarını rastgele dosyalarla değiştir.\"'" }

[[entries]]
text     = "Mshell'i Yeniden Başlat"
keywords = ["reload", "restart", "yenile", "mshell"]
icon     = "view-refresh"
actions  = { "restart" = "sh -c 'pkill -x mshell; nohup mshell >/dev/null 2>&1 & disown'" }
