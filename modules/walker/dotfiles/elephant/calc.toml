# calc — gnu units uyumlu hesap makinesi
# Return  → wl-copy ile panoya kopyalar
# Ctrl+S  → kayıtlı sonuç olarak ekler
# Ctrl+D  → kayıtlıyı sil
async         = false
autosave      = false
command       = "wl-copy -n '%VALUE%'"
max_items     = 100
min_chars     = 2          # 1 karakter "1" gibi şeylerle gürültü yapardı; 2 sağlıklı
placeholder   = "hesaplanıyor..."
require_number = true

[Config]
hide_from_providerlist = false
icon         = "accessories-calculator"
min_score    = 0
name_pretty  = "Hesap"
