# bitwarden — rbw cli üzerinden Bitwarden Vault erişimi
# Şu an devre dışı çünkü ~/.config/rbw yapılandırılmamış.
# Açmak için:  rbw config set email <mail>  &&  rbw login   →  ardından
# bu dosyada hide_from_providerlist = false yap, elephant.toml içinden
# ignored_providers listesinden "bitwarden"'i çıkar.
autotype_command = "wtype -- %VALUE%"
autotype_delay   = 500
autotype_support = false
clear_after      = 5
clear_command    = "wl-copy --clear"
copy_command     = "wl-copy --sensitive --"

[Config]
hide_from_providerlist = true
icon         = "bitwarden"
min_score    = 20
name_pretty  = "Bitwarden (devre dışı)"
