# mpd.conf (portable)

music_directory     "~/Music"
playlist_directory  "~/.local/share/mpd/playlists"
db_file             "~/.local/share/mpd/database"
log_file            "~/.local/share/mpd/log"
pid_file            "~/.local/share/mpd/pid"
state_file          "~/.local/share/mpd/state"
sticker_file        "~/.local/share/mpd/sticker.sql"

restore_paused "yes"
auto_update "yes"
audio_buffer_size "4096"
port "6600"

# Keep MPD local-only and avoid dual-stack bind noise.
bind_to_address "127.0.0.1"

# WildMIDI requires /etc/timidity/timidity.cfg on Arch-based systems.
# Disable it to avoid startup warnings when timidity is not installed.
decoder {
  plugin "wildmidi"
  enabled "no"
}

# Audio Output Configuration

audio_output {
  type "pipewire"
  name "PipeWire Sound Server"
  mixer_type "software"
}

audio_output {
  type "fifo"
  name "Visualizer"
  path "/tmp/mpd.fifo"
  format "44100:16:2"
}
