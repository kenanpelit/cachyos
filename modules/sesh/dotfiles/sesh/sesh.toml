# ---------------------------------------------------------------------------
# Global Settings
# ---------------------------------------------------------------------------
strict_mode = true
cache = true
dir_length = 2
separator_aware = true
sort_order = ["config", "tmux", "zoxide", "tmuxinator"]

# ---------------------------------------------------------------------------
# Default Session Settings
# ---------------------------------------------------------------------------
[default_session]
startup_command = "lsd -la --group-dirs=first"
preview_command = "lsd -la --group-dirs=first {}"

# ---------------------------------------------------------------------------
# SSH Sessions
# ---------------------------------------------------------------------------
[[session]]
name = "Feynman  "
path = "~/"
startup_command = "ssh grid -t 'byobu has -t kenan || byobu new-session -d -s kenan && byobu a -t kenan'"

[[session]]
name = "Terminal  "
path = "~/"
startup_command = "ssh terminal -t 'byobu has -t kenan || byobu new-session -d -s kenan && byobu a -t kenan'"

[[session]]
name = "SSH  "
path = "~/"
startup_command = "t3"

# ---------------------------------------------------------------------------
# System Tools & Monitoring
# ---------------------------------------------------------------------------
[[session]]
name = "Tunnelshow  "
path = "~/"
startup_command = "tunnelshow"

[[session]]
name = "Podman-Tui 󱘖 "
path = "~/"
startup_command = "podman-tui"
preview_command = "podman ps -a"

[[session]]
name = "System Monitor 󰘳 "
path = "~/"
startup_command = "btop"
preview_command = "fastfetch"

[[session]]
name = "Logs 󰌱 "
path = "/var/log"
startup_command = "sudo journalctl -f"
preview_command = "journalctl -n 40 --no-pager"
windows = ["logs-shell"]

# ---------------------------------------------------------------------------
# File Management
# ---------------------------------------------------------------------------
[[session]]
name = "Downloads 󰇚 "
path = "~/Downloads"
startup_command = "ranger"
preview_command = "lsd -la --group-dirs=first ~/Downloads"

[[session]]
name = "Yazi 󱂵 "
path = "~/"
startup_command = "yazi"

[[session]]
name = "Home 󰉋 "
path = "~/"
startup_command = "lsd -la"

[[session]]
name = "Documents 󰉖 "
path = "~/Documents"
startup_command = "lsd -la"
preview_command = "lsd -la --group-dirs=first ~/Documents"

# ---------------------------------------------------------------------------
# Development & Configuration
# ---------------------------------------------------------------------------
[[session]]
name = "TmuxConfig 󰆍 "
path = "~/.config/tmux"
startup_command = "vim ~/.config/tmux/tmux.conf.local"
preview_command = "bat --color=always ~/.config/tmux/tmux.conf.local"
windows = ["shell"]

[[session]]
name = "Project 󱌢 "
path = "~/Work/projects"
startup_command = "tm tmx --layout 3"
preview_command = "lsd -la --group-dirs=first ~/Work/projects"

[[session]]
name = "Cachy Config 󰆍 "
path = "~/.cachy"
startup_command = "nvim ."
preview_command = "git -C ~/.cachy status --short --branch"
windows = ["git", "shell"]

[[session]]
name = "Git Status 󰊢 "
path = "~/.cachy"
startup_command = "command lazygit"
preview_command = "git -C ~/.cachy status --short --branch"

[[session]]
name = "Neovim 󰆦 "
path = "~/"
startup_command = "nvim"

# ---------------------------------------------------------------------------
# Media & Entertainment
# ---------------------------------------------------------------------------
[[session]]
name = "Music 󰎈 "
path = "~/Music"
startup_command = "rmpc"
preview_command = "lsd -la --group-dirs=first ~/Music"

[[session]]
name = "MPV Player 󰦝 "
path = "~/Videos"
startup_command = "yazi"
preview_command = "lsd -la --group-dirs=first ~/Videos"

[[session]]
name = "Radio 󱉺 "
path = "~/"
startup_command = "radio-cli"

[[session]]
name = "YouTube 󰗃 "
path = "~/Downloads"
startup_command = "yt-dlp --help"
preview_command = "lsd -la --group-dirs=first ~/Downloads"

# ---------------------------------------------------------------------------
# Network & Security
# ---------------------------------------------------------------------------
[[session]]
name = "Tor 󰖟 "
path = "/repo/tor"
startup_command = "tm tmx --layout 3"
preview_command = "lsd -la --group-dirs=first /repo/tor"

[[session]]
name = "Network Monitor 󰛳 "
path = "~/"
startup_command = "nethogs"

[[session]]
name = "WiFi Scanner 󰀂 "
path = "~/"
startup_command = "nmcli dev wifi"
preview_command = "nmcli device wifi list"

[[session]]
name = "Firewall 󰓾 "
path = "~/"
startup_command = "sudo ufw status verbose"

# ---------------------------------------------------------------------------
# Productivity & Notes
# ---------------------------------------------------------------------------
[[session]]
name = "Anote  "
path = "~/"
startup_command = "anote"

[[session]]
name = "Notes 󰠮 "
path = "~/Notes"
startup_command = "vim ."
preview_command = "lsd -la --group-dirs=first ~/Notes"
windows = ["shell"]

[[session]]
name = "Obsidian 󰈙 "
path = "~/.anotes/obsi"
startup_command = "obsidian"
preview_command = "lsd -la --group-dirs=first ~/.anotes/obsi"

[[session]]
name = "Calendar 󰃭 "
path = "~/"
startup_command = "cal -y"

[[session]]
name = "Tasks 󰄬 "
path = "~/"
startup_command = "task"
preview_command = "task next"

# ---------------------------------------------------------------------------
# System Information
# ---------------------------------------------------------------------------
[[session]]
name = "System Info 󰘳 "
path = "~/"
startup_command = "fastfetch"
preview_command = "fastfetch"

[[session]]
name = "Hardware 󰇄 "
path = "~/"
startup_command = "lscpu && echo && lsmem && echo && lsblk"
preview_command = "lscpu"

[[session]]
name = "Disk Usage 󰋊 "
path = "~/"
startup_command = "ncdu /"

[[session]]
name = "Processes 󰘳 "
path = "~/"
startup_command = "htop"

# ---------------------------------------------------------------------------
# Development Tools
# ---------------------------------------------------------------------------
[[session]]
name = "Podman 󰡨 "
path = "~/"
startup_command = "podman ps -a"
preview_command = "podman ps -a"

[[session]]
name = "API Test 󰜏 "
path = "~/"
startup_command = "curl --help"

# ---------------------------------------------------------------------------
# Gaming & Fun
# ---------------------------------------------------------------------------
[[session]]
name = "Games 󰊖 "
path = "~/.steam"
startup_command = "steam"
preview_command = "lsd -la --group-dirs=first ~/.steam"

[[session]]
name = "Terminal Games 󰮂 "
path = "~/"
startup_command = "bastet"

# ---------------------------------------------------------------------------
# Backup & Sync
# ---------------------------------------------------------------------------
[[session]]
name = "Backup 󰆓 "
path = "~/"
startup_command = "rsync --help"

[[session]]
name = "Cloud Sync ☁️ "
path = "~/"
startup_command = "rclone listremotes"
preview_command = "rclone listremotes"

# ---------------------------------------------------------------------------
# Reusable Window Presets
# ---------------------------------------------------------------------------
[[window]]
name = "git"
startup_script = "git status --short --branch || lazygit"

[[window]]
name = "shell"
startup_script = "$SHELL"

[[window]]
name = "logs-shell"
startup_script = "$SHELL"
path = "/var/log"

# ---------------------------------------------------------------------------
# Wildcard Project Sessions
# ---------------------------------------------------------------------------
[[wildcard]]
pattern = "~/.kod/*"
startup_command = "nvim ."
preview_command = "lsd -la --group-dirs=first {}"
windows = ["git", "shell"]

[[wildcard]]
pattern = "~/Work/projects/*"
startup_command = "nvim ."
preview_command = "lsd -la --group-dirs=first {}"
windows = ["git", "shell"]

[[wildcard]]
pattern = "~/Work/projects/**"
startup_command = "nvim ."
preview_command = "lsd -la --group-dirs=first {}"
windows = ["git", "shell"]

[[wildcard]]
pattern = "~/Notes/**"
startup_command = "nvim ."
preview_command = "lsd -la --group-dirs=first {}"
windows = ["shell"]
