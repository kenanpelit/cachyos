# =============================================================================
#  sesh.toml — smart tmux session manager (joshmedeski/sesh v2)
# -----------------------------------------------------------------------------
#  Layout:
#    1. Global settings        2. TUI (Catppuccin-friendly)
#    3. Default session        4. Sessions (grouped)
#    5. Reusable windows       6. Wildcards
#
#  Reference (model.Config):
#    cache, strict_mode, sort_order, dir_length, separator_aware,
#    tmux_command, blacklist (regex[]), import (path[]), default_session,
#    tui, [[session]], [[window]], [[wildcard]]
# =============================================================================

# -----------------------------------------------------------------------------
#  1. Global Settings
# -----------------------------------------------------------------------------
strict_mode      = true
cache            = true
dir_length       = 2
separator_aware  = true
# Order in which sources appear in the picker.
sort_order       = ["config", "tmux", "zoxide"]

# -----------------------------------------------------------------------------
#  2. TUI (Catppuccin Mocha palette match — accent #50AAA7)
# -----------------------------------------------------------------------------
[tui]
prompt      = "❯ "
placeholder = "Search sessions..."
show_icons  = true

# -----------------------------------------------------------------------------
#  3. Default Session (fallback startup/preview when a session omits them)
# -----------------------------------------------------------------------------
[default_session]
startup_command = "lsd -la --group-dirs=first"
preview_command = "lsd -la --group-dirs=first {}"

# =============================================================================
#  4. Sessions
# =============================================================================

# ----- 4.1 SSH ---------------------------------------------------------------
[[session]]
name            = "Feynman 󰒍 "
path            = "~/"
startup_command = "ssh grid -t 'byobu has -t kenan || byobu new-session -d -s kenan && byobu a -t kenan'"

[[session]]
name            = "Terminal 󰣀 "
path            = "~/"
startup_command = "ssh terminal -t 'byobu has -t kenan || byobu new-session -d -s kenan && byobu a -t kenan'"

[[session]]
name            = "SSH Hub 󰢹 "
path            = "~/"
startup_command = "t3"

# ----- 4.2 System & Monitoring (interactive only) ----------------------------
[[session]]
name            = "System Monitor 󰘳 "
path            = "~/"
startup_command = "btop"
preview_command = "fastfetch"

[[session]]
name            = "Processes 󰓅 "
path            = "~/"
startup_command = "htop"

[[session]]
name            = "Disk Usage 󰋊 "
path            = "~/"
startup_command = "ncdu /"

[[session]]
name            = "Network Monitor 󰛳 "
path            = "~/"
startup_command = "sudo nethogs"

[[session]]
name            = "Logs 󰌱 "
path            = "/var/log"
startup_command = "journalctl --user -f"
preview_command = "journalctl --user -n 40 --no-pager"
windows         = ["logs-shell"]

[[session]]
name            = "Podman-Tui 󱘖 "
path            = "~/"
startup_command = "podman-tui"
preview_command = "podman ps -a"

# ----- 4.3 File Management ---------------------------------------------------
[[session]]
name            = "Home 󰉋 "
path            = "~/"
startup_command = "yazi"

[[session]]
name            = "Downloads 󰇚 "
path            = "~/Downloads"
startup_command = "yazi"
preview_command = "lsd -la --group-dirs=first ~/Downloads"

[[session]]
name            = "Documents 󰉖 "
path            = "~/Documents"
startup_command = "yazi"
preview_command = "lsd -la --group-dirs=first ~/Documents"

[[session]]
name            = "Pictures 󰋩 "
path            = "~/Pictures"
startup_command = "yazi"
preview_command = "lsd -la --group-dirs=first ~/Pictures"

[[session]]
name            = "Videos 󰕧 "
path            = "~/Videos"
startup_command = "yazi"
preview_command = "lsd -la --group-dirs=first ~/Videos"

# ----- 4.4 Config Editing (dotfiles) -----------------------------------------
[[session]]
name            = "Cachy 󰍛 "
path            = "~/.cachy"
startup_command = "nvim ."
preview_command = "git -C ~/.cachy status --short --branch"
windows         = ["git", "shell"]

[[session]]
name            = "Tmux Config 󰆍 "
path            = "~/.config/tmux"
startup_command = "nvim tmux.conf"
preview_command = "bat --color=always ~/.config/tmux/tmux.conf"
windows         = ["shell"]

[[session]]
name            = "Kitty Config 󰄛 "
path            = "~/.config/kitty"
startup_command = "nvim kitty.conf"
preview_command = "bat --color=always ~/.config/kitty/kitty.conf"
windows         = ["shell"]

[[session]]
name            = "Hyprland Config 󰣇 "
path            = "~/.config/hypr"
startup_command = "nvim ."
preview_command = "lsd -la --group-dirs=first ~/.config/hypr"
windows         = ["shell"]

[[session]]
name            = "Margo Config 󰣇 "
path            = "~/.config/margo"
startup_command = "nvim ."
preview_command = "lsd -la --group-dirs=first ~/.config/margo"
windows         = ["shell"]

[[session]]
name            = "Sesh Config 󰒓 "
path            = "~/.config/sesh"
startup_command = "nvim sesh.toml"
preview_command = "bat --color=always ~/.config/sesh/sesh.toml"

# ----- 4.5 Development -------------------------------------------------------
[[session]]
name            = "Projects 󱌢 "
path            = "~/Work/projects"
startup_command = "tm tmx --layout 3"
preview_command = "lsd -la --group-dirs=first ~/Work/projects"

[[session]]
name            = "Kod 󰘧 "
path            = "~/.kod"
startup_command = "lsd -la --group-dirs=first"
preview_command = "lsd -la --group-dirs=first ~/.kod"

[[session]]
name            = "Margo Kod 󰣇 "
path            = "~/.kod/margo"
startup_command = "lsd -la --group-dirs=first"
windows         = ["shell"]

[[session]]
name            = "Git Status 󰊢 "
path            = "~/.cachy"
startup_command = "lazygit"
preview_command = "git -C ~/.cachy status --short --branch"

[[session]]
name            = "Neovim 󰈸 "
path            = "~/"
startup_command = "nvim"

[[session]]
name            = "Tor 󰖟 "
path            = "/repo/tor"
startup_command = "yazi"
preview_command = "lsd -la --group-dirs=first /repo/tor"

# ----- 4.6 Podman VPN bring-up (3-pane layout) -------------------------------
#  Each session uses a `*-podman-up` helper that splits the current window into
#  3 panes: container live log (left) · stop command (right top) · ssh+byobu
#  (right bottom). Stop/ssh are pre-typed without Enter so you confirm before
#  firing. Mirrors the layout from fzf/_ssh_*_podman scripts.
[[session]]
name            = "BMC Podman 󰗀 "
path            = "~/.podman/vpn"
startup_command = "bmc-podman-up"
preview_command = "podman ps -a --filter name=vpn-bmc"

[[session]]
name            = "CMS Podman 󰗀 "
path            = "~/.podman/vpn"
startup_command = "cms-podman-up"
preview_command = "podman ps -a --filter name=vpn-cms"

[[session]]
name            = "GTU Podman 󰗀 "
path            = "~/.podman/vpn"
startup_command = "gtu-podman-up"
preview_command = "podman ps -a --filter name=vpn-gtu"

[[session]]
name            = "IYTE Podman 󰗀 "
path            = "~/.podman/vpn"
startup_command = "iyte-podman-up"
preview_command = "podman ps -a --filter name=vpn-iyte"

[[session]]
name            = "TOGG Podman 󰗀 "
path            = "~/.podman/vpn"
startup_command = "togg-podman-up"
preview_command = "podman ps -a --filter name=vpn-togg"

[[session]]
name            = "YTU Podman 󰗀 "
path            = "~/.podman/vpn"
startup_command = "ytu-podman-up"
preview_command = "podman ps -a --filter name=vpn-ytu"

# ----- 4.7 Media -------------------------------------------------------------
[[session]]
name            = "Music 󰎈 "
path            = "~/Music"
startup_command = "rmpc"
preview_command = "lsd -la --group-dirs=first ~/Music"

[[session]]
name            = "YouTube 󰗃 "
path            = "~/Downloads"
startup_command = "ytfzf -l"
preview_command = "lsd -la --group-dirs=first ~/Downloads"

[[session]]
name            = "Internet TV 󰠰 "
path            = "~/.config/ipwebtv"
startup_command = "$HOME/.config/tmux/fzf/_ipwebtv,--.watch.internet.tv.channels"
preview_command = "lsd -la --group-dirs=first ~/.config/ipwebtv"

# ----- 4.8 Productivity & Notes ----------------------------------------------
[[session]]
name            = "Anote 󰎚 "
path            = "~/"
startup_command = "anote"

[[session]]
name            = "Notes 󰠮 "
path            = "~/Notes"
startup_command = "nvim ."
preview_command = "lsd -la --group-dirs=first ~/Notes"
windows         = ["shell"]

[[session]]
name            = "Tasks 󰄬 "
path            = "~/"
startup_command = "task"
preview_command = "task next"

# =============================================================================
#  5. Reusable Window Presets
# =============================================================================
[[window]]
name           = "git"
startup_script = "lazygit"

[[window]]
name           = "shell"
startup_script = "$SHELL"

[[window]]
name           = "logs-shell"
startup_script = "$SHELL"
path           = "/var/log"

# =============================================================================
#  6. Wildcards (auto-config any matching directory from zoxide / picker)
# =============================================================================
#  Pattern semantics:
#    "<dir>/*"  → direct children only
#    "<dir>/**" → recursive descendants (excluding the dir itself)
# -----------------------------------------------------------------------------
[[wildcard]]
pattern         = "~/.kod/*"
startup_command = "nvim ."
preview_command = "lsd -la --group-dirs=first {}"
windows         = ["git", "shell"]

[[wildcard]]
pattern         = "~/Work/projects/*"
startup_command = "nvim ."
preview_command = "lsd -la --group-dirs=first {}"
windows         = ["git", "shell"]

[[wildcard]]
pattern         = "~/Work/projects/**"
startup_command = "nvim ."
preview_command = "lsd -la --group-dirs=first {}"
windows         = ["git", "shell"]

[[wildcard]]
pattern         = "~/Notes/**"
startup_command = "nvim ."
preview_command = "lsd -la --group-dirs=first {}"
windows         = ["shell"]
