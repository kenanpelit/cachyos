# Qt Global Settings
QT_QPA_PLATFORMTHEME=kvantum
QT_QPA_PLATFORMTHEME_QT6=kvantum
QT_STYLE_OVERRIDE=kvantum
QT_QPA_PLATFORM="wayland;xcb"
QT_QPA_SYSTEMTRAY_DARK_MODE=1
QT_WAYLAND_DISABLE_WINDOWDECORATION=1
QT_WAYLAND_FORCE_DPI=96
QT_AUTO_SCREEN_SCALE_FACTOR=1
QT_FONT_DPI=96
QT_ENABLE_HIGHDPI_SCALING=1

# Qt-specific icon theme; shared XDG/ICON theme ownership lives in the session
# layer so compositor-specific sessions do not drift from toolkit defaults.
QT_ICON_THEME=kora
