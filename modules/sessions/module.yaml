tags:
  - tool
description: UWSM session entries and wrappers for Wayland compositors
depends_on:
  - base
  - scripts
dotfiles:
  # margo's uwsm session entry is now shipped by the margo PACKAGE
  # (/usr/share/wayland-sessions/margo-uwsm.desktop). Linking a user-level
  # copy here too would show a duplicate "Margo (UWSM)" in the DM chooser.
  # - source: dotfiles/margo-uwsm.desktop
  #   target: ~/.local/share/wayland-sessions/margo-uwsm.desktop
  - source: dotfiles/systemd/user/margo-session.target
    target: ~/.config/systemd/user/margo-session.target
  - source: dotfiles/systemd/user/margo-clip-persist.service
    target: ~/.config/systemd/user/margo-clip-persist.service
  - source: dotfiles/systemd/user/wayland-wm@margo\x2dsession.service.d/10-session-lifecycle.conf
    target: ~/.config/systemd/user/wayland-wm@margo\x2dsession.service.d/10-session-lifecycle.conf
  - source: dotfiles/systemd/user/geoclue-agent.service
    target: ~/.config/systemd/user/geoclue-agent.service
  - source: dotfiles/systemd/user/geoclue-agent.timer
    target: ~/.config/systemd/user/geoclue-agent.timer
post_install_hook: scripts/install.sh
post_hook_behavior: always
