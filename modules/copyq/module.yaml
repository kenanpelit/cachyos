description: CopyQ config portable config

dotfiles_sync: true

dotfiles:
  - source: dotfiles/copyq/copyq.conf
    target: ~/.config/copyq/copyq.conf
  - source: dotfiles/systemd/user/copyq.service
    target: ~/.config/systemd/user/copyq.service

post_install_hook: scripts/install.sh
post_hook_behavior: always
