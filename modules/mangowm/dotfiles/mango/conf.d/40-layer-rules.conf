# Layer-shell adjustments for launchers, screenshots, shell surfaces, and
# notifications.

# Capture surfaces should stay instant and sharp.
layerrule=noanim:1,noblur:1,layer_name:^(selection|screenshot).*

# Launchers feel better with a compact zoom instead of a full edge-to-edge slide.
layerrule=animation_type_open:zoom,animation_type_close:zoom,layer_name:^(rofi|fuzzel|launcher).*

# Large shell surfaces should slide in/out; center zoom on big panels feels
# heavier and is more visually disruptive.
layerrule=animation_type_open:slide,animation_type_close:slide,layer_name:^(control-center|dash|session-menu|wallpaper|system-monitor|settings).*
layerrule=noshadow:1,layer_name:^(control-center|dash|session-menu|wallpaper|system-monitor).*

# Notification surfaces should stay lightweight.
layerrule=noanim:1,noshadow:1,layer_name:^notifications$
