# Large shell surfaces should avoid heavy shadows and abrupt pops.

layerrule=animation_type_open:zoom,animation_type_close:zoom,layer_name:^(control-center|dash|session-menu|wallpaper|system-monitor|settings).*
layerrule=noshadow:1,layer_name:^(control-center|dash|session-menu|wallpaper|system-monitor).*
