# Mouse, wheel, and touchpad gesture bindings.
# Tuned for Niri-like fluid navigation.

mousebind=SUPER,btn_left,moveresize,curmove
mousebind=SUPER,btn_right,moveresize,curresize
mousebind=NONE,btn_middle,togglemaximizescreen,0

# Niri-style: Super + Wheel to scroll through windows
axisbind=SUPER,UP,focusdir,left
axisbind=SUPER,DOWN,focusdir,right

# 3-finger horizontal swipe: focus windows
gesturebind=NONE,left,3,focusdir,left
gesturebind=NONE,right,3,focusdir,right

# 3-finger vertical swipe: switch workspaces
gesturebind=NONE,up,3,viewtoleft,0
gesturebind=NONE,down,3,viewtoright,0

# 4-finger gestures: overview and specialized actions
gesturebind=NONE,up,4,toggleoverview
gesturebind=NONE,down,4,toggleoverview
gesturebind=NONE,right,4,tagmon,up,1
gesturebind=NONE,left,4,tagmon,down,1
