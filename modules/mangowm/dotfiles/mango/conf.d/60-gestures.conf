# Mouse, wheel, and touchpad gesture bindings.
# Tuned for Niri-like fluid navigation.

mousebind=SUPER,btn_left,moveresize,curmove
mousebind=SUPER,btn_right,moveresize,curresize
#mousebind=NONE,btn_middle,togglefloating
#mousebind=NONE,btn_middle,togglemaximizescreen,0

# Niri-style: Super + Wheel to scroll through windows
axisbind=SUPER,UP,focusdir,left
axisbind=SUPER,DOWN,focusdir,right

# margo parity: 3-finger = window focus (all 4 directions), 4-finger = workspace
# nav + overview. (margo binds 3-finger vertical to a browser tab-cycle via its
# mshell `sendkey` action, which MangoWM lacks — so the vertical swipe falls back
# to focus up/down, matching margo's non-browser behaviour.)

# 3-finger swipe: focus windows
gesturebind=NONE,left,3,focusdir,left
gesturebind=NONE,right,3,focusdir,right
gesturebind=NONE,up,3,focusdir,up
gesturebind=NONE,down,3,focusdir,down

# 4-finger horizontal: workspace nav; vertical: overview
gesturebind=NONE,left,4,viewtoleft,0
gesturebind=NONE,right,4,viewtoright,0
gesturebind=NONE,up,4,spawn,mango-overview open
gesturebind=NONE,down,4,spawn,mango-overview close
