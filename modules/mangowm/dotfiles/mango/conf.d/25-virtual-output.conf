# Optional virtual outputs for remote desktop and screen sharing.
#
# The output appears only after `mango-virtual-output start`, but keeping the
# rule in the main config makes the headless monitor deterministic as soon as
# Mango creates it.

monitorrule=name:^HEADLESS-[0-9]+$,width:1920,height:1080,refresh:60,x:1920,y:0,scale:1,vrr:0
