# Core MangoWM binds tuned to the existing shell workflow.

keymode=common
binds=SUPER+CTRL,r,reload_config
binds=SUPER+CTRL+ALT,r,reload_config
bind=CTRL+ALT,BackSpace,spawn,uwsm stop
binds=SUPER+ALT,slash,spawn,osc-shell ipc call plugin:keybind-cheatsheet toggle
bind=SUPER,F1,spawn,osc-shell ipc call plugin:keybind-cheatsheet toggle
bind=ALT,F1,spawn,osc-shell ipc call plugin:keybind-cheatsheet toggle
binds=SUPER+CTRL+ALT,s,spawn,mango-session-refresh
binds=SUPER+CTRL+ALT,d,spawn,uwsm app -a mango-doctor -- /usr/bin/kitty --class mango-doctor -e mango-session-doctor
binds=SUPER+CTRL+ALT,l,spawn,mango-layer-audit --watch --duration 20
binds=ALT,shift_l,switch_keyboard_layout

bind=NONE,XF86AudioRaiseVolume,spawn,osc-shell ipc call volume increase
bind=NONE,XF86AudioLowerVolume,spawn,osc-shell ipc call volume decrease
bind=NONE,XF86AudioMute,spawn,osc-shell ipc call volume muteOutput
bind=NONE,XF86AudioMicMute,spawn,osc-shell ipc call volume muteInput
bind=NONE,XF86MonBrightnessUp,spawn,osc-shell ipc call brightness increase
bind=NONE,XF86MonBrightnessDown,spawn,osc-shell ipc call brightness decrease

bind=NONE,Print,spawn,screenshot rec
bind=SHIFT,Print,spawn,screenshot area
bind=CTRL,Print,spawn,screenshot screen
bind=ALT,Print,spawn,screenshot window

keymode=default

binds=SUPER,r,switch_proportion_preset
binds=SUPER+SHIFT,r,set_proportion,0.500
#binds=SUPER,m,quit

binds=SUPER,h,focusdir,left
binds=SUPER,l,focusdir,right
binds=SUPER,k,focusdir,up
binds=SUPER,j,focusdir,down
bind=SUPER,Tab,focusstack,next
bind=SUPER+SHIFT,Tab,focusstack,prev
bind=SUPER,Left,focusdir,left
bind=SUPER,Right,focusdir,right
bind=SUPER,Up,focusdir,up
bind=SUPER,Down,focusdir,down

binds=SUPER+SHIFT,h,exchange_client,left
binds=SUPER+SHIFT,l,exchange_client,right
binds=SUPER+SHIFT,k,exchange_client,up
binds=SUPER+SHIFT,j,exchange_client,down
bind=SUPER+SHIFT,Left,exchange_client,left
bind=SUPER+SHIFT,Right,exchange_client,right
bind=SUPER+SHIFT,Up,exchange_client,up
bind=SUPER+SHIFT,Down,exchange_client,down

binds=SUPER,q,killclient
bind=ALT,F4,killclient
binds=SUPER,f,togglefullscreen
binds=SUPER+CTRL+ALT,f,togglefakefullscreen
binds=SUPER,g,togglefloating
binds=SUPER,m,togglemaximizescreen,0
binds=SUPER,o,toggleoverlay,0
binds=SUPER,i,minimized,0
binds=SUPER+SHIFT,I,restore_minimized
binds=SUPER+ALT,o,spawn,mango-overview toggle
binds=SUPER+CTRL,o,spawn,mango-overview open
binds=SUPER+CTRL+SHIFT,o,spawn,mango-overview close
binds=SUPER,p,toggleglobal
binds=SUPER+SHIFT,s,toggleglobal
bind=SUPER,BackSpace,toggle_scratchpad
bind=ALT,BackSpace,restore_minimized

binds=SUPER,s,setkeymode,layout
binds=SUPER+ALT,m,setkeymode,monitor
binds=SUPER,e,set_proportion,1.0
binds=SUPER+CTRL,t,setlayout,tile
binds=SUPER+CTRL,v,setlayout,vertical_grid
binds=SUPER,c,setlayout,center_tile
binds=SUPER,x,setlayout,scroller
binds=SUPER+CTRL,w,switch_layout
binds=SUPER+CTRL,h,scroller_stack,left
binds=SUPER+CTRL,l,scroller_stack,right
binds=SUPER+CTRL,k,scroller_stack,up
binds=SUPER+CTRL,j,scroller_stack,down
binds=SUPER,z,zoom
binds=SUPER,a,spawn,mango-monitor-smart focus-next
binds=SUPER+SHIFT,a,togglegaps
bind=SUPER,0,resizewin,960,540
binds=SUPER+SHIFT,0,resizewin,1280,720
binds=SUPER+CTRL,0,resizewin,1920,1080
# Use physical number-row keycodes so Shift-number moves survive non-US layouts.
bind=SUPER+SHIFT,code:10,spawn,mango-tag-smart 1
bind=SUPER+SHIFT,code:11,spawn,mango-tag-smart 2
bind=SUPER+SHIFT,code:12,spawn,mango-tag-smart 3
bind=SUPER+SHIFT,code:13,spawn,mango-tag-smart 4
bind=SUPER+SHIFT,code:14,spawn,mango-tag-smart 5
bind=SUPER+SHIFT,code:15,spawn,mango-tag-smart 6
bind=SUPER+SHIFT,code:16,spawn,mango-tag-smart 7
bind=SUPER+SHIFT,code:17,spawn,mango-tag-smart 8
bind=SUPER+SHIFT,code:18,spawn,mango-tag-smart 9

bind=SUPER,space,spawn,osc-shell ipc call launcher toggle
binds=SUPER+CTRL,d,spawn,osc-shell ipc call settings toggle
binds=SUPER,d,spawn,osc-shell ipc call control-center toggle
binds=SUPER+ALT,s,spawn,osc-shell ipc call dash toggle overview
binds=SUPER+ALT,d,spawn,handyctl toggle
binds=SUPER+ALT+SHIFT,d,spawn,handyctl post
binds=SUPER+ALT,x,spawn,handyctl cancel
binds=SUPER,n,spawn,osc-shell ipc call notifications toggleHistory
binds=SUPER,v,spawn,copyq toggle
binds=SUPER+SHIFT,d,spawn,osc-shell ipc call launcher windows
binds=SUPER+SHIFT,p,spawn,osc-shell ipc call systemMonitor toggle
binds=SUPER+CTRL,n,spawn,osc-shell ipc call plugin:notes togglePanel
binds=SUPER,comma,spawn,osc-shell ipc call settings toggle
binds=SUPER,u,spawn,osc-shell ipc call plugin:assistant-panel toggle
bind=ALT,Tab,spawn,osc-shell ipc call launcher windows
binds=SUPER,b,spawn,osc-shell ipc call bar toggle
binds=SUPER+SHIFT,b,spawn,osc-shell ipc call dock toggle
binds=SUPER+CTRL,b,spawn,osc-shell ipc call bar toggleAutoHide
bind=SUPER,Delete,spawn,osc-shell ipc call sessionMenu toggle
bind=SUPER+SHIFT,Delete,spawn,osc-shell ipc call idleInhibitor toggle
binds=ALT,l,spawn,osc-shell ipc call lockScreen lock

binds=SUPER,t,spawn,uwsm app -a kitty -- /usr/bin/kitty
bind=SUPER,Return,toggle_named_scratchpad,dropdown-terminal,none,kitty --class dropdown-terminal
bind=SUPER+ALT,f,toggle_named_scratchpad,yazi-scratchpad,none,kitty --class yazi-scratchpad -e yazi
bind=SUPER+ALT,Return,spawn,uwsm app -a semsumo-daily -- semsumo-daily
binds=SUPER+CTRL,f,spawn,uwsm app -a nemo -- /usr/bin/nemo
binds=ALT+CTRL,f,spawn,uwsm app -a yazi -- /usr/bin/kitty -e yazi
bind=SUPER+ALT,space,spawn,uwsm app -a rofi-launcher -- rofi-launcher
bind=ALT,space,spawn,osc-shell ipc call plugin:custom-commands toggle
binds=ALT,t,spawn,uwsm app -a start-kkenp -- start-kkenp
binds=ALT,n,spawn,uwsm app -a anotes -- anotes

binds=SUPER,y,spawn,osc-shell ipc call wallpaper toggle
binds=SUPER,w,spawn,osc-shell ipc call wallpaper next
binds=SUPER+SHIFT,w,spawn,osc-shell ipc call wallpaper prev
binds=SUPER+SHIFT,t,spawn,osc-shell ipc call darkMode toggle
binds=SUPER+SHIFT,n,spawn,osc-shell ipc call nightLight toggle

bind=SUPER,Page_Up,viewtoleft,0
bind=SUPER,Page_Down,viewtoright,0
bind=CTRL,Page_Up,viewtoleft_have_client,0
bind=CTRL,Page_Down,viewtoright_have_client,0
bind=CTRL+SUPER,Page_Up,tagtoleft,0
bind=CTRL+SUPER,Page_Down,tagtoright,0

binds=SUPER+ALT,h,focusmon,left
binds=SUPER+ALT,l,focusmon,right
binds=SUPER+ALT,k,focusmon,up
binds=SUPER+ALT,j,focusmon,down
binds=SUPER+CTRL,a,spawn,mango-monitor-smart move-next
bind=SUPER,Escape,spawn,mango-monitor-smart move-next
bind=SUPER+ALT+SHIFT,Left,tagmon,left,1
bind=SUPER+ALT+SHIFT,Right,tagmon,right,1
bind=SUPER+CTRL,Up,tagmon,up,1
bind=SUPER+CTRL,Down,tagmon,down,1

binds=ALT,a,spawn,osc-soundctl switch
binds=ALT+CTRL,a,spawn,osc-soundctl switch-mic
binds=ALT,e,spawn,osc-media spotify toggle
binds=ALT+CTRL,n,spawn,osc-media spotify next
binds=ALT+CTRL,b,spawn,osc-media spotify prev
binds=ALT+CTRL,e,spawn,osc-media mpc toggle
binds=ALT,i,spawn,osc-media browser toggle
binds=ALT,u,spawn,osc-media mpv toggle
binds=SUPER+CTRL,y,spawn,mpv-manager play-yt
binds=CTRL+ALT,y,spawn,mpv-manager stick
binds=SHIFT+ALT,y,spawn,mpv-manager move
bind=SUPER+CTRL,F11,spawn,mpv-manager save-yt
bind=SUPER+CTRL,F12,spawn,mpv-manager wallpaper
binds=CTRL+ALT,p,spawn,power-profile
binds=CTRL+ALT,m,spawn,osc-wiremix
binds=SUPER+CTRL+SHIFT,v,spawn,osc-shell ipc call plugin:clipper toggle
binds=SUPER+ALT,v,toggle_named_scratchpad,clipse,none,kitty --class clipse -e clipse
binds=SUPER+SHIFT,c,spawn,screenshot pick
bind=NONE,F10,spawn,bluetooth_toggle
bind=ALT,F12,spawn,osc-mullvad toggle --with-blocky
bind=SUPER+ALT,F12,spawn,osc-mullvad slot --hold recycle

keymode=layout
binds=NONE,h,setmfact,-0.05
binds=NONE,l,setmfact,+0.05
binds=NONE,j,incnmaster,-1
binds=NONE,k,incnmaster,+1
binds=NONE,r,switch_proportion_preset
binds=SHIFT,r,set_proportion,0.500
binds=NONE,e,set_proportion,1.0
binds=NONE,t,setlayout,tile
binds=NONE,v,setlayout,vertical_grid
binds=NONE,c,setlayout,center_tile
binds=NONE,x,setlayout,scroller
binds=NONE,w,switch_layout
binds=ALT,h,scroller_stack,left
binds=ALT,l,scroller_stack,right
binds=ALT,k,scroller_stack,up
binds=ALT,j,scroller_stack,down
binds=NONE,z,zoom
binds=NONE,g,togglegaps
bind=NONE,0,resizewin,960,540
bind=SHIFT,0,resizewin,1280,720
bind=CTRL,0,resizewin,1920,1080
bind=NONE,Escape,setkeymode,default
bind=NONE,Return,setkeymode,default

keymode=monitor
binds=NONE,h,focusmon,left
binds=NONE,l,focusmon,right
binds=NONE,k,focusmon,up
binds=NONE,j,focusmon,down
binds=SHIFT,h,tagmon,left,1
binds=SHIFT,l,tagmon,right,1
binds=SHIFT,k,tagmon,up,1
binds=SHIFT,j,tagmon,down,1
binds=NONE,a,spawn,mango-monitor-smart focus-next
binds=NONE,m,spawn,mango-monitor-smart move-next
binds=NONE,p,spawn,mango-profile-select
binds=NONE,v,spawn,mango-virtual-output start
binds=SHIFT,v,spawn,mango-virtual-output stop
binds=NONE,s,spawn,mango-virtual-output status
bind=NONE,Escape,setkeymode,default
bind=NONE,Return,setkeymode,default
