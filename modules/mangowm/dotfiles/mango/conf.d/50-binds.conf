# Core MangoWM binds tuned to the existing shell workflow.

bind=SUPER,r,reload_config
bind=CTRL+ALT,BackSpace,spawn,uwsm stop
bind=SUPER,m,quit

bind=SUPER,h,focusdir,left
bind=SUPER,l,focusdir,right
bind=SUPER,k,focusdir,up
bind=SUPER,j,focusdir,down
bind=SUPER,Left,focusdir,left
bind=SUPER,Right,focusdir,right
bind=SUPER,Up,focusdir,up
bind=SUPER,Down,focusdir,down

bind=SUPER+SHIFT,h,exchange_client,left
bind=SUPER+SHIFT,l,exchange_client,right
bind=SUPER+SHIFT,k,exchange_client,up
bind=SUPER+SHIFT,j,exchange_client,down
bind=SUPER+SHIFT,Left,exchange_client,left
bind=SUPER+SHIFT,Right,exchange_client,right
bind=SUPER+SHIFT,Up,exchange_client,up
bind=SUPER+SHIFT,Down,exchange_client,down

bind=SUPER,q,killclient
bind=ALT,F4,killclient
bind=SUPER,f,togglefullscreen
bind=SUPER,backslash,togglefloating
bind=SUPER,a,togglemaximizescreen,0
bind=SUPER,o,toggleoverlay,0
bind=SUPER,i,minimized,0
bind=SUPER+SHIFT,I,restore_minimized
bind=SUPER+ALT,o,toggleoverview,0

bind=SUPER,e,set_proportion,1.0
bind=SUPER,x,switch_proportion_preset
bind=SUPER,w,switch_layout

bind=SUPER,space,spawn,osc-shell ipc call launcher toggle
bind=SUPER,d,spawn,osc-shell ipc call control-center toggle
bind=SUPER,n,spawn,osc-shell ipc call notifications toggleHistory
bind=SUPER,v,spawn,copyq toggle
bind=SUPER,Delete,spawn,osc-shell ipc call sessionMenu toggle
bind=ALT,l,spawn,osc-shell ipc call lockScreen lock

bind=SUPER,t,spawn,kitty
bind=ALT,Return,toggle_named_scratchpad,dropdown-terminal,none,kitty --class dropdown-terminal
bind=SUPER+ALT,Return,spawn,semsumo-daily
bind=SUPER+CTRL,f,spawn,nemo
bind=ALT+CTRL,f,spawn,kitty -e yazi
bind=SUPER+ALT,space,spawn,rofi-launcher

bind=SUPER,1,view,1,0
bind=SUPER,2,view,2,0
bind=SUPER,3,view,3,0
bind=SUPER,4,view,4,0
bind=SUPER,5,view,5,0
bind=SUPER,6,view,6,0
bind=SUPER,7,view,7,0
bind=SUPER,8,view,8,0
bind=SUPER,9,view,9,0

bind=SUPER+SHIFT,1,tag,1,0
bind=SUPER+SHIFT,2,tag,2,0
bind=SUPER+SHIFT,3,tag,3,0
bind=SUPER+SHIFT,4,tag,4,0
bind=SUPER+SHIFT,5,tag,5,0
bind=SUPER+SHIFT,6,tag,6,0
bind=SUPER+SHIFT,7,tag,7,0
bind=SUPER+SHIFT,8,tag,8,0
bind=SUPER+SHIFT,9,tag,9,0

bind=SUPER,Page_Up,viewtoleft,0
bind=SUPER,Page_Down,viewtoright,0
bind=CTRL,Page_Up,viewtoleft_have_client,0
bind=CTRL,Page_Down,viewtoright_have_client,0
bind=CTRL+SUPER,Page_Up,tagtoleft,0
bind=CTRL+SUPER,Page_Down,tagtoright,0

bind=SUPER+ALT,h,focusmon,left
bind=SUPER+ALT,l,focusmon,right
bind=SUPER+ALT,k,focusmon,up
bind=SUPER+ALT,j,focusmon,down
bind=SUPER+ALT+SHIFT,h,tagmon,left
bind=SUPER+ALT+SHIFT,l,tagmon,right
bind=SUPER+ALT+SHIFT,k,tagmon,up
bind=SUPER+ALT+SHIFT,j,tagmon,down

bind=ALT,shift_l,switch_keyboard_layout

bind=NONE,XF86AudioRaiseVolume,spawn,osc-shell ipc call volume increase
bind=NONE,XF86AudioLowerVolume,spawn,osc-shell ipc call volume decrease
bind=NONE,XF86AudioMute,spawn,osc-shell ipc call volume muteOutput
bind=NONE,XF86AudioMicMute,spawn,osc-shell ipc call volume muteInput
bind=NONE,XF86MonBrightnessUp,spawn,osc-shell ipc call brightness increase
bind=NONE,XF86MonBrightnessDown,spawn,osc-shell ipc call brightness decrease

bind=NONE,Print,spawn,screenshot rec
bind=SHIFT,Print,spawn,screenshot area
bind=CTRL,Print,spawn,screenshot screen
bind=ALT,Print,spawn,screenshot window
