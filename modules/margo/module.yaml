tags:
  - wm
  - desktop
description: Margo compositor config (UWSM-first + start-margo supervisor)
depends_on:
  - base
  - gtk
  - qt
  - xdg-dirs
  - scripts
  - fonts
  - wayland-autostart
  - xdg-portal
  - user-services
  - sessions
dotfiles:
  - source: scripts/bin/mtune-mediakey
    target: ~/.local/bin/mtune-mediakey
  - source: dotfiles/margo/config.conf
    target: ~/.config/margo/config.conf
  - source: dotfiles/margo/layouts/layout_vertical-ext-top.conf
    target: ~/.config/margo/layouts/layout_vertical-ext-top.conf
  - source: dotfiles/margo/layouts/layout_default.conf
    target: ~/.config/margo/layouts/layout_default.conf
  - source: dotfiles/margo/binds.conf
    target: ~/.config/margo/binds.conf
  - source: dotfiles/margo/mlock.conf
    target: ~/.config/margo/mlock.conf
  - source: dotfiles/margo/mpower.toml
    target: ~/.config/margo/mpower.toml
  - source: dotfiles/margo/twilight/schedule.conf
    target: ~/.config/margo/twilight/schedule.conf
  - source: dotfiles/margo/twilight/presets/morning.toml
    target: ~/.config/margo/twilight/presets/morning.toml
  - source: dotfiles/margo/twilight/presets/late-morning.toml
    target: ~/.config/margo/twilight/presets/late-morning.toml
  - source: dotfiles/margo/twilight/presets/afternoon.toml
    target: ~/.config/margo/twilight/presets/afternoon.toml
  - source: dotfiles/margo/twilight/presets/sunset.toml
    target: ~/.config/margo/twilight/presets/sunset.toml
  - source: dotfiles/margo/twilight/presets/evening.toml
    target: ~/.config/margo/twilight/presets/evening.toml
  - source: dotfiles/margo/twilight/presets/deep-night.toml
    target: ~/.config/margo/twilight/presets/deep-night.toml
  - source: dotfiles/margo/mshell/profiles/default.yaml
    target: ~/.config/margo/mshell/profiles/default.yaml
  - source: dotfiles/margo/mshell/profiles/margo.yaml
    target: ~/.config/margo/mshell/profiles/margo.yaml
  - source: dotfiles/environment.d/10-margo-wayland.conf
    target: ~/.config/environment.d/10-margo-wayland.conf
  - source: dotfiles/environment.d/margo-session.envlist
    target: ~/.config/environment.d/margo-session.envlist
  - source: dotfiles/systemd/user/margo-audio-init.service
    target: ~/.config/systemd/user/margo-audio-init.service
  - source: dotfiles/systemd/user/margo-status-notifier-ready.service
    target: ~/.config/systemd/user/margo-status-notifier-ready.service
  - source: dotfiles/systemd/user/margo-polkit-agent.service
    target: ~/.config/systemd/user/margo-polkit-agent.service
  - source: dotfiles/systemd/user/margo-nm-applet.service
    target: ~/.config/systemd/user/margo-nm-applet.service
  - source: dotfiles/systemd/user/mpower.service
    target: ~/.config/systemd/user/mpower.service
  - source: dotfiles/systemd/user/mshell.service.d/10-margo-session.conf
    target: ~/.config/systemd/user/mshell.service.d/10-margo-session.conf
post_install_hook: scripts/install.sh
post_hook_behavior: always
