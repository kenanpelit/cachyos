# matugen wrapper config — Material You renkleri duvar kâğıdından çıkarıp
# margo + mshell konfiglerine yansıtır. `margo-matugen <wallpaper>` ile
# tetiklenir; çıktılar `~/.cache/margo/` altına yazılır.

[config]
# Hex değerlerini "#" prefiksli üretir (`hex_stripped` filtresiyle "#"-sız
# da kullanılabilir, margo template'inde böyle yapıyoruz).

# margo compositor [colors] bloğu — config.conf içine `source = ...` ile
# include edilebilir bir parça. Margo'nun `0xRRGGBBAA` formatına çevriliyor.
[templates.margo-colors]
input_path  = "~/.config/margo/matugen/templates/margo-colors.conf.tmpl"
output_path = "~/.cache/margo/margo-colors.conf"

# mshell [appearance] color subseti — TOML. Tek başına bir mshell.toml
# parçası; ileride mshell'in layered loader'ı bunu otomatik overlay
# edecek. Şimdilik referans amaçlı kullanılabiliyor.
[templates.mshell-colors]
input_path  = "~/.config/margo/matugen/templates/mshell-colors.toml.tmpl"
output_path = "~/.cache/margo/mshell-colors.toml"
