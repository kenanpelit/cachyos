# Managed by mshell Settings → Keybinds.
# Edits here are overwritten by the editor; the syntax is the same as
# config.conf: bind = MODS,KEY,ACTION[,ARGS]   #"description"

# Launch
bind = alt,comma,spawn,mplay media prev
bind = ctrl+alt,e,spawn,mplay media toggle mpd
bind = super+ctrl,f,spawn,uwsm app -a nemo -- /usr/bin/nemo
bind = super+ctrl,F11,spawn,mplay download
bind = super+ctrl,F12,spawn,mplay wallpaper start
bind = super+ctrl+shift,F12,spawn,mplay wallpaper stop
bind = alt,n,spawn,uwsm app -a anotes -- anotes
bind = alt,p,spawn,mplay media toggle
bind = ctrl+alt,p,spawn,mpower cycle
bind = alt,period,spawn,mplay media next
bind = super,Return,spawn,uwsm app -a kitty -- /usr/bin/kitty
bind = super+alt,Return,spawn,margo-semsumo-daily
bind = alt,t,spawn,start-kkenp
bind = alt,u,spawn,mplay media toggle mpv
bind = super+ctrl,y,spawn,mplay play
bind = super+alt,y,spawn,mplay toggle
bind = ctrl+alt,y,spawn,mplay pin
bind = alt+shift,y,spawn,mplay snap
bind = super+ctrl+alt,y,spawn,mplay focus
bind = ctrl+shift,y,spawn,mplay stop

