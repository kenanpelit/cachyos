# Headset / media keys — a chatty BT headset spams XF86AudioPlay/Pause, which
# (unbound) leaked into the focused terminal as kitty-protocol 57428u/57429u
# AND (bound to real control) spuriously started/stopped Spotify. So bind them
# to a no-op (`spawn,true`): margo CONSUMES the key (no terminal leak) but does
# nothing (no media side effects). Intentional media control stays on the
# dedicated alt+p / alt+period / alt+comma / alt+e binds above.
bind = NONE,XF86AudioPlay,spawn,true
bind = NONE,XF86AudioPause,spawn,true
bind = NONE,XF86AudioPlayPause,spawn,true
bind = NONE,XF86AudioStop,spawn,true
bind = NONE,XF86AudioNext,spawn,true
bind = NONE,XF86AudioPrev,spawn,true
bind = NONE,XF86MonBrightnessDown,spawn,mshellctl brightness down
bind = NONE,XF86MonBrightnessUp,spawn,mshellctl brightness up
bind = super,y,spawn,mshellctl menu wallpaper
bind = super+shift,y,spawn,mshellctl wallpaper next

# System
bind = super+ctrl+alt,BackSpace,force_unlock
bind = alt,l,spawn,mlock   #"lock the screen (margo mlock — ext-session-lock-v1 + PAM)"
