# ── mshell IPC (mshellctl) ────────────────────────────────────────────────────
# launcher / quick-settings / volume / brightness / lock commands invoked
# through the in-tree mshell. `mshellctl --help` lists the subcommands;
# `mshellctl menu <name>` toggles a menu, `mshellctl bar <where>` controls bar
# visibility, `mshellctl audio` the volume, `mshellctl brightness` the
# brightness. The old osc-shell lines are commented below — panels with no
# direct mshellctl equivalent (we use quick-settings instead of control-center;
# no equivalent for dash / system-monitor / custom-commands / launcher-windows /
# assistant-panel / notes / sessionMenu / idleInhibitor / darkMode /
# nightLight / clipper / keybind-cheatsheet).

# Menus
bind = super,space,spawn,mshellctl menu app-launcher
bind = alt,space,spawn,mshellctl menu app-launcher --tab Run
#bind = super,d,spawn,mshellctl menu quick-settings
bind = super,d,spawn,mshellctl menu dashboard
bind = super+shift,d,spawn,mshellctl menu control-center
bind = super+ctrl,d,spawn,mshellctl settings open
