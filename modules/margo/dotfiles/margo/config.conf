# ── Overview (MangoWM-style zoom-out) ───────────────────────────────────────
# Single dynamic Grid layout over every visible client across all tags
# (mango-ext semantics: `void overview(Monitor *m) { grid(m); }`). Cell
# count = window count, NOT 9. So:
#   1 window  → ~ 90% × 90% of the screen, centred
#   2 windows → side-by-side halves
#   4 windows → 2 × 2 quarters
#   9 windows → 3 × 3 evenly
# Cells shrink dynamically as window count grows.
#
# `overview_zoom`: 1.0 = full work area (mango-ext default feel). Drop
# to 0.85-0.9 if you want some breathing room around the grid (zoomed-
# out aesthetic). overviewgappi/gappo at the top of the file
# (~line 261) tune the overview's own inner/outer gap independently of
# the normal-layout gaps — currently `overviewgappi = 12`,
# `overviewgappo = 60`.
overview_transition_ms = 180
overview_zoom = 1.00

# Selection styling — the alt+Tab cycle and pointer hover both flip
# `is_overview_hovered`; border.rs paints the selected thumbnail in
# `focuscolor`, multiplied by `overview_selected_border_multiplier` so
# the pick reads at a glance even at small thumbnail sizes (1.0 = same
# as normal border, 1.5–2.0 popular). Unselected thumbnails dim their
# content alpha to `overview_dim_alpha` for a spotlight feel
# (selected thumbnail always renders at full opacity). Set either
# value to 1.0 to opt out.
overview_selected_border_multiplier = 1.6
overview_dim_alpha                  = 0.7

# Alt+Tab cycle order — three modes:
#   mru    → most-recently-used first (focus_history-driven). Matches
#            i3/sway/Hypr/niri/GNOME. Cycle reflects how you navigate.
#   tag    → strict tag order (tag 1 → 9), clients-vec inside each.
#            Spatial-memory model: tag 1 windows always first.
#   mixed  → current tag's clients in MRU order, remaining tags in
#            strict tag order. "MRU where you live, tag elsewhere."
overview_cycle_order = mru

# Triggers — pick whichever fits muscle memory; all route to the same
# handler. The 4-finger touchpad swipe binds live further down the file
# (search for `gesturebind = NONE,up,4,toggle_overview`).
hot_corner_top_left    = toggle_overview
hot_corner_dwell_ms    = 100

# Keyboard navigation inside overview.
#   alt+Tab        → step to the NEXT window in MRU order (most-
#                    recently-touched first; `focus_history`-driven,
#                    matches i3/sway/Hypr/niri/GNOME). Border lights
#                    up `focuscolor` instantly on the new pick — no
#                    arrange runs, only `is_overview_hovered` flips
#                    and `border::refresh` repaints.
#   alt+shift+Tab  → step BACK one position.
#   release Alt    → AUTO-COMMIT the highlighted window. Win/GNOME/
#                    Hypr muscle memory: hold Alt, tap Tab to walk,
#                    let go of Alt to confirm. Works with any
#                    modifier the binding uses (super+Tab would
#                    commit on Super release, etc.).
#   alt+Return     → explicit commit path, still wired for users
#                    who prefer it over the modifier-release
#                    behaviour.
bind = alt,Tab,overview_focus_next
#bind = super,Tab,toggle_scroller_overview
bind = alt+shift,Tab,overview_focus_prev
bind = alt,Return,overview_activate

# ── Twilight (built-in blue-light filter) ───────────────────────────────────
# Built-in colour-temperature scheduler. Replaces sunsetr/gammastep/redshift —
# tick lives in margo's own event loop, ramps go straight to DRM GAMMA_LUT
# via the existing wlr_gamma_control plumbing. Disabled by default;
# enable with `twilight = 1` AFTER stopping any external client:
#
#   systemctl --user disable --now sunsetr sunsetr-scheduler
#   mctl reload     # picks up `twilight = 1`
#
# Live control:
#   mctl twilight status           # current temp / gamma / phase / source
#   mctl twilight preview 2500     # pin 2500 K until reset
#   mctl twilight preview 4000 90  # 4000 K @ 90 % brightness
#   mctl twilight test 10          # 10 s day→night sweep
#   mctl twilight set day_temp=5800
#   mctl twilight reset            # clear preview, resume schedule
#
# Values below mirror the user's sunsetr settings (Istanbul, warm day) so
# flipping `twilight` to 1 lands the same on-screen feel without further tweaks.
twilight                  = 1          # 1=on, 0=off (opt-in)
twilight_mode = schedule  # geo | manual | static
twilight_day_temp = 3000  # Kelvin (sunsetr's day_temp)
twilight_night_temp = 2500  # Kelvin (sunsetr's night_temp)
twilight_day_gamma = 97  # % (matches sunsetr day_gamma)
twilight_night_gamma = 92  # % (matches sunsetr night_gamma)
twilight_transition_s     = 2700       # 45 min total transition window
twilight_update_interval  = 60         # idle tick seconds (transition: ~250 ms)

# Geo mode — Istanbul.
twilight_latitude         = 41.008
twilight_longitude        = 28.978

# Manual mode (mode = manual). HH:MM(:SS) local time. Both blank ⇒ fall back
# to geo if a manual schedule is misconfigured.
# twilight_sunrise        = 06:30
# twilight_sunset         = 19:00

# Static mode (mode = static). One fixed temp/gamma 24/7.
twilight_static_temp      = 4000
twilight_static_gamma     = 95

# ── Tag'ler (1-9) ────────────────────────────────────────────────────────────
# Tag bitmask: 1=tag1, 2=tag2, 4=tag3, 8=tag4, 16=tag5, 32=tag6, 64=tag7,
# 128=tag8, 256=tag9. 4294967295 (=u32::MAX) = tüm tag'ler.
# Aynı tag'a iki kere super+N → önceki tag'a dön (view_current_to_back=1).
bind = super,1,view,1
bind = super,2,view,2
bind = super,3,view,4
bind = super,4,view,8
bind = super,5,view,16
bind = super,6,view,32
bind = super,7,view,64
bind = super,8,view,128
bind = super,9,view,256
bind = super,0,view,4294967295

# Pencereyi tag'e taşı (sen kalırsın — dwm geleneği)
bind = super+shift,1,tag,1
bind = super+shift,2,tag,2
bind = super+shift,3,tag,4
bind = super+shift,4,tag,8
bind = super+shift,5,tag,16
bind = super+shift,6,tag,32
bind = super+shift,7,tag,64
bind = super+shift,8,tag,128
bind = super+shift,9,tag,256

# Pencereyi tag'e taşı + sen de oraya git (Hyprland tarzı follow)
bind = super+ctrl+shift,1,tagview,1
bind = super+ctrl+shift,2,tagview,2
bind = super+ctrl+shift,3,tagview,4
bind = super+ctrl+shift,4,tagview,8
bind = super+ctrl+shift,5,tagview,16
bind = super+ctrl+shift,6,tagview,32
bind = super+ctrl+shift,7,tagview,64
bind = super+ctrl+shift,8,tagview,128
bind = super+ctrl+shift,9,tagview,256

# Tag'i görünüme ekle/çıkar (toggle view — birden çok tag aynı anda)
bind = super+ctrl,1,toggleview,1
bind = super+ctrl,2,toggleview,2
bind = super+ctrl,3,toggleview,4
bind = super+ctrl,4,toggleview,8
bind = super+ctrl,5,toggleview,16
bind = super+ctrl,6,toggleview,32
bind = super+ctrl,7,toggleview,64
bind = super+ctrl,8,toggleview,128
bind = super+ctrl,9,toggleview,256

# ── Tag/monitor navigasyonu ──────────────────────────────────────────────────
bind = super,Page_Up,viewtoleft
bind = super,Page_Down,viewtoright
bind = super+ctrl,Page_Up,tagtoleft
bind = super+ctrl,Page_Down,tagtoright
# diğer monitöre focus geçir
bind = super,a,focusmon,1
# pencereyi diğer monitöre taşı (yukarı / aşağı yön etiketi sadece
# alışkanlık — `tagmon,-1` = mevcut listede önceki monitör)
bind = super+ctrl,Up,tagmon,-1
bind = super+ctrl,Down,tagmon,1

# ── Touchpad gesture'lar (Niri/Mango tarzı) ─────────────────────────────────
# tag_animation_direction = 0 (yatay tag yönü) ile uyumlu:
# yatay swipe'lar tag'ler arası geçiş — hareket yönü tag akışıyla paralel,
# GNOME/macOS workspace switch muscle memory'siyle birebir.
# Dikey swipe'lar pencere fokus / overview için ayrılmış.

# 3-finger
# Yatay → tag navigasyonu (yatay tag akışıyla paralel: sol = önceki, sağ = sonraki)
#gesturebind = NONE,left,3,viewtoleft
#gesturebind = NONE,right,3,viewtoright
gesturebind = NONE,left,3,focusdir,left
gesturebind = NONE,right,3,focusdir,right
# Dikey → pencere fokus (vim k/j perpendicular)
gesturebind = NONE,up,3,focusdir,up
gesturebind = NONE,down,3,focusdir,down
#gesturebind = NONE,up,3,focusmon,
# 4-finger
# Yatay → focused pencereyi komşu monitöre taşı (tagmon: -1 = önceki monitör,
# +1 = sonraki). 4-finger horizontal → "büyük hareket" semantiği:
# 3-finger aynı monitör içinde tag'ler arasında gezerken, 4-finger pencereyi
# monitörler arasında sürüklüyor — laptop dock/undock akışına uygun.
gesturebind = NONE,left,4,viewtoleft
gesturebind = NONE,right,4,viewtoright
# Dikey → overview (Mission Control muscle memory)
gesturebind = NONE,up,4,toggle_overview
gesturebind = NONE,down,4,toggle_overview

# Niri-style: super + scroll wheel → scroller column içinde pencere fokus
# (tag navigasyonu için 3-finger swipe yeterli, scroll wheel'i kolonlar
# arası dolaşmaya bırakıyoruz).
axisbind = super,UP,focusdir,left
axisbind = super,DOWN,focusdir,right

# ── Sistem ───────────────────────────────────────────────────────────────────
# config'i hot-reload et (oturumu kapatmaya gerek yok)
bind = super+ctrl,r,reload_config
# session-lock kilitlendiyse acil çıkış (whitelist'lenmiş action — locked
# durumda bile tetiklenir)
bind = super+ctrl+alt,BackSpace,force_unlock
# margo'dan çık (TTY'ye düşer — UWSM session sonlanır)
bind = super+shift,q,quit

# managed by mlayout
source = conf.d/mlayout.conf
overview_style = scroller
scroller_overview_zoom = 0.30
scroller_overview_gap = 20

scroller_overview_loop = 1

# Per-tag tiling layouts (managed by mshell).
source = conf.d/taglayouts.conf
