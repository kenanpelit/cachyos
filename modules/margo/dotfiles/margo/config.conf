bind = ctrl+alt,m,spawn,osc-wiremix
bind = NONE,F10,spawn,bluetooth_toggle
bind = alt,F12,spawn,osc-mullvad toggle --with-blocky
bind = super+alt,F12,spawn,osc-mullvad slot --hold recycle

# Volume / brightness / mic — mshellctl sets the value and triggers the OSD.
# Volume / brightness / mic mute moved to mshellctl. `mshellctl audio` uses 5%
# steps (fixed in the command's help) and all trigger the bottom-centre OSD.
# The XF86Audio*/MonBrightness* keys come from the laptop keyboard.
bind = NONE,XF86AudioRaiseVolume,spawn,mshellctl audio volume-up
bind = NONE,XF86AudioLowerVolume,spawn,mshellctl audio volume-down
bind = NONE,XF86AudioMute,spawn,mshellctl audio mute
bind = NONE,XF86AudioMicMute,spawn,mshellctl audio mic-mute
bind = NONE,XF86MonBrightnessUp,spawn,mshellctl brightness up
bind = NONE,XF86MonBrightnessDown,spawn,mshellctl brightness down
bind = alt,a,spawn,mshellctl audio switch
