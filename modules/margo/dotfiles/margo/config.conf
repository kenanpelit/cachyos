# ── mpv: ana pencere + Picture-in-Picture popup ayrı kurallar ───────────────
# Rust regex'i `(?!...)` lookahead desteklemez → niri-stili `exclude_title`
# ile PiP'i ana mpv'den dışla.
windowrule = isfloating:1,width:640,height:360,offsetx:900,offsety:-400,appid:^mpv$,exclude_title:^(Picture-in-Picture|Picture-in-Picture - mpv|Picture in Picture)$
# PiP popup (mpv + browser PiP'leri): sabit boyut, scroller kolonu
# büyütemesin diye min/max ile pinli.
windowrule = isfloating:1,width:640,height:360,min_width:640,max_width:640,min_height:360,max_height:360,offsetx:95,offsety:-80,title:^(Picture-in-Picture|Picture-in-Picture - mpv|Picture in Picture)$,open_focused:1

# ── Hassas pencereler: blur kapalı, animasyon hafif, screencast'te maskeli ──
windowrule = isfloating:1,width:960,height:720,noblur:1,isnoanimation:1,appid:^(org\.keepassxc\.KeePassXC|KeePassXC|com\.bitwarden\.desktop|Bitwarden|com\.1password\.1Password|1Password|org\.gnome\.World\.Secrets|org\.gnome\.seahorse\.Application|seahorse)$
# Screencast'te password manager + clipboard manager + auth dialog'lar siyah
windowrule = block_out_from_screencast:1,appid:^(org\.keepassxc\.KeePassXC|KeePassXC|com\.bitwarden\.desktop|Bitwarden|com\.1password\.1Password|1Password|com\.github\.hluk\.copyq|copyq|clipse|io\.ente\.auth|org\.gnome\.World\.Secrets|seahorse|kwalletmanager|kwalletmanager5|gcr-prompter|pinentry.*|polkit-gnome-authentication-agent-1)$
# Browser private/incognito pencereler
windowrule = block_out_from_screencast:1,appid:^(firefox|librewolf|zen|brave-browser|brave|Chromium|chrome|microsoft-edge.*|helium.*)$,title:(?i)(private browsing|private window|incognito|inprivate)
# Şifre/auth dialog title'ları (yedek katman, appid yakalamıyorsa)
windowrule = block_out_from_screencast:1,title:(?i)(password|passphrase|authentication|unlock|secret|two-factor|verification code|one-time|otp)

# ── Oyun / remote-play: tearing açık, blur+shadow+anim kapalı ───────────────
windowrule = force_tearing:1,noblur:1,isnoshadow:1,isnoanimation:1,appid:^(gamescope|steam_app_.*|lutris|net\.lutris\.Lutris|com\.heroicgameslauncher\.hgl)$
windowrule = force_tearing:1,noblur:1,isnoshadow:1,isnoanimation:1,title:^(Counter-Strike 2|Dota 2|ELDEN RING|Cyberpunk 2077|No Man's Sky).*$

# ── Terminal swallowing ───────────────────────────────────────────────────────
windowrule = isterm:1,appid:^(kitty|Alacritty|com\.mitchellh\.ghostty|foot|TmuxKenp|dropdown-terminal|yazi-scratchpad|clipse|wiremix|mango-doctor)$
windowrule = noswallow:1,appid:^(mpv|org\.telegram\.desktop|ferdium|Ferdium|discord|WebCord|webcord|Signal|Slack)$

# ── Screenshot editor'leri (swappy/satty) ────────────────────────────────────
# isfloating:1 → floating, otomatik 60% work-area boyut, ortalı
# isoverlay:1  → düzenleme sırasında diğer tile'ların üstünde kalır
# open_focused:1 → spawn'da focus al
# noswallow:1  → terminal'den çağrılırsa swallow olmasın
#
# Önemli not: önce `is_floating=true` set edilip `float_geom` set edilmeden
# kalıyordu (b8af63d öncesi); arrange'da `if float_geom.width > 0` false
# döndüğü için pencere 0x0 boyutlandırılıyordu → invisible. b8af63d sonrası
# margo fallback olarak 60%-of-work-area default'una düşüyor. Bu rule artık
# güvenle floating + overlay açar.
windowrule = isfloating:1, isoverlay:1, open_focused:1, noswallow:1, appid:^(swappy|com\.gabm\.satty)$

# ╭───────────────────────────────────────────────────────────────────────────╮
# │ 8. Layer rules — namespace'e göre layer-surface tweak'leri                │
# ╰───────────────────────────────────────────────────────────────────────────╯
# Wallpaper / desktop background katmanları: animation YOK (slide-in
# yapamaz, ekran zaten dolduruyor). noctalia restart'ta hem
# `noctalia-wallpaper-<screen>` (Background.qml; Wallpaper layer)
# hem `noctalia-background-<screen>` (MainScreen.qml; panel root)
# açılıyor — ikisinde de open animation kapalı olsun ki
# wallpaper dosyası bir anda görünür hâlde commit'lensin.
layerrule = noanim:1,layer_name:^noctalia-(wallpaper|background)-.*
# Selection / screenshot UI: anlık geçiş, blur yok
layerrule = noanim:1,noblur:1,layer_name:^(selection|screenshot).*
# mshell'in kalıcı frame/spacer/root/wallpaper yüzeyleri compositor chrome;
# menü animasyonunu mshell içinde yapıyor, compositor layer animasyonu yok.
layerrule = noanim:1,noshadow:1,noblur:1,layer_name:^mshell-(frame|spacer|wallpaper|invisible-root)$
# GTK4 layer-shell default namespace; mshell'in bazı yüzeyleri namespace set
# edilmeden bu isimle geliyor. Compositor animasyonu flicker/repaint loop yapıyor.
layerrule = noanim:1,noshadow:1,noblur:1,layer_name:^gtk4-layer-shell$
# rofi/fuzzel/launcher: zoom-in ile pop, omni-direction his
layerrule = animation_type_open:zoom,animation_type_close:zoom,layer_name:^(rofi|fuzzel|launcher).*
# Control-center/dash/settings: yatay slide global default ile uyumlu
layerrule = animation_type_open:slide,animation_type_close:slide,layer_name:^(control-center|dash|session-menu|wallpaper|system-monitor|settings).*
layerrule = noshadow:1,layer_name:^(control-center|dash|session-menu|wallpaper|system-monitor).*
layerrule = noshadow:1,noblur:1,layer_name:^noctalia-fade-overlay$
# Notification/OSD/volume: anlık (kullanıcı bekleyeceği için fade'i ezer)
layerrule = noanim:1,noshadow:1,noblur:1,layer_name:^(notifications|toast|osd|volume|brightness|noctalia-(notifications|toast|osd|volume|brightness)|mshell-(notifications|toast|osd|volume|brightness)).*

