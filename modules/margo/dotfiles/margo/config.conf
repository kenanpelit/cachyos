# ╔═══════════════════════════════════════════════════════════════════════════╗
# ║ margo compositor — kenan@2026                                             ║
# ║ Location: ~/.config/margo/config.conf                                     ║
# ╚═══════════════════════════════════════════════════════════════════════════╝
#
# Syntax:
#   key = value
#   bind = MODIFIERS,key,action[,arg1[,arg2[,arg3]]]
#     MODIFIERS : super | ctrl | shift | alt   (combine: super+shift)
#     key       : xkbcommon name (Return, space, q, 1..9, F1..F12, …)
#     action    : spawn | reload_config | killclient | focusdir | view | tag |
#                 tagview | toggleview | tagtoleft/right | setlayout |
#                 switch_layout | togglefloating | togglefullscreen |
#                 movewin | resizewin | zoom | focusmon | tagmon |
#                 toggle_named_scratchpad | unscratchpad | toggleoverview |
#                 reload_config | force_unlock | quit | …
#     Run `mctl actions --verbose` → full action list + aliases.
#
# Reload: `mctl reload` or Super+Ctrl+R   (no need to log out)
# Validate: `mctl check-config` — detects duplicate binds, regex errors, unknown fields
#
# Contents:
#   1. Appearance (border, gap, colour, opacity)
#   2. Animation (horizontal tag direction + tag_carousel + layer slides)
#   3. Core behaviour (focus, drag, snap, scratchpad)
#   4. Keyboard & touchpad
#   5. Environment variables
#   6. Layout & per-tag home monitor
#   7. Window rules (tag pin + floating geom + screencast block-out)
#   8. Layer rules
#   9. Monitor definitions
#  10. Startup commands
#  11. Input bindings (mouse / touchpad gesture / scroll)
#  12. Twilight (blue-light filter)
#  13. Managed config fragments (mlayout / taglayouts / binds)
#
# Keyboard binds (`bind = …`) now live in binds.conf — edit them in
# Settings → Keybinds, or hand-edit that file. It's sourced at the bottom.

# ╭───────────────────────────────────────────────────────────────────────────╮
# │ 1. Appearance                                                             │
# ╰───────────────────────────────────────────────────────────────────────────╯
borderpx = 2
border_radius         = 12
no_border_when_single = 0
no_radius_when_single = 0

# Gaps (inner = between windows, outer = to the screen edge)
gappih  = 12
gappiv  = 12
gappoh  = 12
gappov  = 12
smartgaps = 1

# Opacity — focused window 100%, others 90% (the focus-oracle cross-fade
# smooths this via `animation_curve_focus`).
focused_opacity   = 0.80
unfocused_opacity = 0.50

cursor_size = 24

# Catppuccin Mocha palette — the values above are the fallback/startup defaults.
rootcolor       = 0x1e1e2eff
bordercolor     = 0x313244ff
focuscolor      = 0xcba6f7ff
urgentcolor     = 0xf38ba8ff
scratchpadcolor = 0x74c7ecff
globalcolor     = 0xb4befeff
overlaycolor    = 0x89b4faff
shadowscolor    = 0x11111b99

# Border colours follow the matugen (wallpaper) palette. On every palette
# change mshell regenerates colors.conf (focus/border/urgent/scratchpad/
# global/overlay/shadows) and runs `mctl reload`. This source sits BELOW the
# static block, so the generated colours override the ones above. rootcolor
# is not generated — the one above stays fixed. If the file is missing it is
# silently skipped (the static fallback stays in effect).
source = conf.d/colors.conf
# If an external colour generator is added, re-enable with `source = ~/.cache/...`.

# Plugin keybinds: mshell writes the binds configured in Settings → Plugins →
# Keybinds to this file and calls `mctl reload` whenever they change. Silently
# skipped if the file is missing (empty when there are no plugins).
source = binds.d/mshell-plugins.conf

# ── Dual-colour border ────────────────────────────────────────────────────────
# borderpx = 4 total: outer 2px + inner 2px concentric ring.
#
#   ┌─────────────────────┐  ← outer 2px (focuscolor / bordercolor)
#   │ ┌─────────────────┐ │
#   │ │  ┌───────────┐  │ │  ← inner 2px (_secondary)
#   │ │  │  window   │  │ │
#   │ │  └───────────┘  │ │
#   │ └─────────────────┘ │
#   └─────────────────────┘
#
# Mauve-coordinated Catppuccin Mocha palette — "soft purple depth":
#
#   * Idle: surface0 outer + mantle inner. Two dark tones, but mantle is one
#     step deeper; the dual tone is noticeable yet not distracting.
#   * Focused: mauve outer + lavender inner. Pastel-purple siblings; the thin
#     lavender beneath the mauve adds a soft depth while the main tone stays
#     mauve.
#   * Urgent: red outer + peach inner. A warm alarm accent — a peach band
#     glowing from inside the red.
# Disabled for now — single-colour border. `border_secondary_px = 0` drops the
# shader to single-band mode, and with the `*color_secondary` lines commented
# out the render is bit-identical (pre-feature). To re-enable: uncomment these
# four lines + set `border_secondary_px` to your liking.
#border_secondary_px   = 0
# bordercolor_secondary = 0x181825ff   # idle inner    — mantle
# focuscolor_secondary  = 0xb4befeff   # focused inner — lavender (mauve's sibling)
# urgentcolor_secondary = 0xfab387ff   # urgent inner  — peach

# Blur / shadow / layer-shadow toggles.
# SDF drop-shadow shipped in P5; tuning matches mango's values exactly
# (size=16, blur=24, offset_y=4 — deep but soft).
# Kawase blur now implemented (first cut, opt-in). Only shows where a window is
# actually translucent — pair with an opacity rule. If rendering looks mirrored
# vertically or stutters, set blur back to 0 (unverified-on-hardware Y-flip risk).
blur = 0
blur_layer = 0
blur_optimized = 0
# Blur gücü. num_passes=1 (default) neredeyse görünmez; Hyprland ~3 kullanır.
# Pencere %80 opaksa zaten sadece %20'si bulanık görünür → pass'i artır.
blur_params_num_passes = 3     # dual-Kawase pass sayısı (görünür blur için 3)
blur_params_radius = 3
# Pace each output by its own refresh (60Hz + 144Hz independent). First cut —
# set false if you see stutter or a stalled monitor.
per_output_frame_clock = true
shadows              = 1
shadow_only_floating = 1
layer_shadows        = 0
shadows_size         = 14
shadows_blur         = 26
shadows_position_x   = 0
shadows_position_y   = 4

# ── Tabbed window groups (super+w ile grupla) ───────────────────────────────
# Gruplanan pencerelerin üstünde ince bir SEKME ÇUBUĞU çizilir. Çubuk
# yüksekliği 0 ise (varsayılan) hiç görünmez — grup yine çalışır ama hangi
# pencerenin grupta olduğunu göremezsin. >0 yap ki çubuk çıksın.
# Çubuk metin İÇERMEZ (minimal): her gruplu pencere için bir renk kutucuğu,
# aktif olan group_active_color ile, diğerleri group_inactive_color ile.
group_bar_height     = 22
group_bar_gap        = 4
group_active_color   = 0xcba6f7ff   # mauve (focuscolor ile uyumlu)
group_inactive_color = 0x313244ff   # surface0 (bordercolor ile uyumlu)

# ╭───────────────────────────────────────────────────────────────────────────╮
# │ 2. Animation — horizontal tag direction + matching layer slides           │
# ╰───────────────────────────────────────────────────────────────────────────╯
# Margo P2 animation types: Move, Open, Close, Tag, Focus, Layer.
# Each type has its own `animation_clock_*` (bezier|spring) + `animation_curve_*`
# (4-point bezier) + `animation_duration_*` (ms).
#
# tag_animation_direction:
#   0 → tag transition slides HORIZONTALLY (mango/dwl default, this config's
#       choice — same axis as the scroller's horizontal paradigm, consistent
#       with the Super+1..9 compass, easier on the eyes)
#   1 → tag transition slides VERTICALLY (up/down)
tag_animation_direction = 0

# Carousel: when a relative tag move (viewtoleft/viewtoright) wraps past the
# first/last tag, the animation keeps going in the travel direction (tag 9 → 1
# slides right) — an endless-carousel feel instead of a long "rewind". Only
# affects the animation direction.
tag_carousel = 1

animations = 1
layer_animations = 1

# Window open/close: direction-agnostic zoom + fade. Stays the same even if the
# tag direction changes — a window's "own" transition is independent of tags.
animation_type_open = zoom
animation_type_close = fade
animation_fade_in = 1
animation_fade_out = 1

# Layer open/close: horizontal slide (mango default). Bar/launcher/dash enter
# from the right, exit to the right. The `slide` alias = slide_in_right /
# slide_out_right.
layer_animation_type_open = slide_in
layer_animation_type_close = slide_out

# Zoom ratios — mango's mature values. ~6% scale change: noticeable but not
# aggressive. (0.92 felt like a jump, 0.94 is more natural.)
zoom_initial_ratio = 0.92
zoom_end_ratio = 0.92

# Fade-in: start at 72% → the eye tracks where the window is going to land.
# Fade-out: start at full opacity, fade with ease-out-quad.
fadein_begin_opacity = 0.60
fadeout_begin_opacity = 1.00

# ── Niri-compatible animation profile ─────────────────────────────────────────
#
# Ported directly from ~/.config/niri/conf/50-animations.kdl:
#
#   niri animations {
#     window-movement      { spring damping=1.0 stiffness=750 ε=0.0001 }
#     window-resize        { spring damping=1.0 stiffness=850 ε=0.0001 }
#     window-open          { duration-ms=180  curve "ease-out-expo" }
#     window-close         { duration-ms=160  curve "ease-out-quad" }
#     workspace-switch     { spring damping=1.0 stiffness=700 ε=0.0001 }
#     horizontal-view-movement { spring damping=1.0 stiffness=750 ε=0.0001 }
#     overview-open-close  { spring damping=1.0 stiffness=850 ε=0.0001 }
#   }
#
# Niri gives each animation type its own stiffness; in margo the spring
# stiffness is GLOBAL. Niri's average ≈ 770 → we rounded to 800 (a combo of
# resize+overview at 850, move+view at 750, workspace at 700). Damping ratio
# and mass values are identical.

# Durations (ms) — niri's window-open/close values + margo's own:
#   move=220     spring cap; spring settle won't use it but it applies on the
#                bezier fallback
#   open=180     ease-out-expo (niri default)
#   close=160    ease-out-quad (niri default)
#   tag=200      sharp snap in the horizontal tag direction (ease-out-expo's
#                280ms cap drifted because of the initial soft ramp + parallel
#                window timing differences; a shortened duration +
#                material-standard curve makes windows slide at the same rhythm
#                as the scroller's horizontal column flow)
#   focus=120    snappy border+opacity cross-fade
#   canvas=300   PaperWM-style pan/zoom
animation_duration_move = 165
animation_duration_open = 175
animation_duration_close = 135
animation_duration_tag = 250
animation_duration_focus = 90
animation_duration_canvas_pan  = 300
animation_duration_canvas_zoom = 300

# Bezier curves — matching niri's curve names exactly:
#   ease-out-expo     : cubic-bezier(0.16, 1.00, 0.30, 1.00)  → soft start, hard snap-stop
#   ease-out-quad     : cubic-bezier(0.25, 0.46, 0.45, 0.94)  → smooth
#   ease-out-cubic    : cubic-bezier(0.33, 1.00, 0.68, 1.00)  → snappy
#   material-standard : cubic-bezier(0.40, 0.00, 0.20, 1.00)  → steep start +
#                       strong finish; one standard curve so the tag + move
#                       animations run in sync. Moves at an even speed from the
#                       start, preventing the soft ramp from looking like one
#                       window is running ahead.
# For animation types bound to the spring clock (move) the curve field is
# unused; it only kicks in when falling back to the bezier clock.
animation_curve_move = 0.16, 1.00, 0.30, 1.00
animation_curve_open = 0.16, 1.00, 0.30, 1.00
animation_curve_close = 0.25, 0.46, 0.45, 0.94
# Tag = material-standard. It wasn't ease-out-expo because parallel windows
# started at different visual speeds on the soft ramp; material-standard gives
# a flat start → all windows slide left/right in sync, as sharp as the
# scroller's column flow.
animation_curve_tag = 0.16, 1.00, 0.30, 1.00
animation_curve_focus = 0.25, 1.00, 0.50, 1.00
animation_curve_opafadein   = 0.16,1.00,0.30,1.00
animation_curve_opafadeout  = 0.50,0.50,0.50,0.50
animation_curve_canvas_pan  = 0.16,1.00,0.30,1.00
animation_curve_canvas_zoom = 0.16,1.00,0.30,1.00

# ── Which animation types use the spring clock? ───────────────────────────────
# Mirrors niri's default exactly:
#   * Move    = spring   (window-movement = spring)
#   * Tag     = spring   (workspace-switch = spring)
#   * Open    = bezier   (window-open = curve "ease-out-expo")
#   * Close   = bezier   (window-close = curve "ease-out-quad")
#   * Focus   = bezier   (none in niri; mango pattern, snappy feel)
#   * Layer   = bezier   (no standalone in niri; natural for bar/notification)
#
# Move = bezier (in sync with Tag). It was spring, but on a tag transition Tag
# (bezier) + Move (spring) ran with two different curves and durations, so the
# window-position transition didn't finish at the same rhythm as the tag slide
# — the eye perceived the spring path as a separate motion.
# Same curve + same duration → all motion finishes in one composed rhythm.
# The mid-flight retarget velocity preservation (spring's one advantage) is lost
# on clients that constantly trigger arrange, but the cleanliness of the tag
# transition outweighed it.
animation_clock_move = spring
animation_clock_open = bezier
animation_clock_close = bezier
# Tag pulled to bezier — in margo each window slides separately (not a single
# block scene like niri), so spring overshoot caused multiple parallel wobbles.
# Bezier gives a clean snap-stop, predictable.
animation_clock_tag = bezier
animation_clock_focus = bezier
animation_clock_layer = bezier

# Spring tuning — niri's average (move 750, resize 850, ws 700, view 750).
# A single global slot → 800 average; pull to 750 for a softer move-tag, or
# 850 for snappier.
animation_spring_stiffness = 650.0
animation_spring_damping_ratio = 1.0
animation_spring_mass = 1.0

# ╭───────────────────────────────────────────────────────────────────────────╮
# │ 3. Core behaviour                                                         │
# ╰───────────────────────────────────────────────────────────────────────────╯
focus_on_activate          = 1   # jump to a window when an xdg_activation token arrives
focus_cross_monitor        = 0   # don't let focusdir cross the monitor edge
exchange_cross_monitor     = 0
focus_cross_tag            = 0
view_current_to_back       = 1   # super+N on the same tag → return to previous tag (dwm)
sloppyfocus                = 1   # window under the cursor is focused automatically
warpcursor                 = 0   # warp the cursor to the window on focus change
                                 # (setting this to 1 together with sloppyfocus=1
                                 # causes a ping-pong loop: warp → sloppyfocus
                                 # trigger → new focus → warp → … flickers in the
                                 # bar in 5-9 s bursts)
# cursor hides after 3 s of inactivity
cursor_hide_timeout        = 3
# no flicker after resize on XWayland surfaces
xwayland_persistence       = 1

# Hidden-tag startup warm-up: keep newly mapped background-tag windows
# receiving frame callbacks for this many ms. Electron/CEF apps launched
# at login (Spotify, Webcord, Ferdium, Discord, etc.) finish rendering
# without having to visit their tag first. Raise to 30000 if login is heavy;
# set 0 to restore strict visible-window-only frame callbacks.
warmup_hidden_ms          = 20000

# Drag-to-rearrange (move windows with the mouse)
drag_tile_to_tile              = 1
# 0=top-left 1=top-right 2=bottom-left 3=bottom-right 4=automatic
drag_corner                    = 4
drag_warp_cursor               = 1
drag_tile_refresh_interval     = 8.0
drag_floating_refresh_interval = 8.0

# Floating snapping
enable_floating_snap = 1
snap_distance        = 30

# Hot corner / overview
enable_hotarea = 1
hotarea_size   = 10
# 0=top-left 1=top-right 2=bottom-left 3=bottom-right
hotarea_corner = 3
ov_tab_mode    = 0
overviewgappi  = 12
overviewgappo  = 60

# Scroll / axis
axis_bind_apply_timeout = 100
axis_scroll_factor      = 1.25

# Sync / tearing
# explicit-sync — set to 1 for DXVK/Vulkan
syncobj_enable          = 0
# 2 = allow tearing for windows with the force_tearing rule, others vsync
allow_tearing           = 2
allow_shortcuts_inhibit = 1
idleinhibit_ignore_visible = 0

# Scratchpad behaviour
# scratchpad follows when the cursor changes monitor
scratchpad_cross_monitor = 1
# auto-hide the others when one scratchpad is open
single_scratchpad        = 1

# ╭───────────────────────────────────────────────────────────────────────────╮
# │ 4. Keyboard & Input                                                       │
# ╰───────────────────────────────────────────────────────────────────────────╯
xkb_rules_layout = tr
xkb_rules_variant = f
# CapsLock → Ctrl (xkb options)
xkb_rules_options = ctrl:nocaps
repeat_rate       = 35
repeat_delay      = 250
numlockon         = 0

# Touchpad
tap_to_click = 1
tap_and_drag               = 1
drag_lock                  = 1
trackpad_natural_scrolling = 0
disable_while_typing = 1
left_handed                = 0
middle_button_emulation    = 1
# 2 = clickfinger, 1 = button-areas
click_method               = 2
# 1 = 2-finger, 2 = edge, 3 = on-button
scroll_method              = 1
scroll_button              = 274
send_events_mode           = 0
button_map                 = 0

# Mouse
mouse_natural_scrolling = 0
# 0 = none, 1 = adaptive, 2 = flat
accel_profile           = 2
accel_speed             = 1.00
# 3+finger swipe min distance (px). 30 = mango/niri default — a deliberate
# intent threshold. Want it more sensitive (small touchpad / short flicks): 15-20.
swipe_min_threshold     = 30

# ╭───────────────────────────────────────────────────────────────────────────╮
# │ 5. Environment variables                                                  │
# ╰───────────────────────────────────────────────────────────────────────────╯
env = XDG_CURRENT_DESKTOP,margo
env = XDG_SESSION_DESKTOP,margo
env = XDG_SESSION_TYPE,wayland
env = GDK_BACKEND,wayland,x11
env = QT_QPA_PLATFORM,wayland;xcb
env = SDL_VIDEODRIVER,wayland
env = CLUTTER_BACKEND,wayland

# ╭───────────────────────────────────────────────────────────────────────────╮
# │ 6. Layout & per-tag home monitor                                          │
# ╰───────────────────────────────────────────────────────────────────────────╯
# Layout types: tile | scroller | grid | monocle | deck | center_tile |
#                 right_tile | vertical_scroller | vertical_tile |
#                 vertical_grid | vertical_deck | tgmix | canvas | dwindle
default_layout            = scroller
default_mfact             = 0.55
default_nmaster           = 1
new_is_master             = 0
center_master_overspread  = 0
center_when_single_stack  = 1
canvas_tiling             = 0
canvas_tiling_gap         = 10
canvas_pan_on_kill        = 1
canvas_anchor_animate     = 0
circle_layout             = tile,scroller,grid,monocle,deck,center_tile,right_tile,tgmix,canvas,dwindle

# Scroller-specific (PaperWM-style horizontal scroll)
scroller_structs                  = 24
scroller_default_proportion        = 0.850
scroller_default_proportion_single = 0.850
scroller_ignore_proportion_single  = 0
scroller_focus_center              = 1
scroller_prefer_center             = 1
scroller_prefer_overspread         = 0
edge_scroller_pointer_focus        = 1
# Focus the neighbouring column when the pointer arrives slowly at the edge
# (speed threshold; triggers while the per-event pointer magnitude is below
# this value). 0 = off.
edge_scroller_focus_allow_speed    = 40
scroller_proportion_preset         = 1.000,0.850,0.700,0.500

# Scroller overview (toggle_scroller_overview): shows every column in a
# shrunk strip. zoom = scale, gap = column spacing, loop = wrap end to end.
overview_style = scroller
scroller_overview_zoom  = 0.30
scroller_overview_gap   = 20
scroller_overview_loop  = 1

# Per-tag home monitor — `view_tag(N)` auto-warps to that screen when you're on
# a different monitor; `windowrule = tags:N, …` takes the tag's home as its
# monitor (so you don't have to write `monitor:` as well).
#   DP-3  : 1-6 → Kenp / Term / AI / Work / Chat / Media
#   eDP-1 : 7-9 → Utility / Music / Social
tagrule = id:1,monitor_name:DP-3
tagrule = id:2,monitor_name:DP-3
tagrule = id:3,monitor_name:DP-3
tagrule = id:4,monitor_name:DP-3
tagrule = id:5,monitor_name:DP-3
tagrule = id:6,monitor_name:DP-3
tagrule = id:7,monitor_name:eDP-1
tagrule = id:8,monitor_name:eDP-1
tagrule = id:9,monitor_name:eDP-1

# Per-tag wallpapers are managed by mshell (Settings → Wallpaper); the
# `mshellctl menu wallpaper` + `mshellctl wallpaper next` binds are in Section 11.

# ╭───────────────────────────────────────────────────────────────────────────╮
# │ 7. Window rules                                                           │
# ╰───────────────────────────────────────────────────────────────────────────╯
# Anchored regexes (^…$) are recommended — a partial match can accidentally
# catch another window. Debug which rule matched with `mctl rules --appid X
# --title Y`. Catch regex errors with `mctl check-config`.

# ── Tag-pinned applications ───────────────────────────────────────────────────
# `monitor:` comes automatically from the tagrule — `tags:N` is enough.
windowrule = tags:1,appid:^(Kenp|kenp|block|Block)$
windowrule = tags:2,appid:^(TmuxKenp|kitty)$,title:^Tmux$
windowrule = tags:3,appid:^(Ai|ai|Nil|nil)$
windowrule = tags:4,appid:^(CompecTA|Compecta|compecta)$
windowrule = tags:5,appid:^(discord|WebCord|webcord|audacious)$
# WebCord/Electron set app_id="electron" by default on Wayland —
# the rule above misses it. Match the WebCord title pattern to
# pin it to tag 5 anyway. Discord proper does the same; covered
# here too for the same reason.
windowrule = tags:5,appid:^electron$,title:WebCord
windowrule = tags:5,appid:^webcord$,title:WebCord
windowrule = tags:5,appid:^(electron|Electron)$,title:Discord
windowrule = tags:6,appid:^(Exclude|exclude|Proxy|org\.telegram\.desktop|vlc|remote-viewer|org\.keepassxc\.KeePassXC)$
windowrule = tags:7,appid:^(Youtube|transmission|(brave-youtube|chrome-youtube)\.com__-Default)$
windowrule = tags:8,appid:^(spotify|Spotify|com\.spotify\.Client)$
windowrule = tags:9,appid:^(ferdium|Ferdium|com\.rtosta\.zapzap|(Whats|whats|chrome-web\.whatsapp\.com__-Default))$

# ── Browser / editor / terminal scroller proportions ──────────────────────────
windowrule = scroller_proportion:0.85,scroller_proportion_single:0.9,appid:^(brave-browser|chrome|firefox|librewolf|Chromium)$
windowrule = scroller_proportion:0.85,appid:^(kitty|Alacritty|foot|com\.mitchellh\.ghostty|TmuxKenp|dropdown-terminal|yazi-scratchpad|clipse|clipse-gui)$
windowrule = scroller_proportion:0.8,appid:^(Code|vscodium|neovide)$
# Brave tag-pinned profiles (kenp / ai / nil / compecta) sit at 0.85 — same as
# the scroller default now, kept explicit so the browser width is one obvious knob.
# App-ids are lowercase since the Brave migration; capitalized forms kept for safety.
# Discord (native app_id "discord", formerly WebCord) keeps 0.95 when alone on the tag.
windowrule = scroller_proportion:0.85,scroller_proportion_single:0.85,appid:^(kenp|Kenp|ai|Ai|nil|Nil|compecta|Compecta|CompecTA|block|Block)$
windowrule = scroller_proportion:0.85,scroller_proportion_single:0.95,appid:^(discord|WebCord|webcord)$
# Steam main UI: tearing off; games (steam_app_*) get their own rule below.
windowrule = exclude_appid:^steam_app_.*$,appid:^(steam|com\.valvesoftware\.Steam)$,scroller_proportion:0.85

# ── Floating dialog / utility windows ─────────────────────────────────────────
windowrule = isfloating:1,width:960,height:720,appid:^(xdg-desktop-portal-(gtk|gnome|wlr))$
windowrule = isfloating:1,width:600,height:240,appid:^(polkit-gnome-authentication-agent-1|pinentry.*)$
windowrule = isfloating:1,width:820,height:200,appid:^(gcr-prompter)$
windowrule = isfloating:1,width:640,height:260,title:^(Authentication Required|Unlock Keyring|OpenSSH Authentication Passphrase)$
windowrule = isfloating:1,width:960,height:720,title:^(Open File|Choose (File|Folder)|Save As|Confirm to replace files|File Operation Progress|Extract archive|Compress\.\.\.)$
windowrule = isfloating:1,width:900,height:650,appid:^(blueman-manager|nm-connection-editor|org\.gnome\.Settings|gnome-disks|virt-manager)$
windowrule = isfloating:1,width:360,height:440,appid:^nm-applet$
windowrule = isfloating:1,width:960,height:720,appid:^(org\.gnome\.FileRoller|file-roller)$
windowrule = isfloating:1,width:540,height:640,appid:^(org\.gnome\.Calculator|kcalc|qalculate-gtk|org\.gnome\.Characters)$
windowrule = isfloating:1,width:700,height:450,title:^Volume Control$
windowrule = isfloating:1,width:960,height:720,appid:^(anote|org\.quickshell)$
windowrule = isfloating:1,width:600,height:1080,offsetx:900,offsety:-15,appid:^(com\.github\.hluk\.copyq|copyq|wiremix|org\.pulseaudio\.pavucontrol|io\.ente\.auth|Mullvad VPN|io\.bassi\.Amberol)$
windowrule = isfloating:1,width:600,height:640,offsetx:1200,offsety:-15,appid:^(Mullvad VPN)$
# VNC viewer (TigerVNC): float at a fixed size so tiling never resizes it. A
# tiled resize retriggers TigerVNC's RemoteResize on every refocus, which
# desyncs the pointer mapping (cursor offset, right-click menu lands to the
# left). Floating keeps the window size stable → mapping stays 1:1.
windowrule = tags:6,isfloating:1,width:1920,height:1080,appid:^(Vncviewer|vncviewer)$

# ── Named scratchpads (toggled with a bind, start hidden) ─────────────────────
windowrule = isnamedscratchpad:1,width:1980,height:660,offsetx:0,offsety:-100,appid:^dropdown-terminal$
windowrule = isnamedscratchpad:1,width:1600,height:900,offsetx:0,offsety:0,appid:^yazi-scratchpad$
windowrule = isnamedscratchpad:1,width:760,height:960,offsetx:92,offsety:-8,appid:^clipse$
windowrule = isnamedscratchpad:1,width:760,height:960,offsetx:92,offsety:-8,appid:^clipse-gui$
windowrule = isnamedscratchpad:1,width:900,height:760,offsetx:92,offsety:-10,appid:^wiremix$

# ── mpv: separate rules for the main window + the Picture-in-Picture popup ───
# Rust regex doesn't support `(?!...)` lookahead → use niri-style `exclude_title`
# to exclude the PiP from the main mpv rule.
windowrule = isfloating:1,width:640,height:360,offsetx:900,offsety:-400,appid:^mpv$,exclude_title:^(Picture-in-Picture|Picture-in-Picture - mpv|Picture in Picture)$
# PiP popup (mpv + browser PiP): fixed size, pinned with min/max so the scroller
# column can't grow it.
windowrule = isfloating:1,width:640,height:360,min_width:640,max_width:640,min_height:360,max_height:360,offsetx:95,offsety:-80,title:^(Picture-in-Picture|Picture-in-Picture - mpv|Picture in Picture)$,open_focused:1

# ── Sensitive windows: blur off, light animation, masked in screencast ───────
# KeePassXC tiles normally on tag 6 (rule in the tag-pin block) but keeps the
# sensitive-window treatment: no blur, no animation, masked in screencast.
windowrule = noblur:1,isnoanimation:1,appid:^(org\.keepassxc\.KeePassXC|KeePassXC)$
windowrule = isfloating:1,width:960,height:720,noblur:1,isnoanimation:1,appid:^(com\.bitwarden\.desktop|Bitwarden|com\.1password\.1Password|1Password|org\.gnome\.World\.Secrets|org\.gnome\.seahorse\.Application|seahorse)$
# Black out password managers + clipboard managers + auth dialogs in screencast
windowrule = block_out_from_screencast:1,appid:^(org\.keepassxc\.KeePassXC|KeePassXC|com\.bitwarden\.desktop|Bitwarden|com\.1password\.1Password|1Password|com\.github\.hluk\.copyq|copyq|clipse|clipse-gui|io\.ente\.auth|org\.gnome\.World\.Secrets|seahorse|kwalletmanager|kwalletmanager5|pinentry.*|polkit-gnome-authentication-agent-1)$
# Browser private/incognito windows
windowrule = block_out_from_screencast:1,appid:^(firefox|librewolf|brave-browser|brave|Chromium|chrome|microsoft-edge.*|helium.*)$,title:(?i)(private browsing|private window|incognito|inprivate)
# Password/auth dialog titles (backup layer, when appid doesn't catch them)
windowrule = block_out_from_screencast:1,title:(?i)(password|passphrase|authentication|unlock|secret|two-factor|verification code|one-time|otp)

# ── Games / remote-play: tearing on, blur+shadow+anim off ────────────────────
windowrule = force_tearing:1,noblur:1,isnoshadow:1,isnoanimation:1,appid:^(gamescope|steam_app_.*|lutris|net\.lutris\.Lutris|com\.heroicgameslauncher\.hgl)$
windowrule = force_tearing:1,noblur:1,isnoshadow:1,isnoanimation:1,title:^(Counter-Strike 2|Dota 2|ELDEN RING|Cyberpunk 2077|No Man's Sky).*$

# ── Terminal swallowing ───────────────────────────────────────────────────────
windowrule = isterm:1,appid:^(kitty|Alacritty|com\.mitchellh\.ghostty|foot|TmuxKenp|dropdown-terminal|yazi-scratchpad|clipse|clipse-gui|wiremix|mango-doctor)$
windowrule = noswallow:1,appid:^(mpv|org\.telegram\.desktop|ferdium|Ferdium|discord|WebCord|webcord|Signal|Slack)$

# ── Screenshot editors (swappy/satty) ─────────────────────────────────────────
# isfloating:1 → floating, automatic 60% work-area size, centred
# isoverlay:1  → stays above the other tiles while editing
# open_focused:1 → take focus on spawn
# noswallow:1  → don't get swallowed when invoked from a terminal
#
# Important note: previously `is_floating=true` was set without `float_geom`
# (pre-b8af63d); arrange saw `if float_geom.width > 0` return false so the
# window was sized 0x0 → invisible. Since b8af63d margo falls back to the
# 60%-of-work-area default. This rule now safely opens floating + overlay.
windowrule = isfloating:1, isoverlay:1, open_focused:1, noswallow:1, appid:^(swappy|com\.gabm\.satty)$

# ╭───────────────────────────────────────────────────────────────────────────╮
# │ 8. Layer rules — per-namespace layer-surface tweaks                       │
# ╰───────────────────────────────────────────────────────────────────────────╯
# Wallpaper / desktop background layers: NO animation (can't slide in, they
# already fill the screen). On a noctalia restart both
# `noctalia-wallpaper-<screen>` (Background.qml; Wallpaper layer) and
# `noctalia-background-<screen>` (MainScreen.qml; panel root) open — keep the
# open animation off on both so the wallpaper file commits visible at once.
layerrule = noanim:1,layer_name:^noctalia-(wallpaper|background)-.*
# Selection / screenshot UI: instant transition, no blur
layerrule = noanim:1,noblur:1,layer_name:^(selection|screenshot).*
# mshell's persistent frame/spacer/root/wallpaper surfaces are compositor
# chrome; the menu animation happens inside mshell, no compositor layer anim.
layerrule = noanim:1,noshadow:1,noblur:1,layer_name:^mshell-(frame|spacer|wallpaper|invisible-root)$
# GTK4 layer-shell default namespace; some of mshell's surfaces arrive under
# this name before a namespace is set. A compositor animation causes a
# flicker/repaint loop.
layerrule = noanim:1,noshadow:1,noblur:1,layer_name:^gtk4-layer-shell$
# rofi/fuzzel/launcher: pop with a zoom-in, omni-directional feel
layerrule = animation_type_open:zoom,animation_type_close:zoom,layer_name:^(rofi|fuzzel|launcher).*
# Control-center/dash/settings: horizontal slide, matches the global default
layerrule = animation_type_open:slide,animation_type_close:slide,layer_name:^(control-center|dash|session-menu|wallpaper|system-monitor|settings).*
layerrule = noshadow:1,layer_name:^(control-center|dash|session-menu|wallpaper|system-monitor).*
layerrule = noshadow:1,noblur:1,layer_name:^noctalia-fade-overlay$
# Notification/OSD/volume: instant (overrides the fade since the user is waiting)
layerrule = noanim:1,noshadow:1,noblur:1,layer_name:^(notifications|toast|osd|volume|brightness|noctalia-(notifications|toast|osd|volume|brightness)|mshell-(notifications|toast|osd|volume|brightness)).*

# ╭───────────────────────────────────────────────────────────────────────────╮
# │ 9. Monitor definitions                                                    │
# ╰───────────────────────────────────────────────────────────────────────────╯
#monitorrule = name:DP-3,width:2560,height:1440,refresh:59,x:0,y:0,scale:1
#monitorrule = name:eDP-1,width:1920,height:1200,refresh:60,x:320,y:1440,scale:1

# ╭───────────────────────────────────────────────────────────────────────────╮
# │ 10. Startup commands                                                      │
# ╰───────────────────────────────────────────────────────────────────────────╯
# The shell (bar / notifications / OSD / launcher / dashboard / settings) =
# first-party mshell, managed by systemd --user (bound to margo-session.target)
# — so exec-once isn't needed:
#   systemctl --user status mshell.service
# Manual alternatives (if the service is off):
#exec-once = mshell
#exec-once = swaybg -i ~/wallpaper.jpg

# ╔═══════════════════════════════════════════════════════════════════════════╗
# ║ 11. Input bindings (mouse · touchpad gesture · scroll)                    ║
# ╚═══════════════════════════════════════════════════════════════════════════╝
# Keyboard binds (`bind = …`) live in binds.conf — managed by Settings →
# Keybinds and sourced at the bottom of this file. Only the non-keyboard
# bindings stay here.

# Mouse drag (mango/Hyprland pattern): super+LMB move, super+RMB resize.
mousebind = super,lmb,moveresize,curmove
mousebind = super,rmb,moveresize,curresize

# ── Overview (MangoWM-style zoom-out grid) ──────────────────────────────────
# overview_zoom 1.0 = full work area; 0.85-0.9 leaves breathing room.
# overviewgappi/gappo (Section 3) tune the overview's own gaps.
overview_transition_ms = 180
overview_zoom = 1.00
# Selected-thumbnail border multiplier + unselected dim (spotlight feel).
overview_selected_border_multiplier = 1.6
overview_dim_alpha                  = 0.7
# Alt+Tab cycle order: mru | tag | mixed.
overview_cycle_order = mru
# Hot corner (corner picked by hotarea_corner, Section 3) toggles overview.
hot_corner_top_left = 
hot_corner_dwell_ms    = 100

# ── Touchpad gestures (Niri/Mango-style) ────────────────────────────────────
# 3-finger horizontal → focus left/right; vertical → browser tab cycle (native
# `sendkey`, app-gated) else window focus. 4-finger horizontal → tag nav;
# vertical → overview. 4-finger up-diagonal → roam between monitors;
# down-left diagonal → view tag 1.
gesturebind = NONE,left,3,focusdir,left
gesturebind = NONE,right,3,focusdir,right
gesturebind = NONE,up,3,sendkey,ctrl+shift+Tab,^(kenp|Kenp|ai|Ai|nil|Nil|compecta|Compecta|CompecTA|block|Block|discord|webcord|WebCord|brave.*|.*chrome.*|Chromium|firefox.*|Firefox.*|librewolf|helium.*)$,focusdir:up
gesturebind = NONE,down,3,sendkey,ctrl+Tab,^(kenp|Kenp|ai|Ai|nil|Nil|compecta|Compecta|CompecTA|block|Block|discord|webcord|WebCord|brave.*|.*chrome.*|Chromium|firefox.*|Firefox.*|librewolf|helium.*)$,focusdir:down
gesturebind = NONE,left,4,viewtoleft
gesturebind = NONE,right,4,viewtoright
gesturebind = NONE,up,4,toggle_overview
gesturebind = NONE,down,4,toggle_overview
gesturebind = NONE,up_left,4,focusmon,left
gesturebind = NONE,up_right,4,focusmon,right
gesturebind = NONE,down_left,4,view,1

# Super + 3-finger swipe → focus_window_or_workspace (same as super+alt+hjkl):
# focus the window that way, or jump to the nearest occupied tag if there's
# none, falling back to blind next/prev tag if nothing's occupied either way.
gesturebind = super,left,3,focus_window_or_workspace,left
gesturebind = super,right,3,focus_window_or_workspace,right
gesturebind = super,up,3,focus_window_or_workspace,up
gesturebind = super,down,3,focus_window_or_workspace,down

# Super + scroll wheel → roam between scroller columns.
axisbind = super,UP,focusdir,left
axisbind = super,DOWN,focusdir,right

# ╭───────────────────────────────────────────────────────────────────────────╮
# │ 12. Twilight (built-in blue-light filter)                                 │
# ╰───────────────────────────────────────────────────────────────────────────╯
# Colour-temperature scheduler (replaces sunsetr/gammastep/redshift). Live
# control: `mctl twilight status|preview|set|reset`. Disable any external
# client first: `systemctl --user disable --now sunsetr sunsetr-scheduler`.
twilight = 1
twilight_mode = schedule  # geo | manual | static | schedule
twilight_day_temp = 3000  # Kelvin
twilight_night_temp = 2500  # Kelvin
twilight_day_gamma = 97  # %
twilight_night_gamma = 92  # %
twilight_transition_s     = 2700       # 45 min total transition window
twilight_update_interval  = 60         # idle tick seconds
# Geo mode — Istanbul.
twilight_latitude         = 41.008
twilight_longitude        = 28.978
# Static mode (twilight_mode = static).
twilight_static_temp      = 4000
twilight_static_gamma     = 95

# ╭───────────────────────────────────────────────────────────────────────────╮
# │ 13. Managed config fragments (machine-generated — don't hand-edit)        │
# ╰───────────────────────────────────────────────────────────────────────────╯
# mlayout: per-tag tiling snapshots (mlayout CLI). taglayouts: Settings →
# Tiling Layout. binds.conf: keyboard binds (Settings → Keybinds).
source = conf.d/mlayout.conf
source = conf.d/taglayouts.conf
source = binds.conf
overview_backdrop_color = 0x241f31ff
overview_backdrop_image =
mru_thumb_height = 400
monly = 0
mru_max = 8
hot_corner_top_right = 

# Game Mode effect overrides (managed by mshell).
source = conf.d/gamemode.conf
