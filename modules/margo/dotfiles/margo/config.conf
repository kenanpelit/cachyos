# ╔═══════════════════════════════════════════════════════════════════════════╗
# ║ margo compositor — kenan@2026                                             ║
# ║ Konum: ~/.config/margo/config.conf                                        ║
# ╚═══════════════════════════════════════════════════════════════════════════╝
#
# Syntax:
#   key = value
#   bind = MODIFIERS,key,action[,arg1[,arg2[,arg3]]]
#     MODIFIERS : super | ctrl | shift | alt   (birleştir: super+shift)
#     key       : xkbcommon adı (Return, space, q, 1..9, F1..F12, …)
#     action    : spawn | reload_config | killclient | focusdir | view | tag |
#                 tagview | toggleview | tagtoleft/right | setlayout |
#                 switch_layout | togglefloating | togglefullscreen |
#                 movewin | resizewin | zoom | focusmon | tagmon |
#                 toggle_named_scratchpad | unscratchpad | toggleoverview |
#                 reload_config | force_unlock | quit | …
#     `mctl actions --verbose` çalıştır → tüm aksiyonların listesi + alias'lar.
#
# Reload: `mctl reload` veya Super+Ctrl+R   (oturumu kapatmaya gerek yok)
# Validate: `mctl check-config` — duplicate bind, regex hata, unknown field tespiti
#
# İçerik:
#   1. Görünüm (border, gap, renk, opacity)
#   2. Animasyon (yatay tag yönü + layer slide'ları)
#   3. Çekirdek davranış (focus, drag, snap, scratchpad)
#   4. Klavye & touchpad
#   5. Ortam değişkenleri
#   6. Layout & per-tag home monitor
#   7. Window rules (tag pin + floating geom + screencast block-out)
#   8. Layer rules
#   9. Monitör tanımları
#  10. Başlangıç komutları
#  11. Keybind'ler

# ╭───────────────────────────────────────────────────────────────────────────╮
# │ 1. Görünüm                                                                │
# ╰───────────────────────────────────────────────────────────────────────────╯
borderpx              = 1
border_radius         = 12
no_border_when_single = 0
no_radius_when_single = 0

# Gaps (inner = pencereler arası, outer = ekran kenarına)
gappih  = 12
gappiv  = 12
gappoh  = 12
gappov  = 12
smartgaps = 0

# Opacity — odaklı pencere %100, diğerleri %90 (focus oracle cross-fade'i
# `animation_curve_focus` ile bunu yumuşatır)
focused_opacity   = 1.00
unfocused_opacity = 0.90

cursor_size = 24

# Catppuccin Mocha paleti — yukarıdakiler fallback/başlangıç değerleri.
rootcolor       = 0x1e1e2eff
bordercolor     = 0x313244ff
focuscolor      = 0xcba6f7ff
urgentcolor     = 0xf38ba8ff
scratchpadcolor = 0x74c7ecff
globalcolor     = 0xb4befeff
overlaycolor    = 0x89b4faff
shadowscolor    = 0x11111b99

# Border renkleri matugen (wallpaper) paletini takip eder. mshell her
# palet değişiminde colors.conf'u üretir (focus/border/urgent/scratchpad/
# global/overlay/shadows) ve `mctl reload` çalıştırır. Bu source statik
# bloğun ALTINDA olduğu için üretilen renkler yukarıdakileri ezer.
# rootcolor üretilmez — yukarıdaki sabit kalır. Dosya yoksa sessizce
# atlanır (statik fallback devrede kalır).
source = conf.d/colors.conf
# Harici bir renk üretici eklenirse `source = ~/.cache/...` ile geri açılabilir.

# Plugin keybind'leri: mshell, Settings → Plugins → Keybinds'te ayarlanan
# bind'leri bu dosyaya üretir ve değiştikçe `mctl reload` çağırır. Dosya
# yoksa sessizce atlanır (plugin yoksa boş kalır).
source = binds.d/mshell-plugins.conf

# ── Çift renk border (dual-color) ────────────────────────────────────────────
# borderpx = 4 toplam: outer 2px + inner 2px concentric ring.
#
#   ┌─────────────────────┐  ← outer 2px (focuscolor / bordercolor)
#   │ ┌─────────────────┐ │
#   │ │  ┌───────────┐  │ │  ← inner 2px (_secondary)
#   │ │  │  pencere  │  │ │
#   │ │  └───────────┘  │ │
#   │ └─────────────────┘ │
#   └─────────────────────┘
#
# Mauve-uyumlu Catppuccin Mocha paleti — "soft purple depth":
#
#   * Idle: surface0 outer + mantle inner. Iki koyu ton, ama mantle bir
#     adım daha derin; dual-tone fark hissedilir, dikkat dağıtmaz.
#   * Focused: mauve outer + lavender inner. Pastel mor kardeşler;
#     mauve'un altında ince lavanta gölgesi yumuşak bir derinlik verir,
#     ana ton hâlâ mauve.
#   * Urgent: red outer + peach inner. Sıcak alarm vurgusu — kırmızının
#     içinden parlayan peach şerit.
# Şimdilik kapalı — single-color border. `border_secondary_px = 0` shader'ı
# tek-band moduna düşürüyor ve `*color_secondary` satırları yorumda olunca
# render bit-identical (pre-feature) oluyor. Tekrar açmak için: bu dört
# satırı uncomment et + `border_secondary_px` istediğin değere getir.
#border_secondary_px   = 0
# bordercolor_secondary = 0x181825ff   # idle inner    — mantle
# focuscolor_secondary  = 0xb4befeff   # focused inner — lavender (mauve'un kardeşi)
# urgentcolor_secondary = 0xfab387ff   # urgent inner  — peach

# Blur / shadow / layer-shadow toggleları.
# SDF drop-shadow P5'te shipped; mango'nun değerleriyle birebir
# aynı tuning (size=16, blur=24, offset_y=4 — derin ama yumuşak).
# Blur henüz Kawase implementation yok → kapalı.
blur                 = 0
blur_layer           = 0
blur_optimized       = 1
shadows              = 1
shadow_only_floating = 1
layer_shadows        = 0
shadows_size         = 14
shadows_blur         = 26
shadows_position_x   = 0
shadows_position_y   = 4

# ╭───────────────────────────────────────────────────────────────────────────╮
# │ 2. Animasyon — yatay tag yönü + uyumlu layer slide'ları                   │
# ╰───────────────────────────────────────────────────────────────────────────╯
# Margo P2 animasyon tipleri: Move, Open, Close, Tag, Focus, Layer.
# Her tip için ayrı `animation_clock_*` (bezier|spring) + `animation_curve_*`
# (4-noktalı bezier) + `animation_duration_*` (ms).
#
# tag_animation_direction:
#   0 → tag geçişi YATAY kayar (mango/dwl varsayılanı, bu config'in seçimi —
#       scroller'ın yatay paradigmasıyla aynı eksen, Super+1..9 ile pusulada
#       uyumlu, göz fizyolojisine daha az yorucu)
#   1 → tag geçişi DİKEY kayar (yukarı-aşağı)
tag_animation_direction = 0

animations = 1
layer_animations = 1

# Pencere açılış/kapanış: yön-bağımsız zoom + fade. Tag yönü değişse de
# bu his aynı kalır — pencerenin "kendi" geçişi taglerden bağımsız.
animation_type_open = zoom
animation_type_close = fade
animation_fade_in = 1
animation_fade_out = 1

# Layer açılış/kapanış: yatay slide (mango default). Bar/launcher/dash
# sağdan girer, sağa çıkar. `slide` aliasi = slide_in_right / slide_out_right.
layer_animation_type_open = slide_in
layer_animation_type_close = slide_out

# Zoom oranları — mango'nun mature değerleri. ~%6 ölçek değişimi: belirgin
# ama agresif değil. (0.92 sıçrama hissi veriyordu, 0.94 daha doğal.)
zoom_initial_ratio = 0.96
zoom_end_ratio = 0.96

# Fade-in: %72'den başla → gözler pencerenin nereye geleceğini takip eder.
# Fade-out: tam opaklıktan başlat, ease-out-quad ile söner.
fadein_begin_opacity = 0.80
fadeout_begin_opacity = 1.00

# ── Niri-uyumlu animasyon profili ────────────────────────────────────────────
#
# Doğrudan ~/.config/niri/conf/50-animations.kdl'den port edildi:
#
#   niri animations {
#     window-movement      { spring damping=1.0 stiffness=750 ε=0.0001 }
#     window-resize        { spring damping=1.0 stiffness=850 ε=0.0001 }
#     window-open          { duration-ms=180  curve "ease-out-expo" }
#     window-close         { duration-ms=160  curve "ease-out-quad" }
#     workspace-switch     { spring damping=1.0 stiffness=700 ε=0.0001 }
#     horizontal-view-movement { spring damping=1.0 stiffness=750 ε=0.0001 }
#     overview-open-close  { spring damping=1.0 stiffness=850 ε=0.0001 }
#   }
#
# Niri her animasyon tipine ayrı stiffness verir; margo'da spring
# stiffness GLOBAL. Niri ortalaması ≈ 770 → biz 800 ile yuvarladık
# (resize+overview'in 850, move+view'ın 750, workspace'in 700 kombosu).
# Damping ratio ve mass değerleri birebir aynı.

# Süreler (ms) — niri'nin window-open/close değerleri + margo özelleri:
#   move=220     spring cap; spring settle bunu kullanmayacak ama
#                bezier fallback'inde geçerli olur
#   open=180     ease-out-expo (niri default)
#   close=160    ease-out-quad (niri default)
#   tag=200      yatay tag yönünde keskin snap (ease-out-expo'nun 280ms
#                cap'i baştaki soft ramp + paralel pencere zamanlama
#                farkı yüzünden drift yaratıyordu; kısaltılmış süre +
#                material-standard curve ile pencereler scroller'ın
#                yatay column akışıyla aynı ritimde kayar)
#   focus=120    snappy border+opacity cross-fade
#   canvas=300   PaperWM-style pan/zoom
animation_duration_move = 140
animation_duration_open = 110
animation_duration_close = 100
animation_duration_tag = 160
animation_duration_focus = 80
animation_duration_canvas_pan  = 300
animation_duration_canvas_zoom = 300

# Bezier eğrileri — niri'nin curve isimleriyle birebir:
#   ease-out-expo     : cubic-bezier(0.16, 1.00, 0.30, 1.00)  → soft kalk, sert snap-stop
#   ease-out-quad     : cubic-bezier(0.25, 0.46, 0.45, 0.94)  → smooth
#   ease-out-cubic    : cubic-bezier(0.33, 1.00, 0.68, 1.00)  → snappy
#   material-standard : cubic-bezier(0.40, 0.00, 0.20, 1.00)  → dik kalkış +
#                       güçlü son; tag + move animasyonlarının senkron
#                       koşması için tek standart curve. Baştan eş hızda
#                       hareket eder, soft ramp'in tek-bir-pencere-önde-
#                       gidiyor gibi görünmesini engeller.
# Spring saatine bağlanan animasyon tipleri (move) için curve alanı
# kullanılmaz, sadece bezier saatine düşerken devreye girer.
animation_curve_move = 0.22, 1.00, 0.36, 1.00
animation_curve_open = 0.22, 1.00, 0.36, 1.00
animation_curve_close = 0.30, 0.00, 0.50, 1.00
# Tag = material-standard. ease-out-expo değildi çünkü paralel pencereler
# soft ramp'ta farklı görsel hızlarda başlıyordu; material-standard düz
# bir kalkış verir → tüm pencereler senkronize sola/sağa kayar,
# scroller'ın column flow'uyla aynı keskinlikte.
animation_curve_tag = 0.22, 1.00, 0.36, 1.00
animation_curve_focus = 0.30, 1.00, 0.50, 1.00
animation_curve_opafadein   = 0.16,1.00,0.30,1.00
animation_curve_opafadeout  = 0.50,0.50,0.50,0.50
animation_curve_canvas_pan  = 0.16,1.00,0.30,1.00
animation_curve_canvas_zoom = 0.16,1.00,0.30,1.00

# ── Spring saati hangi animasyon tipinde aktif? ──────────────────────────────
# Niri'nin default'unu birebir taklit:
#   * Move    = spring   (window-movement = spring)
#   * Tag     = spring   (workspace-switch = spring)
#   * Open    = bezier   (window-open = curve "ease-out-expo")
#   * Close   = bezier   (window-close = curve "ease-out-quad")
#   * Focus   = bezier   (niri'de yok; mango pattern, snappy his)
#   * Layer   = bezier   (niri'de standalone yok; bar/notification için doğal)
#
# Move = bezier (Tag ile senkron). Spring'di ama tag geçişinde Tag
# (bezier) + Move (spring) iki farklı eğri ve süreyle koştuğu için
# pencere konum geçişi tag kaymasıyla aynı ritimde bitmiyordu —
# göz spring path'ini ayrı bir hareket olarak algılıyordu.
# Aynı curve + aynı duration → tüm hareket tek kompoze ritimde biter.
# Mid-flight retarget velocity koruması (spring'in tek avantajı) sürekli
# arrange tetikleyen clientlarda kayboluyor ama tag geçişinin temizliği
# bunun önüne geçti.
animation_clock_move = spring
animation_clock_open = bezier
animation_clock_close = bezier
# Tag bezier'a çekildi — margo'da her pencere ayrı slide ediyor (niri'deki
# gibi tek-blok scene değil), spring overshoot çoklu paralel sallantıya
# yol açıyordu. Bezier net snap-stop verir, predictable.
animation_clock_tag = bezier
animation_clock_focus = bezier
animation_clock_layer = bezier

# Spring tuning — niri ortalaması (move 750, resize 850, ws 700, view 750).
# Tek global slot → 800 ortalama; istersen 750'ye çek (move-tag biraz daha
# yumuşak), 850'ye çek (snappier).
animation_spring_stiffness     = 800.0
animation_spring_damping_ratio = 1.0
animation_spring_mass          = 1.0

# ╭───────────────────────────────────────────────────────────────────────────╮
# │ 3. Çekirdek davranış                                                      │
# ╰───────────────────────────────────────────────────────────────────────────╯
focus_on_activate          = 1   # xdg_activation token gelirse pencereye atla
focus_cross_monitor        = 0   # focusdir monitor sınırını aşmasın
exchange_cross_monitor     = 0
focus_cross_tag            = 0
view_current_to_back       = 1   # super+N aynı tag'a → önceki tag'e dön (dwm)
sloppyfocus                = 1   # cursor altındaki pencere otomatik focus
warpcursor                 = 0   # focus değişiminde cursor pencereye atlasın
                                 # (sloppyfocus=1 ile birlikte 1 yapınca
                                 # ping-pong döngüsü: warp → sloppyfocus
                                 # tetik → yeni focus → warp → … bar'da
                                 # 5-9 s'lik burst halinde titreme yapıyor)
# cursor 3 sn hareketsizlikte gizlenir
cursor_hide_timeout        = 3
# XWayland surface'lerde resize sonrası flicker yok
xwayland_persistence       = 1

# Drag-to-rearrange (mouse ile pencere taşıma)
drag_tile_to_tile              = 1
# 0=top-left 1=top-right 2=bottom-left 3=bottom-right 4=otomatik
drag_corner                    = 4
drag_warp_cursor               = 1
drag_tile_refresh_interval     = 8.0
drag_floating_refresh_interval = 8.0

# Floating snapping
enable_floating_snap = 1
snap_distance        = 30

# Hot corner / overview
enable_hotarea = 1
hotarea_size   = 10
# 0=top-left 1=top-right 2=bottom-left 3=bottom-right
hotarea_corner = 3
ov_tab_mode    = 0
overviewgappi  = 12
overviewgappo  = 60

# Scroll / axis
axis_bind_apply_timeout = 100
axis_scroll_factor      = 1.25

# Sync / tearing
# explicit-sync — DXVK/Vulkan için 1 yap
syncobj_enable          = 0
# 2 = force_tearing window-rule'lı pencerelere izin ver, diğerleri vsync
allow_tearing           = 2
allow_shortcuts_inhibit = 1
idleinhibit_ignore_visible = 0

# Scratchpad davranışı
# cursor monitör değişince scratchpad takip etsin
scratchpad_cross_monitor = 1
# bir scratchpad açıkken diğerleri otomatik gizlensin
single_scratchpad        = 1

# ╭───────────────────────────────────────────────────────────────────────────╮
# │ 4. Klavye & Input                                                         │
# ╰───────────────────────────────────────────────────────────────────────────╯
xkb_rules_layout  = tr
xkb_rules_variant = f
# CapsLock → Ctrl (xkb seçenekleri)
xkb_rules_options = ctrl:nocaps
repeat_rate       = 35
repeat_delay      = 250
numlockon         = 0

# Touchpad
tap_to_click               = 1
tap_and_drag               = 1
drag_lock                  = 1
trackpad_natural_scrolling = 0
disable_while_typing       = 1
left_handed                = 0
middle_button_emulation    = 1
# 2 = clickfinger, 1 = button-areas
click_method               = 2
# 1 = 2-finger, 2 = edge, 3 = on-button
scroll_method              = 1
scroll_button              = 274
send_events_mode           = 0
button_map                 = 0

# Mouse
mouse_natural_scrolling = 0
# 0 = none, 1 = adaptive, 2 = flat
accel_profile           = 2
accel_speed             = 1.00
# 3+finger swipe min mesafe (px). 30 = mango/niri default — kasıtlı niyet eşiği.
# Daha hassas isteyenler (küçük touchpad / kısa flick alışkanlığı): 15-20.
swipe_min_threshold     = 30

# ╭───────────────────────────────────────────────────────────────────────────╮
# │ 5. Ortam değişkenleri                                                     │
# ╰───────────────────────────────────────────────────────────────────────────╯
env = XDG_CURRENT_DESKTOP,margo
env = XDG_SESSION_DESKTOP,margo
env = XDG_SESSION_TYPE,wayland
env = GDK_BACKEND,wayland,x11
env = QT_QPA_PLATFORM,wayland;xcb
env = SDL_VIDEODRIVER,wayland
env = CLUTTER_BACKEND,wayland

# ╭───────────────────────────────────────────────────────────────────────────╮
# │ 6. Layout & per-tag home monitor                                          │
# ╰───────────────────────────────────────────────────────────────────────────╯
# Layout tipleri: tile | scroller | grid | monocle | deck | center_tile |
#                 vertical_grid | dwindle | canvas
default_layout            = scroller
default_mfact             = 0.55
default_nmaster           = 1
new_is_master             = 0
center_master_overspread  = 0
center_when_single_stack  = 1
canvas_tiling             = 0
canvas_tiling_gap         = 10
canvas_pan_on_kill        = 1
canvas_anchor_animate     = 0
circle_layout             = scroller,tile,dwindle,grid,center_tile

# Scroller-specific (PaperWM tarzı yatay scroll)
scroller_structs                  = 24
scroller_default_proportion        = 0.800
scroller_default_proportion_single = 0.800
scroller_ignore_proportion_single  = 0
scroller_focus_center              = 1
scroller_prefer_center             = 1
scroller_prefer_overspread         = 0
edge_scroller_pointer_focus        = 1
scroller_proportion_preset         = 1.000,0.800,0.618,0.500

# Per-tag home monitor — `view_tag(N)` farklı monitördeyken otomatik o ekrana
# warp eder; `windowrule = tags:N, …` tag'in home'unu monitör olarak alır
# (ayrıca `monitor:` yazmaya gerek kalmaz).
#   DP-3  : 1-6 → Kenp / Term / AI / Work / Chat / Media
#   eDP-1 : 7-9 → Utility / Music / Social
tagrule = id:1,monitor_name:DP-3
tagrule = id:2,monitor_name:DP-3
tagrule = id:3,monitor_name:DP-3
tagrule = id:4,monitor_name:DP-3
tagrule = id:5,monitor_name:DP-3
tagrule = id:6,monitor_name:DP-3
tagrule = id:7,monitor_name:eDP-1
tagrule = id:8,monitor_name:eDP-1
tagrule = id:9,monitor_name:eDP-1

# Per-tag wallpaper'lar artık dış shell (osc-shell / noctalia) tarafından
# yönetiliyor — `osc-shell ipc call wallpaper next/prev/toggle` binds
# section 11'de.

# ╭───────────────────────────────────────────────────────────────────────────╮
# │ 7. Window rules                                                           │
# ╰───────────────────────────────────────────────────────────────────────────╯
# Regex anchored (^…$) önerilir — partial match kazara başka pencereyi
# yakalayabilir. `mctl rules --appid X --title Y` ile hangi kuralın eştiğini
# debug'la. `mctl check-config` ile regex hatalarını yakala.

# ── Tag-pinned uygulamalar ───────────────────────────────────────────────────
# `monitor:` tagrule'dan otomatik geliyor — `tags:N` yeterli.
windowrule = tags:1,appid:^Kenp$
windowrule = tags:2,appid:^(TmuxKenp|kitty)$,title:^Tmux$
windowrule = tags:3,appid:^(Ai|Nil)$
windowrule = tags:4,appid:^CompecTA$
windowrule = tags:5,appid:^(discord|WebCord|webcord|audacious)$
# WebCord/Electron set app_id="electron" by default on Wayland —
# the rule above misses it. Match the WebCord title pattern to
# pin it to tag 5 anyway. Discord proper does the same; covered
# here too for the same reason.
windowrule = tags:5,appid:^electron$,title:WebCord
windowrule = tags:5,appid:^webcord$,title:WebCord
windowrule = tags:5,appid:^(electron|Electron)$,title:Discord
windowrule = tags:6,appid:^(Exclude|org\.telegram\.desktop|vlc|remote-viewer)$
windowrule = tags:7,appid:^(transmission|org\.keepassxc\.KeePassXC|(brave-youtube|chrome-youtube)\.com__-Default)$
windowrule = tags:8,appid:^(spotify|Spotify|com\.spotify\.Client)$
windowrule = tags:9,appid:^(ferdium|Ferdium|com\.rtosta\.zapzap|(Whats|chrome-web\.whatsapp\.com__-Default))$

# ── Browser / editor / terminal scroller proportion'ları ─────────────────────
windowrule = scroller_proportion:0.85,scroller_proportion_single:0.9,appid:^(brave-browser|chrome|firefox|librewolf|Chromium)$
windowrule = scroller_proportion:0.85,appid:^(kitty|Alacritty|foot|com\.mitchellh\.ghostty|TmuxKenp|dropdown-terminal|yazi-scratchpad|clipse)$
windowrule = scroller_proportion:0.8,appid:^(Code|vscodium|neovide)$
# Helium tag-pinned pencereleri (Kenp / Ai / CompecTA / WebCord) browser
# stiliyle (0.85). Tag'de tek pencere varsa 0.95'e yayılır — okumayı daha
# rahat kılar; yanına ikinci pencere geldiğinde 0.85'e iner.
windowrule = scroller_proportion:0.85,scroller_proportion_single:0.95,appid:^(Kenp|Ai|CompecTA|WebCord)$
# Steam ana UI: tearing kapalı; oyunlar (steam_app_*) aşağıda ayrı kuralla.
windowrule = exclude_appid:^steam_app_.*$,appid:^(steam|com\.valvesoftware\.Steam)$,scroller_proportion:0.85

# ── Floating dialog / utility pencereleri ────────────────────────────────────
windowrule = isfloating:1,width:960,height:720,appid:^(xdg-desktop-portal-(gtk|gnome|wlr))$
windowrule = isfloating:1,width:600,height:240,appid:^(polkit-gnome-authentication-agent-1|gcr-prompter|pinentry.*)$
windowrule = isfloating:1,width:640,height:260,title:^(Authentication Required|Unlock Keyring|OpenSSH Authentication Passphrase)$
windowrule = isfloating:1,width:960,height:720,title:^(Open File|Choose (File|Folder)|Save As|Confirm to replace files|File Operation Progress|Extract archive|Compress\.\.\.)$
windowrule = isfloating:1,width:900,height:650,appid:^(blueman-manager|nm-connection-editor|org\.gnome\.Settings|gnome-disks|virt-manager)$
windowrule = isfloating:1,width:360,height:440,appid:^nm-applet$
windowrule = isfloating:1,width:960,height:720,appid:^(org\.gnome\.FileRoller|file-roller)$
windowrule = isfloating:1,width:540,height:640,appid:^(org\.gnome\.Calculator|kcalc|qalculate-gtk|org\.gnome\.Characters)$
windowrule = isfloating:1,width:700,height:450,title:^Volume Control$
windowrule = isfloating:1,width:960,height:720,appid:^(anote|org\.quickshell)$
windowrule = isfloating:1,width:600,height:1080,offsetx:900,offsety:-15,appid:^(com\.github\.hluk\.copyq|copyq|com\.mitchellh\.ghostty|wiremix|org\.pulseaudio\.pavucontrol|io\.ente\.auth)$

# ── Named scratchpad'ler (bind ile toggle, açılışta gizli başlar) ────────────
windowrule = isnamedscratchpad:1,width:1980,height:660,offsetx:0,offsety:-100,appid:^dropdown-terminal$
