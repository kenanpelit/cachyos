# ╔═══════════════════════════════════════════════════════════════════════════╗
# ║ margo compositor — kenan@2026                                             ║
# ║ Konum: ~/.config/margo/config.conf                                        ║
# ╚═══════════════════════════════════════════════════════════════════════════╝
#
# Syntax:
#   key = value
#   bind = MODIFIERS,key,action[,arg1[,arg2[,arg3]]]
#     MODIFIERS : super | ctrl | shift | alt   (birleştir: super+shift)
#     key       : xkbcommon adı (Return, space, q, 1..9, F1..F12, …)
#     action    : spawn | reload_config | killclient | focusdir | view | tag |
#                 tagview | toggleview | tagtoleft/right | setlayout |
#                 switch_layout | togglefloating | togglefullscreen |
#                 movewin | resizewin | zoom | focusmon | tagmon |
#                 toggle_named_scratchpad | unscratchpad | toggleoverview |
#                 reload_config | force_unlock | quit | …
#     `mctl actions --verbose` çalıştır → tüm aksiyonların listesi + alias'lar.
#
# Reload: `mctl reload` veya Super+Ctrl+R   (oturumu kapatmaya gerek yok)
# Validate: `mctl check-config` — duplicate bind, regex hata, unknown field tespiti
#
# İçerik:
#   1. Görünüm (border, gap, renk, opacity)
#   2. Animasyon (dikey tag yönü + layer slide'ları)
#   3. Çekirdek davranış (focus, drag, snap, scratchpad)
#   4. Klavye & touchpad
#   5. Ortam değişkenleri
#   6. Layout & per-tag home monitor
#   7. Window rules (tag pin + floating geom + screencast block-out)
#   8. Layer rules
#   9. Monitör tanımları
#  10. Başlangıç komutları
#  11. Keybind'ler

# ╭───────────────────────────────────────────────────────────────────────────╮
# │ 1. Görünüm                                                                │
# ╰───────────────────────────────────────────────────────────────────────────╯
borderpx              = 3
border_radius         = 12
no_border_when_single = 0
no_radius_when_single = 0

# Gaps (inner = pencereler arası, outer = ekran kenarına)
gappih  = 12
gappiv  = 12
gappoh  = 12
gappov  = 12
smartgaps = 0

# Opacity — odaklı pencere %100, diğerleri %90 (focus oracle cross-fade'i
# `animation_curve_focus` ile bunu yumuşatır)
focused_opacity   = 1.00
unfocused_opacity = 0.90

cursor_size = 24

# Catppuccin Mocha paleti
rootcolor       = 0x1e1e2eff
bordercolor     = 0x313244ff
focuscolor      = 0xcba6f7ff
urgentcolor     = 0xf38ba8ff
scratchpadcolor = 0x74c7ecff
globalcolor     = 0xb4befeff
overlaycolor    = 0x89b4faff
shadowscolor    = 0x11111b99

# Blur / shadow / layer-shadow toggleları.
# SDF drop-shadow P5'te shipped; mango'nun değerleriyle birebir
# aynı tuning (size=16, blur=24, offset_y=4 — derin ama yumuşak).
# Blur henüz Kawase implementation yok → kapalı.
blur                 = 0
blur_layer           = 0
blur_optimized       = 1
shadows              = 1
shadow_only_floating = 1
layer_shadows        = 0
shadows_size         = 16
shadows_blur         = 24
shadows_position_x   = 0
shadows_position_y   = 4

# ╭───────────────────────────────────────────────────────────────────────────╮
# │ 2. Animasyon — dikey tag yönü + uyumlu layer slide'ları                   │
# ╰───────────────────────────────────────────────────────────────────────────╯
# Margo P2 animasyon tipleri: Move, Open, Close, Tag, Focus, Layer.
# Her tip için ayrı `animation_clock_*` (bezier|spring) + `animation_curve_*`
# (4-noktalı bezier) + `animation_duration_*` (ms).
#
# tag_animation_direction:
#   0 → tag geçişi YATAY kayar (mango/dwl varsayılanı, bu config'in seçimi)
#   1 → tag geçişi DİKEY kayar (yukarı-aşağı)
tag_animation_direction = 0

animations       = 1
layer_animations = 1

# Pencere açılış/kapanış: yön-bağımsız zoom + fade. Tag yönü değişse de
# bu his aynı kalır — pencerenin "kendi" geçişi taglerden bağımsız.
animation_type_open  = zoom
animation_type_close = fade
animation_fade_in    = 1
animation_fade_out   = 1

# Layer açılış/kapanış: yatay slide (mango default). Bar/launcher/dash
# sağdan girer, sağa çıkar. `slide` aliasi = slide_in_right / slide_out_right.
layer_animation_type_open  = slide
layer_animation_type_close = slide

# Zoom oranları — mango'nun mature değerleri. ~%6 ölçek değişimi: belirgin
# ama agresif değil. (0.92 sıçrama hissi veriyordu, 0.94 daha doğal.)
zoom_initial_ratio = 0.94
zoom_end_ratio     = 0.94

# Fade-in: %72'den başla → gözler pencerenin nereye geleceğini takip eder.
# Fade-out: tam opaklıktan başlat, ease-out-quad ile söner.
fadein_begin_opacity  = 0.72
fadeout_begin_opacity = 1.00

# ── Niri-uyumlu animasyon profili ────────────────────────────────────────────
#
# Doğrudan ~/.config/niri/conf/50-animations.kdl'den port edildi:
#
#   niri animations {
#     window-movement      { spring damping=1.0 stiffness=750 ε=0.0001 }
#     window-resize        { spring damping=1.0 stiffness=850 ε=0.0001 }
#     window-open          { duration-ms=180  curve "ease-out-expo" }
#     window-close         { duration-ms=160  curve "ease-out-quad" }
#     workspace-switch     { spring damping=1.0 stiffness=700 ε=0.0001 }
#     horizontal-view-movement { spring damping=1.0 stiffness=750 ε=0.0001 }
#     overview-open-close  { spring damping=1.0 stiffness=850 ε=0.0001 }
#   }
#
# Niri her animasyon tipine ayrı stiffness verir; margo'da spring
# stiffness GLOBAL. Niri ortalaması ≈ 770 → biz 800 ile yuvarladık
# (resize+overview'in 850, move+view'ın 750, workspace'in 700 kombosu).
# Damping ratio ve mass değerleri birebir aynı.

# Süreler (ms) — niri'nin window-open/close değerleri + margo özelleri:
#   move=220     spring cap; spring settle bunu kullanmayacak ama
#                bezier fallback'inde geçerli olur
#   open=180     ease-out-expo (niri default)
#   close=160    ease-out-quad (niri default)
#   tag=280      spring kullanırken settle natural; bezier cap'i
#   focus=120    snappy border+opacity cross-fade
#   canvas=300   PaperWM-style pan/zoom
animation_duration_move        = 220
animation_duration_open        = 180
animation_duration_close       = 160
animation_duration_tag         = 280
animation_duration_focus       = 120
animation_duration_canvas_pan  = 300
animation_duration_canvas_zoom = 300

# Bezier eğrileri — niri'nin curve isimleriyle birebir:
#   ease-out-expo  : cubic-bezier(0.16, 1.00, 0.30, 1.00)  → snap-stop
#   ease-out-quad  : cubic-bezier(0.25, 0.46, 0.45, 0.94)  → smooth
#   ease-out-cubic : cubic-bezier(0.33, 1.00, 0.68, 1.00)  → snappy
# Spring saatine bağlanan animasyon tipleri (move/tag) için curve
# alanı kullanılmaz, sadece bezier saatine düşerken devreye girer.
animation_curve_move        = 0.16,1.00,0.30,1.00
animation_curve_open        = 0.16,1.00,0.30,1.00
animation_curve_close       = 0.25,0.46,0.45,0.94
animation_curve_tag         = 0.16,1.00,0.30,1.00
animation_curve_focus       = 0.33,1.00,0.68,1.00
animation_curve_opafadein   = 0.16,1.00,0.30,1.00
animation_curve_opafadeout  = 0.50,0.50,0.50,0.50
animation_curve_canvas_pan  = 0.16,1.00,0.30,1.00
animation_curve_canvas_zoom = 0.16,1.00,0.30,1.00

# ── Spring saati hangi animasyon tipinde aktif? ──────────────────────────────
# Niri'nin default'unu birebir taklit:
#   * Move    = spring   (window-movement = spring)
#   * Tag     = spring   (workspace-switch = spring)
#   * Open    = bezier   (window-open = curve "ease-out-expo")
#   * Close   = bezier   (window-close = curve "ease-out-quad")
#   * Focus   = bezier   (niri'de yok; mango pattern, snappy his)
#   * Layer   = bezier   (niri'de standalone yok; bar/notification için doğal)
#
# Move spring'i mid-flight retarget'ta velocity korur — Helium/Spotify
# gibi sürekli arrange tetikleyen client'larda bezier'in restart kink'i
# ortadan kalkar. Tag spring'i workspace switch'e niri-feel verir.
animation_clock_move           = spring
animation_clock_open           = bezier
animation_clock_close          = bezier
# Tag bezier'a çekildi — margo'da her pencere ayrı slide ediyor (niri'deki
# gibi tek-blok scene değil), spring overshoot çoklu paralel sallantıya
# yol açıyordu. Bezier net snap-stop verir, predictable.
animation_clock_tag            = bezier
animation_clock_focus          = bezier
animation_clock_layer          = bezier

# Spring tuning — niri ortalaması (move 750, resize 850, ws 700, view 750).
# Tek global slot → 800 ortalama; istersen 750'ye çek (move-tag biraz daha
# yumuşak), 850'ye çek (snappier).
animation_spring_stiffness     = 800.0
animation_spring_damping_ratio = 1.0
animation_spring_mass          = 1.0

# ╭───────────────────────────────────────────────────────────────────────────╮
# │ 3. Çekirdek davranış                                                      │
# ╰───────────────────────────────────────────────────────────────────────────╯
focus_on_activate          = 1   # xdg_activation token gelirse pencereye atla
focus_cross_monitor        = 0   # focusdir monitor sınırını aşmasın
exchange_cross_monitor     = 0
focus_cross_tag            = 0
view_current_to_back       = 1   # super+N aynı tag'a → önceki tag'e dön (dwm)
sloppyfocus                = 1   # cursor altındaki pencere otomatik focus
warpcursor                 = 1   # focus değişiminde cursor pencereye atlasın
# cursor 3 sn hareketsizlikte gizlenir
cursor_hide_timeout        = 3
# XWayland surface'lerde resize sonrası flicker yok
xwayland_persistence       = 1

# Drag-to-rearrange (mouse ile pencere taşıma)
drag_tile_to_tile              = 1
# 0=top-left 1=top-right 2=bottom-left 3=bottom-right 4=otomatik
drag_corner                    = 4
drag_warp_cursor               = 1
drag_tile_refresh_interval     = 8.0
drag_floating_refresh_interval = 8.0

# Floating snapping
enable_floating_snap = 1
snap_distance        = 30

# Hot corner / overview
enable_hotarea = 1
hotarea_size   = 10
# 0=top-left 1=top-right 2=bottom-left 3=bottom-right
hotarea_corner = 3
ov_tab_mode    = 0
overviewgappi  = 12
overviewgappo  = 60

# Scroll / axis
axis_bind_apply_timeout = 100
axis_scroll_factor      = 1.25

# Sync / tearing
# explicit-sync — DXVK/Vulkan için 1 yap
syncobj_enable          = 0
# 2 = force_tearing window-rule'lı pencerelere izin ver, diğerleri vsync
allow_tearing           = 2
allow_shortcuts_inhibit = 1
idleinhibit_ignore_visible = 0

# Scratchpad davranışı
# cursor monitör değişince scratchpad takip etsin
scratchpad_cross_monitor = 1
# bir scratchpad açıkken diğerleri otomatik gizlensin
single_scratchpad        = 1

# ╭───────────────────────────────────────────────────────────────────────────╮
# │ 4. Klavye & Input                                                         │
# ╰───────────────────────────────────────────────────────────────────────────╯
xkb_rules_layout  = tr
xkb_rules_variant = f
# CapsLock → Ctrl (xkb seçenekleri)
xkb_rules_options = ctrl:nocaps
repeat_rate       = 35
repeat_delay      = 250
numlockon         = 0

# Touchpad
tap_to_click               = 1
tap_and_drag               = 1
drag_lock                  = 1
trackpad_natural_scrolling = 0
disable_while_typing       = 1
left_handed                = 0
middle_button_emulation    = 1
# 2 = clickfinger, 1 = button-areas
click_method               = 2
# 1 = 2-finger, 2 = edge, 3 = on-button
scroll_method              = 1
scroll_button              = 274
send_events_mode           = 0
button_map                 = 0

# Mouse
mouse_natural_scrolling = 0
# 0 = none, 1 = adaptive, 2 = flat
accel_profile           = 2
accel_speed             = 1.00
# 3+finger swipe min mesafe (px). 30 = mango/niri default — kasıtlı niyet eşiği.
# Daha hassas isteyenler (küçük touchpad / kısa flick alışkanlığı): 15-20.
swipe_min_threshold     = 30

# ╭───────────────────────────────────────────────────────────────────────────╮
# │ 5. Ortam değişkenleri                                                     │
# ╰───────────────────────────────────────────────────────────────────────────╯
env = XDG_CURRENT_DESKTOP,margo:mango
env = XDG_SESSION_DESKTOP,margo
env = XDG_SESSION_TYPE,wayland
env = GDK_BACKEND,wayland,x11
env = QT_QPA_PLATFORM,wayland;xcb
env = SDL_VIDEODRIVER,wayland
env = CLUTTER_BACKEND,wayland

# ╭───────────────────────────────────────────────────────────────────────────╮
# │ 6. Layout & per-tag home monitor                                          │
# ╰───────────────────────────────────────────────────────────────────────────╯
# Layout tipleri: tile | scroller | grid | monocle | deck | center_tile |
#                 vertical_grid | dwindle | canvas
default_layout            = scroller
default_mfact             = 0.55
default_nmaster           = 1
new_is_master             = 0
center_master_overspread  = 0
center_when_single_stack  = 1
canvas_tiling             = 0
canvas_tiling_gap         = 10
canvas_pan_on_kill        = 1
canvas_anchor_animate     = 0
circle_layout             = scroller,tile,center_tile,grid,deck,monocle,vertical_grid

# Scroller-specific (PaperWM tarzı yatay scroll)
scroller_structs                  = 24
scroller_default_proportion        = 0.800
scroller_default_proportion_single = 0.800
scroller_ignore_proportion_single  = 0
scroller_focus_center              = 1
scroller_prefer_center             = 1
scroller_prefer_overspread         = 0
edge_scroller_pointer_focus        = 1
scroller_proportion_preset         = 1.000,0.800,0.618,0.500

# Per-tag home monitor — `view_tag(N)` farklı monitördeyken otomatik o ekrana
# warp eder; `windowrule = tags:N, …` tag'in home'unu monitör olarak alır
# (ayrıca `monitor:` yazmaya gerek kalmaz).
#   DP-3  : 1-6 → Kenp / Term / AI / Work / Chat / Media
#   eDP-1 : 7-9 → Utility / Music / Social
tagrule = id:1,layout_name:scroller,monitor_name:DP-3
tagrule = id:2,layout_name:scroller,monitor_name:DP-3
tagrule = id:3,layout_name:scroller,monitor_name:DP-3
tagrule = id:4,layout_name:scroller,monitor_name:DP-3
tagrule = id:5,layout_name:scroller,monitor_name:DP-3
tagrule = id:6,layout_name:scroller,monitor_name:DP-3
tagrule = id:7,layout_name:scroller,monitor_name:eDP-1
tagrule = id:8,layout_name:scroller,monitor_name:eDP-1
tagrule = id:9,layout_name:scroller,monitor_name:eDP-1

# ╭───────────────────────────────────────────────────────────────────────────╮
# │ 7. Window rules                                                           │
# ╰───────────────────────────────────────────────────────────────────────────╯
# Regex anchored (^…$) önerilir — partial match kazara başka pencereyi
# yakalayabilir. `mctl rules --appid X --title Y` ile hangi kuralın eştiğini
# debug'la. `mctl check-config` ile regex hatalarını yakala.

# ── Tag-pinned uygulamalar ───────────────────────────────────────────────────
# `monitor:` tagrule'dan otomatik geliyor — `tags:N` yeterli.
windowrule = tags:1,appid:^Kenp$
windowrule = tags:2,appid:^(TmuxKenp|kitty)$,title:^Tmux$
windowrule = tags:3,appid:^(Ai|Nil)$
windowrule = tags:4,appid:^CompecTA$
windowrule = tags:5,appid:^(discord|WebCord|audacious)$
# WebCord/Electron set app_id="electron" by default on Wayland —
# the rule above misses it. Match the WebCord title pattern to
# pin it to tag 5 anyway. Discord proper does the same; covered
# here too for the same reason.
windowrule = tags:5,appid:^electron$,title:WebCord
windowrule = tags:5,appid:^(electron|Electron)$,title:Discord
windowrule = tags:6,appid:^(Exclude|org\.telegram\.desktop|vlc|remote-viewer)$
windowrule = tags:7,appid:^(transmission|org\.keepassxc\.KeePassXC|(brave-youtube|chrome-youtube)\.com__-Default)$
windowrule = tags:8,appid:^(spotify|Spotify|com\.spotify\.Client)$
windowrule = tags:9,appid:^(ferdium|Ferdium|com\.rtosta\.zapzap|(Whats|chrome-web\.whatsapp\.com__-Default))$

# ── Browser / editor / terminal scroller proportion'ları ─────────────────────
windowrule = scroller_proportion:0.85,scroller_proportion_single:0.9,appid:^(brave-browser|chrome|firefox|librewolf|Chromium)$
windowrule = scroller_proportion:0.85,appid:^(kitty|Alacritty|foot|com\.mitchellh\.ghostty|TmuxKenp|dropdown-terminal|yazi-scratchpad|clipse)$
windowrule = scroller_proportion:0.8,appid:^(Code|vscodium|neovide)$
# Steam ana UI: tearing kapalı; oyunlar (steam_app_*) aşağıda ayrı kuralla.
windowrule = exclude_appid:^steam_app_.*$,appid:^(steam|com\.valvesoftware\.Steam)$,scroller_proportion:0.85

# ── Floating dialog / utility pencereleri ────────────────────────────────────
windowrule = isfloating:1,width:960,height:720,appid:^(xdg-desktop-portal-(gtk|gnome|wlr))$
windowrule = isfloating:1,width:600,height:240,appid:^(polkit-gnome-authentication-agent-1|gcr-prompter|pinentry.*)$
windowrule = isfloating:1,width:640,height:260,title:^(Authentication Required|Unlock Keyring|OpenSSH Authentication Passphrase)$
windowrule = isfloating:1,width:960,height:720,title:^(Open File|Choose (File|Folder)|Save As|Confirm to replace files|File Operation Progress|Extract archive|Compress\.\.\.)$
windowrule = isfloating:1,width:900,height:650,appid:^(blueman-manager|nm-connection-editor|org\.gnome\.Settings|gnome-disks|pavucontrol|pwvucontrol|virt-manager)$
windowrule = isfloating:1,width:360,height:440,appid:^nm-applet$
windowrule = isfloating:1,width:960,height:720,appid:^(org\.gnome\.FileRoller|file-roller)$
windowrule = isfloating:1,width:540,height:640,appid:^(org\.gnome\.Calculator|kcalc|qalculate-gtk|org\.gnome\.Characters)$
windowrule = isfloating:1,width:700,height:450,title:^Volume Control$
windowrule = isfloating:1,width:960,height:720,appid:^(anote|org\.quickshell)$
windowrule = isfloating:1,width:600,height:1080,offsetx:900,offsety:-15,appid:^(com\.github\.hluk\.copyq|copyq|wiremix|org\.pulseaudio\.pavucontrol|io\.ente\.auth)$

# ── Named scratchpad'ler (bind ile toggle, açılışta gizli başlar) ────────────
windowrule = isnamedscratchpad:1,width:1980,height:660,offsetx:0,offsety:-100,appid:^dropdown-terminal$
windowrule = isnamedscratchpad:1,width:1600,height:900,offsetx:0,offsety:0,appid:^yazi-scratchpad$
windowrule = isnamedscratchpad:1,width:760,height:960,offsetx:92,offsety:-8,appid:^clipse$
windowrule = isnamedscratchpad:1,width:900,height:760,offsetx:92,offsety:-10,appid:^wiremix$

# ── mpv: ana pencere + Picture-in-Picture popup ayrı kurallar ───────────────
# Rust regex'i `(?!...)` lookahead desteklemez → niri-stili `exclude_title`
# ile PiP'i ana mpv'den dışla.
windowrule = isfloating:1,width:640,height:360,offsetx:900,offsety:-400,appid:^mpv$,exclude_title:^(Picture-in-Picture|Picture-in-Picture - mpv|Picture in Picture)$
# PiP popup (mpv + browser PiP'leri): sabit boyut, scroller kolonu
# büyütemesin diye min/max ile pinli.
windowrule = isfloating:1,width:640,height:360,min_width:640,max_width:640,min_height:360,max_height:360,offsetx:95,offsety:-80,title:^(Picture-in-Picture|Picture-in-Picture - mpv|Picture in Picture)$,open_focused:1

# ── Hassas pencereler: blur kapalı, animasyon hafif, screencast'te maskeli ──
windowrule = isfloating:1,width:960,height:720,noblur:1,isnoanimation:1,appid:^(org\.keepassxc\.KeePassXC|KeePassXC|com\.bitwarden\.desktop|Bitwarden|com\.1password\.1Password|1Password|org\.gnome\.World\.Secrets|org\.gnome\.seahorse\.Application|seahorse)$
# Screencast'te password manager + clipboard manager + auth dialog'lar siyah
windowrule = block_out_from_screencast:1,appid:^(org\.keepassxc\.KeePassXC|KeePassXC|com\.bitwarden\.desktop|Bitwarden|com\.1password\.1Password|1Password|com\.github\.hluk\.copyq|copyq|clipse|io\.ente\.auth|org\.gnome\.World\.Secrets|seahorse|kwalletmanager|kwalletmanager5|gcr-prompter|pinentry.*|polkit-gnome-authentication-agent-1)$
# Browser private/incognito pencereler
windowrule = block_out_from_screencast:1,appid:^(firefox|librewolf|zen|brave-browser|brave|Chromium|chrome|microsoft-edge.*|helium.*)$,title:(?i)(private browsing|private window|incognito|inprivate)
# Şifre/auth dialog title'ları (yedek katman, appid yakalamıyorsa)
windowrule = block_out_from_screencast:1,title:(?i)(password|passphrase|authentication|unlock|secret|two-factor|verification code|one-time|otp)

# ── Oyun / remote-play: tearing açık, blur+shadow+anim kapalı ───────────────
windowrule = force_tearing:1,noblur:1,isnoshadow:1,isnoanimation:1,appid:^(gamescope|steam_app_.*|lutris|net\.lutris\.Lutris|com\.heroicgameslauncher\.hgl)$
windowrule = force_tearing:1,noblur:1,isnoshadow:1,isnoanimation:1,title:^(Counter-Strike 2|Dota 2|ELDEN RING|Cyberpunk 2077|No Man's Sky).*$

# ── Terminal swallowing ───────────────────────────────────────────────────────
windowrule = isterm:1,appid:^(kitty|Alacritty|com\.mitchellh\.ghostty|foot|TmuxKenp|dropdown-terminal|yazi-scratchpad|clipse|wiremix|mango-doctor)$
windowrule = noswallow:1,appid:^(mpv|org\.telegram\.desktop|ferdium|Ferdium|discord|WebCord|Signal|Slack)$

# ── Screenshot editor'leri (swappy/satty) ────────────────────────────────────
# eDP-1 (1920x1200) work-area'sına sığacak 1700x1100 — DP-3'te de margin'le
# rahat sığar. is_overlay:1 → editör düzenleme sırasında üstte kalır.
windowrule = isfloating:1,width:1700,height:1100,max_width:1700,max_height:1100,open_focused:1,noswallow:1,is_overlay:1,appid:^(swappy|satty|com\.github\.jtheoof\.swappy|io\.github\.gabm\.satty)$
windowrule = isfloating:1,width:1700,height:1100,max_width:1700,max_height:1100,open_focused:1,noswallow:1,is_overlay:1,title:(?i)(swappy|satty|screenshot)

# ╭───────────────────────────────────────────────────────────────────────────╮
# │ 8. Layer rules — namespace'e göre layer-surface tweak'leri                │
# ╰───────────────────────────────────────────────────────────────────────────╯
# Selection / screenshot UI: anlık geçiş, blur yok
layerrule = noanim:1,noblur:1,layer_name:^(selection|screenshot).*
# rofi/fuzzel/launcher: zoom-in ile pop, omni-direction his
layerrule = animation_type_open:zoom,animation_type_close:zoom,layer_name:^(rofi|fuzzel|launcher).*
# Control-center/dash/settings: yatay slide global default ile uyumlu
layerrule = animation_type_open:slide,animation_type_close:slide,layer_name:^(control-center|dash|session-menu|wallpaper|system-monitor|settings).*
layerrule = noshadow:1,layer_name:^(control-center|dash|session-menu|wallpaper|system-monitor).*
layerrule = noshadow:1,noblur:1,layer_name:^noctalia-fade-overlay$
# Notification/OSD/volume: anlık (kullanıcı bekleyeceği için fade'i ezer)
layerrule = noanim:1,noshadow:1,noblur:1,layer_name:^(notifications|toast|osd|volume|brightness|noctalia-(notifications|toast|osd|volume|brightness)).*

# ╭───────────────────────────────────────────────────────────────────────────╮
# │ 9. Monitör tanımları                                                      │
# ╰───────────────────────────────────────────────────────────────────────────╯
#monitorrule = name:DP-3,width:2560,height:1440,refresh:59,x:0,y:0,scale:1
#monitorrule = name:eDP-1,width:1920,height:1200,refresh:60,x:320,y:1440,scale:1

# ╭───────────────────────────────────────────────────────────────────────────╮
# │ 10. Başlangıç komutları                                                   │
# ╰───────────────────────────────────────────────────────────────────────────╯
exec-once = qs -c noctalia-shell --no-duplicate
#exec-once = waybar
#exec-once = swaybg -i ~/wallpaper.jpg

# ╔═══════════════════════════════════════════════════════════════════════════╗
# ║ 11. Keybind'ler                                                           ║
# ╚═══════════════════════════════════════════════════════════════════════════╝

# ── Uygulama başlatıcılar ────────────────────────────────────────────────────
bind = super,Return,spawn,uwsm app -a kitty -- /usr/bin/kitty
bind = alt,t,spawn,start-kkenp
#bind = super+alt,Return,spawn,uwsm app -a semsumo-daily -- semsumo-daily
bind = super+alt,Return,spawn,margo-semsumo-daily
bind = super+ctrl,f,spawn,uwsm app -a nemo -- /usr/bin/nemo
bind = super+alt,space,spawn,uwsm app -a rofi-launcher -- rofi-launcher
bind = alt,n,spawn,uwsm app -a anotes -- anotes

# ── Summon (mango-here yerlisi) ──────────────────────────────────────────────
# alt+N: tag N'in birincil uygulamasını mevcut tag'a getir; açık değilse spawn
# komutuyla başlat. appid regex'leri section 7'deki tagrule windowrule'larıyla
# birebir; spawn komutlarını kendi launcher'larına göre düzenle (mango-here'in
# launch_candidates fallback'iyle aynı: lowercased binary adı).
bind = alt,1,summon,^Kenp$,none,uwsm app -a Kenp -- start-helium-kenp
bind = alt,2,summon,^(TmuxKenp|kitty)$,^Tmux$,uwsm app -a TmuxKenp -- start-kkenp
bind = alt,3,summon,^Ai$,none,uwsm app -a Ai -- start-helium-ai
bind = alt,4,summon,^CompecTA$,none,uwsm app -a CompecTA -- start-helium-compecta
bind = alt,5,summon,^(discord|WebCord|electron)$,none,uwsm app -a webcord -- start-webcord
bind = alt,6,summon,^(Nil)$,none,uwsm app -a Nil -- start-helium-nil
#bind = alt,6,summon,^(org\.telegram\.desktop|TelegramDesktop)$,none,uwsm app -a TelegramDesktop -- start-telegram
bind = alt,7,summon,^(transmission|org\.keepassxc\.KeePassXC|brave-youtube|chrome-youtube\.com__-Default)$,none,uwsm app -a YouTube -- start-helium-youtube
bind = alt,8,summon,^(spotify|Spotify|com\.spotify\.Client)$,none,uwsm app -a Spotify -- start-spotify
bind = alt,9,summon,^(ferdium|Ferdium)$,none,uwsm app -a Ferdium -- start-ferdium

# ── Named scratchpad'ler ─────────────────────────────────────────────────────
# Bind syntax: toggle_named_scratchpad,<appid>,<title|none>,<spawn-cmd>
# İlk press spawn-cmd'yi çalıştırır + scratchpad'i gösterir. Sonraki press'ler
# göster/gizle. windowrule = isnamedscratchpad:1, …  ile etiketlenmiş olmalı.
bind = super+ctrl,Return,toggle_named_scratchpad,^dropdown-terminal$,none,kitty --class dropdown-terminal
bind = super+alt,f,toggle_named_scratchpad,^yazi-scratchpad$,none,kitty --class yazi-scratchpad -e yazi
bind = super+alt,a,toggle_named_scratchpad,^wiremix$,none,osc-wiremix
bind = super+alt,v,toggle_named_scratchpad,^clipse$,none,kitty --class clipse -e clipse
# Acil çıkış: pencere yanlışlıkla scratchpad'e dönüştüyse normalize et
bind = super+ctrl,Escape,unscratchpad

# ── Noctalia / shell IPC ─────────────────────────────────────────────────────
bind = super,space,spawn,osc-shell ipc call launcher toggle
bind = super,d,spawn,osc-shell ipc call control-center toggle
bind = super+ctrl,d,spawn,osc-shell ipc call settings toggle
bind = super+alt,s,spawn,osc-shell ipc call dash toggle overview
bind = super,n,spawn,osc-shell ipc call notifications toggleHistory
bind = super,v,spawn,copyq toggle
bind = super,b,spawn,osc-shell ipc call bar toggle
bind = super+shift,b,spawn,osc-shell ipc call dock toggle
bind = super+ctrl,b,spawn,osc-shell ipc call bar toggleAutoHide
bind = super,delete,spawn,osc-shell ipc call sessionMenu toggle
bind = super+shift,delete,spawn,osc-shell ipc call idleInhibitor toggle
bind = alt,space,spawn,osc-shell ipc call plugin:custom-commands toggle
bind = super+ctrl+shift,v,spawn,osc-shell ipc call plugin:clipper toggle
bind = alt,l,spawn,qs -c noctalia-shell ipc call lockScreen lock

# Wallpaper
bind = super,y,spawn,osc-shell ipc call wallpaper toggle
bind = super,w,spawn,osc-shell ipc call wallpaper next

# ── Media / system ───────────────────────────────────────────────────────────
bind = alt,e,spawn,osc-media spotify toggle
bind = alt+ctrl,n,spawn,osc-media spotify next
bind = alt+ctrl,b,spawn,osc-media spotify prev
bind = alt+ctrl,e,spawn,osc-media mpc toggle
bind = alt,i,spawn,osc-media browser toggle
bind = alt,u,spawn,osc-media mpv toggle
bind = super+ctrl,y,spawn,mpv-manager play-yt
bind = ctrl+alt,y,spawn,mpv-manager stick
bind = shift+alt,y,spawn,mpv-manager move
bind = super+ctrl,F11,spawn,mpv-manager save-yt
bind = super+ctrl,F12,spawn,mpv-manager wallpaper
bind = ctrl+alt,p,spawn,power-profile
bind = ctrl+alt,m,spawn,osc-wiremix
bind = NONE,F10,spawn,bluetooth_toggle
bind = alt,F12,spawn,osc-mullvad toggle --with-blocky
bind = super+alt,F12,spawn,osc-mullvad slot --hold recycle

# Volume / brightness / mic
bind = NONE,XF86AudioRaiseVolume,spawn,osc-shell ipc call volume increase
bind = NONE,XF86AudioLowerVolume,spawn,osc-shell ipc call volume decrease
bind = NONE,XF86AudioMute,spawn,osc-shell ipc call volume muteOutput
bind = NONE,XF86AudioMicMute,spawn,osc-shell ipc call volume muteInput
bind = NONE,XF86MonBrightnessUp,spawn,osc-shell ipc call brightness increase
bind = NONE,XF86MonBrightnessDown,spawn,osc-shell ipc call brightness decrease
bind = alt,a,spawn,osc-soundctl switch
bind = alt+ctrl,a,spawn,osc-soundctl switch-mic

# Screenshot — dispatch actions delegate to `margo-screenshot`
# (grim + slurp + wl-clipboard + optional swappy/satty editor).
#
#   Print            region → editor → file + clipboard
#   shift+Print      region → editor → file (no clipboard)
#   ctrl+Print       focused output → editor → file
#   alt+Print        focused window → editor → file
bind = NONE,Print,screenshot-region-ui
bind = shift,Print,screenshot-region
bind = ctrl,Print,screenshot
bind = alt,Print,screenshot-window

# ── Pencere yönetimi ─────────────────────────────────────────────────────────
# Kapat
bind = super,q,killclient
bind = alt,F4,killclient

# Focus (vim hjkl yön tuşları)
bind = super,h,focusdir,left
bind = super,l,focusdir,right
bind = super,k,focusdir,up
bind = super,j,focusdir,down
bind = super,Tab,focusstack,1
bind = super+shift,Tab,focusstack,-1
bind = super+ctrl,Tab,focuslast

# Pencere değiştir (move) — exchange_client iki pencerenin slot'unu takas eder
bind = super+shift,h,exchange_client,left
bind = super+shift,l,exchange_client,right
bind = super+shift,k,exchange_client,up
bind = super+shift,j,exchange_client,down

# Layout seçimi
bind = super,t,setlayout,tile
bind = super,m,setlayout,monocle
bind = super,s,setlayout,scroller
bind = super+ctrl,g,setlayout,grid
bind = super+ctrl,w,switch_layout
bind = super,r,switch_proportion_preset
bind = super+shift,r,set_proportion,0.500
bind = super,z,zoom

# Gap
bind = super+shift,g,togglegaps
bind = super+shift,minus,incgaps,-2
bind = super+shift,equal,incgaps,2

# Float / fullscreen / sticky
bind = super,f,togglefullscreen
bind = super,g,togglefloating
# Sticky: focused pencereyi mevcut monitörün TÜM tag'lerinde göster.
# Tekrar bas → eski tag mask'a geri dön. niri-float-sticky'nin compositor
# içine entegre versiyonu — harici daemon/script yok.
bind = super+ctrl,s,sticky_window

# Float taşı/yeniden boyutlandır (klavye, 40px adımlar)
bind = super+ctrl,h,movewin,-40,0
bind = super+ctrl,j,movewin,0,40
bind = super+ctrl,k,movewin,0,-40
bind = super+ctrl,l,movewin,40,0
bind = super+ctrl+shift,h,resizewin,-40,0
bind = super+ctrl+shift,j,resizewin,0,40
bind = super+ctrl+shift,k,resizewin,0,-40
bind = super+ctrl+shift,l,resizewin,40,0

# Float taşı/yeniden boyutlandır (mouse drag — mango/Hyprland pattern)
mousebind = super,lmb,moveresize,curmove
mousebind = super,rmb,moveresize,curresize

# Overview
bind = alt,Tab,toggleoverview

# ── Tag'ler (1-9) ────────────────────────────────────────────────────────────
# Tag bitmask: 1=tag1, 2=tag2, 4=tag3, 8=tag4, 16=tag5, 32=tag6, 64=tag7,
# 128=tag8, 256=tag9. 4294967295 (=u32::MAX) = tüm tag'ler.
# Aynı tag'a iki kere super+N → önceki tag'a dön (view_current_to_back=1).
bind = super,1,view,1
bind = super,2,view,2
bind = super,3,view,4
bind = super,4,view,8
bind = super,5,view,16
bind = super,6,view,32
bind = super,7,view,64
bind = super,8,view,128
bind = super,9,view,256
bind = super,0,view,4294967295

# Pencereyi tag'e taşı (sen kalırsın — dwm geleneği)
bind = super+shift,1,tag,1
bind = super+shift,2,tag,2
bind = super+shift,3,tag,4
bind = super+shift,4,tag,8
bind = super+shift,5,tag,16
bind = super+shift,6,tag,32
bind = super+shift,7,tag,64
bind = super+shift,8,tag,128
bind = super+shift,9,tag,256

# Pencereyi tag'e taşı + sen de oraya git (Hyprland tarzı follow)
bind = super+ctrl+shift,1,tagview,1
bind = super+ctrl+shift,2,tagview,2
bind = super+ctrl+shift,3,tagview,4
bind = super+ctrl+shift,4,tagview,8
bind = super+ctrl+shift,5,tagview,16
bind = super+ctrl+shift,6,tagview,32
bind = super+ctrl+shift,7,tagview,64
bind = super+ctrl+shift,8,tagview,128
bind = super+ctrl+shift,9,tagview,256

# Tag'i görünüme ekle/çıkar (toggle view — birden çok tag aynı anda)
bind = super+ctrl,1,toggleview,1
bind = super+ctrl,2,toggleview,2
bind = super+ctrl,3,toggleview,4
bind = super+ctrl,4,toggleview,8
bind = super+ctrl,5,toggleview,16
bind = super+ctrl,6,toggleview,32
bind = super+ctrl,7,toggleview,64
bind = super+ctrl,8,toggleview,128
bind = super+ctrl,9,toggleview,256

# ── Tag/monitor navigasyonu ──────────────────────────────────────────────────
bind = super,Page_Up,viewtoleft
bind = super,Page_Down,viewtoright
bind = super+ctrl,Page_Up,tagtoleft
bind = super+ctrl,Page_Down,tagtoright
# diğer monitöre focus geçir
bind = super,a,focusmon,1
# pencereyi diğer monitöre taşı (yukarı / aşağı yön etiketi sadece
# alışkanlık — `tagmon,-1` = mevcut listede önceki monitör)
bind = super+ctrl,Up,tagmon,-1
bind = super+ctrl,Down,tagmon,1

# ── Touchpad gesture'lar (Niri/Mango tarzı) ─────────────────────────────────
# Tag yönü dikey olduğu için: yatay swipe'lar pencereler arası, dikey swipe'lar
# tag'ler arası — uyum için focus/view yönlerini paralel kurdum.
# 3-finger
gesturebind = NONE,left,3,focusdir,left
gesturebind = NONE,right,3,focusdir,right
# 3-finger up/down → tag navigasyonu (yukarı = önceki, aşağı = sonraki)
gesturebind = NONE,up,3,viewtoleft
gesturebind = NONE,down,3,viewtoright
# 4-finger
gesturebind = NONE,left,4,viewtoleft
gesturebind = NONE,right,4,viewtoright
gesturebind = NONE,up,4,toggleoverview
gesturebind = NONE,down,4,toggleoverview

# Niri-style: super + scroll wheel → pencere fokus kaydır
axisbind = super,UP,focusdir,left
axisbind = super,DOWN,focusdir,right

# ── Sistem ───────────────────────────────────────────────────────────────────
# config'i hot-reload et (oturumu kapatmaya gerek yok)
bind = super+ctrl,r,reload_config
# session-lock kilitlendiyse acil çıkış (whitelist'lenmiş action — locked
# durumda bile tetiklenir)
bind = super+ctrl+alt,BackSpace,force_unlock
# margo'dan çık (TTY'ye düşer — UWSM session sonlanır)
bind = super+shift,q,quit

# managed by mlayout
source = mlayout.conf
