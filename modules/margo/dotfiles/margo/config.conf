# mplay — margo's native mpv helper (replaces the old margo-mpv.sh).
#   play=play a file/URL/clipboard (ytdl auto) · toggle=play/pause
#   pin=pin to all tags · snap=cycle corners · focus=focus the mpv window
#   stop=quit · download=YouTube → ~/Downloads
#   wallpaper start=clipboard/given video as wallpaper · wallpaper stop=stop
bind = super+ctrl,y,spawn,mplay play
bind = super+alt,y,spawn,mplay toggle
bind = ctrl+alt,y,spawn,mplay pin
bind = shift+alt,y,spawn,mplay snap
bind = super+ctrl+alt,y,spawn,mplay focus
bind = ctrl+shift,y,spawn,mplay stop
