    enabled: false
    delay_secs: 20
    trigger: LoginOnce
    args: ''
    working_dir: ''
  compact_rows: true
dock:
  icon_overrides:
  - class: Kenp
    icon: brave-browser
  - class: CompecTA
    icon: brave-browser
  - class: Ai
    icon: brave-browser
  - class: TmuxKenp
    icon: kitty
  - class: brave-youtube.com__-Default
    icon: youtube
  standalone: true
  style: popup
  behavior: toggle
pass:
  store_path: ~/.pass
alarm:
  alarms:
  - hour: 10
    minutes: 26
    name: test
    enabled: false
    repeat_mask: 0
login_network:
  enabled: true
  wifi_connection: Ken_5
  delay_secs: 6
bluetooth:
  autoconnect_enabled: true
  autoconnect_delay_secs: 10
  devices:
  - mac: F4:9D:8A:3D:CB:30
    name: SLP4
  - mac: E8:EE:CC:4D:29:00
    name: SL4
audio:
  hide_hdmi_outputs: true
  restore_volume_on_start: true
  default_output_volume: 30
  default_input_volume: 5
control_center:
  tile_order:
  - wifi
  - bluetooth
  - audio_out
  - mic
  - vpn
  - valent
  - battery
  - airplane_mode
  - night_light
  - keep_awake
  - ufw
  - podman
  - disk
  - dnd
  - dark_mode
  - color_picker
toasts:
  position: TopLeft
config_version: 3
