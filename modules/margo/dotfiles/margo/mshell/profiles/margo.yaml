    delay_secs: 16
    trigger: LoginOnce
    args: ''
    working_dir: ''
  - name: start-ferdium
    enabled: true
    delay_secs: 17
    trigger: LoginOnce
    args: ''
    working_dir: ''
  - name: tagwarp
