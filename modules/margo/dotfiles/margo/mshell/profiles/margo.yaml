general:
  clock_format_24_h: true
  weather_location_query:
    type: City
    name: Atasehir
    country: TR
  weather_saved_locations:
  - name: Home
    query:
      type: City
      name: Atasehir
      country: TR
  weather_poll_minutes: 180
  media_large_album_art: true
  settings_panel_width: 1440
  settings_panel_height: 1080
theme:
  icons:
    app_icon_theme: kora
  theme: Default
  apps:
    helium:
      enabled: true
      target_mode: all
      targets:
      - instance: Nil
        profile: Profile 3
        enabled: true
      - instance: Whats
        profile: Profile 4
        enabled: true
      - instance: helium-youtube.com__-Default
        profile: Default
        enabled: true
      - instance: spotify
        profile: Default
        enabled: true
      - instance: tiktok
        profile: Default
        enabled: true
      - instance: whatsapp
        profile: Default
        enabled: true
      - instance: Ai
        profile: Profile 2
        enabled: true
      - instance: CompecTA
        profile: Profile 1
        enabled: true
      - instance: Exclude
        profile: Default
        enabled: true
      - instance: Kenp
        profile: System Profile
        enabled: true
      - instance: Kenp
        profile: Profile 4
        enabled: true
  attributes:
    font:
      primary: Maple Mono NF
      secondary: Maple Mono NF
      tertiary: Maple Mono NF
      monospace: Maple Mono NF
    sizing:
      radius_widget: 12
      radius_window: 12
      bar_hover_strength: 32
      frame_color: '#1f1f2eff'
      frame_border_color: '#303345ff'
bars:
  widgets:
    system_update:
      check_interval_minutes: 720
      check_flatpak: false
    hidden_bars:
    - name: right
      widgets:
      - Network
      - Separator
      - CpuDashboard
      start_expanded: false
      auto_expand: true
      hover_delay_ms: 0
      auto_collapse: true
      collapse_delay_ms: 1000
    catwalk:
      minimum_threshold: 20
      size: 24
    privacy:
      hide_inactive: true
  top_bar:
    minimum_height: 36
    left_widgets:
    - MargoTags
    - Separator
    - MargoLayoutSwitcher
    - Separator
    - ActiveWindow
    - Separator
    - MediaPlayer
    center_widgets:
    - Catwalk
    - Separator
    - Weather
    - Separator
    - Mdash
    - Separator
    - Notifications
    - Separator
    - HiddenBar
    - Separator
    - Lyrics
    - VpnIndicator
    right_widgets:
    - !HiddenBarNamed right
    - Separator
    - AudioDashboard
    - Separator
    - Bluetooth
    - Separator
    - Valent
    - Separator
    - Clipboard
    - Separator
    - Vpn
    - Separator
    - Ufw
    - Separator
    - Power
    - Separator
    - ControlCenter
    - Privacy
    - Separator
    - Tray
    hidden_widgets:
    - Twilight
    - Screenshot
    - AlarmClock
    - KeepAwake
    - Notes
    - !Custom plugin:ambient-sound:ambient
    - !Custom plugin:breathing:breathing
    - !Custom plugin:musiclyrics:lyrics
    - SystemUpdate
    - Keybinds
    - Ai
    - Podman
  bottom_bar:
    enabled: false
    minimum_height: 28
    reveal_by_default: false
    left_widgets:
    - Separator
    - !Spacer 8
    - ActiveWindow
    center_widgets:
    - Separator
    - !Spacer 8
    - MediaPlayer
    - !Spacer 8
    - Separator
    right_widgets:
    - Power
    - !Spacer 8
    - Separator
    - Tray
    - Separator
menus:
  clipboard_menu:
    minimum_width: 720
    maximum_height: 1080
  notification_menu:
    minimum_width: 520
    maximum_height: 1200
  screenshot_menu:
    position: Top
  app_launcher_menu:
    position: Top
    minimum_width: 720
    maximum_height: 920
  screenshare_menu:
    position: Top
  dns_menu:
    widgets:
    - Dns
    - !Spacer
      size: 16
    - Ip
  vpn_menu:
    minimum_width: 520
  ai_menu:
    minimum_width: 640
    maximum_height: 1080
  notes_menu:
    position: Top
    minimum_width: 540
  bluetooth_menu:
    position: TopRight
  cpu_dashboard_menu:
    position: TopRight
  audio_dashboard_menu:
    position: TopRight
  keep_awake_menu:
    position: Top
    minimum_width: 450
  weather_menu:
    position: Top
    minimum_width: 680
    maximum_height: 780
  twilight_menu:
    position: Top
  keybinds_menu:
    minimum_width: 820
    maximum_height: 1440
  alarmclock_menu:
    position: Top
  control_center_menu:
    maximum_height: 1080
  media_player_menu:
    position: TopLeft
    minimum_width: 460
  session_menu:
    position: Bottom
  margo_layout_menu:
    position: TopLeft
notifications:
  group_notifications: false
wallpaper:
  wallpaper_dir: /home/kenan/Pictures/wallpapers/others
  rotation_enabled: true
  daily_wallpaper_source: nasa
idle:
  dim_timeout_minutes: 20
  lock_timeout_minutes: 25
session:
  suspend_command: systemctl suspend -i
  reboot_command: osc-safe-reboot
  shutdown_command: systemctl poweroff -i
clipboard:
  max_entries: 1000
