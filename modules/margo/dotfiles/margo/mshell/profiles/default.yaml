general:
  clock_format_24_h: true
  weather_location_query:
    type: Coordinates
    lat: 40.9974
    lon: 29.0989
  temperature_unit: Metric
  show_screen_corners: false
  screen_corner_radius: 24
  network_osd_enabled: false
theme:
  icons:
    shell_icon_theme: MargoMaterial
    app_icon_theme: kora
    apply_theme_filter: false
    filter_strength: 1.0
    monochrome_strength: 0.0
    contrast_strength: 1.0
  theme: Default
  matugen:
    preference: Darkness
    scheme_type: TonalSpot
    mode: Dark
    contrast: 0.0
  css_file: ''
  attributes:
    font:
      primary: Maple Mono NF
      secondary: Maple Mono NF
      tertiary: Maple Mono NF
    sizing:
      radius_widget: 8
      radius_window: 8
      border_width: 2
      settings_font_scale: 1.0
    window_opacity: 1.0
bars:
  frame:
    enable_frame: true
    monitor_filter: []
  widgets:
    quick_settings:
      icon: Arch
    system_update:
      check_interval_minutes: 180
  top_bar:
    minimum_height: 38
    reveal_by_default: true
    left_widgets:
    - MargoTags
    - MargoLayoutSwitcher
    - ActiveWindow
    - MediaPlayer
    center_widgets:
    - Dashboard
    - Notifications
    - KeepAwake
    right_widgets:
    - Nnetwork
    - CpuDashboard
    - RecordingIndicator
    - Screenshot
    - Wallpaper
    - Clipboard
    - AudioDashboard
    - Bluetooth
    - VpnIndicator
    - SystemUpdate
    - Nip
    - Nnotes
    - Npodman
    - Ndns
    - Nufw
    - Npower
    - Tray
  bottom_bar:
    minimum_height: 0
    reveal_by_default: false
    left_widgets: []
    center_widgets: []
    right_widgets: []
