  right_menu_expansion_type: AlwaysExpanded
notifications:
  notification_position: Right
wallpaper:
  wallpaper_dir: /home/kenan/Pictures/wallpapers/others
  content_fit: Cover
  apply_theme_filter: false
  theme_filter_strength: 1.0
  rotation_enabled: true
  rotation_interval_minutes: 5
  rotation_mode: Sequential
tempo:
  clock_format: '%a %d %b %H:%M'
  formats:
  - '%H:%M'
  - '%H:%M:%S'
  - '%a %d %b %H:%M'
  - '%d.%m.%Y %H:%M'
idle:
  dim_enabled: true
  dim_timeout_minutes: 15
  lock_enabled: true
  lock_timeout_minutes: 20
  suspend_enabled: true
  suspend_timeout_minutes: 30
session:
  lock_command: ''
  logout_command: ''
  suspend_command: systemctl suspend -i
  reboot_command: osc-safe-reboot
  shutdown_command: systemctl poweroff -i
clipboard:
  max_entries: 1000
  persist: FavoritesOnly
  clear_policy: Never
  clear_after_hours: 24
  skip_sensitive: true
  image_history: true
