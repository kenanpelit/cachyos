# Mesa 26.3.1 (2026-11-20) allocates mshell's thin surfaces (e.g. 3x1440) as 3-plane MTL CCS dmabufs whose
# plane 0 is smaller than stride*height; smithay's dmabuf check in margo rejects them
# ("Invalid stride (512) or height (1440) for plane 0"): GTK's Vulkan renderer then retries the lost surface
# at 100% CPU, the GL renderer dies with Wayland protocol error 71. Without CCS the buffers are single-plane
# and pass. margo itself stops offering these modifiers (dmabuf_ccs = 0, margo > r3275); remove this file once that
# margo-git is installed and the session restarted.
[Service]
Environment=INTEL_DEBUG=noccs
