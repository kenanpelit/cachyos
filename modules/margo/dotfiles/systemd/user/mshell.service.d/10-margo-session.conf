# margo session overlay. The mshell.service unit itself is owned by the
# margo package (/usr/lib/systemd/user/mshell.service) so package updates
# flow through; this drop-in only adds the session-specific ordering.
# PATH is inherited from the systemd user environment (already includes
# ~/.local/bin), so no Environment= override is needed here.
[Unit]
After=margo-shell-ensure.service
