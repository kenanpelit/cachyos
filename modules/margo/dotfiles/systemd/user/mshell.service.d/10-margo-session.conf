# margo session overlay. The mshell.service unit itself is owned by the
# margo package (/usr/lib/systemd/user/mshell.service) so package updates
# flow through; this drop-in is the anchor for any session-specific
# ordering. PATH is inherited from the systemd user environment (already
# includes ~/.local/bin), so no Environment= override is needed here.
#
# It previously ordered After=margo-shell-ensure.service — a legacy
# OkShell/Noctalia backend-ensure hook that's been removed; mshell now
# starts directly from its own dependencies, so no ordering is needed.
[Unit]
