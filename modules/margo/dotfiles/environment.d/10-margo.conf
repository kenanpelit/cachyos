# Canonical Margo session layer.
# Session identity lives in the UWSM wrapper + session init helpers.

EDITOR=nvim
VISUAL=nvim
TERMINAL=kitty

XDG_ICON_THEME=kora
ICON_THEME=kora
XCURSOR_THEME=capitaine-cursors
XCURSOR_SIZE=24

GTK_USE_PORTAL=1
XDG_CURRENT_DESKTOP=margo:mango
FONTCONFIG_FILE=/etc/fonts/fonts.conf
LIBVA_DRIVER_NAME=iHD
