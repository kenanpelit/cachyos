# Canonical Margo Wayland session layer (owned by the margo module).
# Merges the former shared wayland-env base (00-wayland.conf) with the
# Margo identity layer (10-margo.conf) into a single file. Loaded both by
# systemd --user (environment.d generator) and explicitly via the
# margo-session.envlist during the UWSM session sync.

# --- Session-global paths / defaults (systemd/dbus-activated apps, autostart) ---
PATH_CORE=/usr/local/bin:/usr/bin:/bin:/usr/local/sbin:${HOME}/.local/share/flatpak/exports/bin:/var/lib/flatpak/exports/bin:/usr/lib/jvm/default/bin:/usr/bin/site_perl:/usr/bin/vendor_perl:/usr/bin/core_perl
PATH_USER=${HOME}/.local/share/zinit/polaris/bin:${HOME}/.local/bin:${HOME}/bin:${HOME}/.iptv/bin:${HOME}/.local/share/go/bin
PATH=${HOME}/.local/share/zinit/polaris/bin:${HOME}/.local/bin:${HOME}/bin:${HOME}/.iptv/bin:/usr/local/bin:/usr/bin:/bin:/usr/local/sbin:${HOME}/.local/share/flatpak/exports/bin:/var/lib/flatpak/exports/bin:/usr/lib/jvm/default/bin:/usr/bin/site_perl:/usr/bin/vendor_perl:/usr/bin/core_perl:${HOME}/.local/share/go/bin
XDG_DATA_DIRS=${HOME}/.local/share/flatpak/exports/share:/var/lib/flatpak/exports/share:/usr/local/share:/usr/share
BROWSER=start-brave-kenp
CATPPUCCIN_FLAVOR=mocha

EDITOR=nvim
VISUAL=nvim
TERMINAL=kitty

# --- Cursor / icon theme ---
XCURSOR_THEME=capitaine-cursors
XCURSOR_SIZE=24
XDG_ICON_THEME=kora
ICON_THEME=kora

SSH_AUTH_SOCK=${XDG_RUNTIME_DIR}/gcr/ssh

# --- Wayland / toolkit backends ---
OZONE_PLATFORM=wayland
ELECTRON_OZONE_PLATFORM_HINT=auto

MOZ_ENABLE_WAYLAND=1
MOZ_WEBRENDER=1
# MOZ_USE_XINPUT2 is X11/XInput2-only. On Wayland-native Firefox it does nothing
# useful and triggers a touchpad bug: two-finger scrolling dies after a tab switch
# (Ctrl+Tab or 3-finger gesture) until the pointer moves — Mozilla bug #1743019.
# Re-enable ONLY if Firefox runs under X11/XWayland.
MOZ_CRASHREPORTER_DISABLE=1

SDL_VIDEODRIVER=wayland
CLUTTER_BACKEND=wayland

_JAVA_AWT_WM_NONREPARENTING=1

GTK_USE_PORTAL=1
FONTCONFIG_FILE=/etc/fonts/fonts.conf
LIBVA_DRIVER_NAME=iHD

# --- Margo session identity ---
# Also enforced defensively by margo-session-common.sh (margo_ensure_session_identity).
XDG_CURRENT_DESKTOP=margo
