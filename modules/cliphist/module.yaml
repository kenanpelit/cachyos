tags:
- cli
- tool
description: Clipboard history (cliphist) portable config
depends_on:
- base
dotfiles_sync: true
dotfiles:
- source: dotfiles/cliphist
  target: ~/.config/cliphist
- source: dotfiles/systemd/user/cliphist.service
  target: ~/.config/systemd/user/cliphist.service
post_install_hook: scripts/install.sh
post_hook_behavior: always
