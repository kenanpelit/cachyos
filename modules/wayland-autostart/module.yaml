tags:
- wm
- desktop
description: Shared Wayland autostart masks for systemd-managed applets
depends_on:
- base
post_install_hook: scripts/install.sh
post_hook_behavior: always
dotfiles:
- source: dotfiles/autostart/nm-applet.desktop
  target: ~/.config/autostart/nm-applet.desktop
- source: dotfiles/autostart/blueman.desktop
  target: ~/.config/autostart/blueman.desktop
- source: dotfiles/autostart/gnome-keyring-secrets.desktop
  target: ~/.config/autostart/gnome-keyring-secrets.desktop
- source: dotfiles/autostart/xapp-sn-watcher.desktop
  target: ~/.config/autostart/xapp-sn-watcher.desktop
