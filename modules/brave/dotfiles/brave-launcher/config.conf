# Brave Launcher Konfigürasyonu

# Brave komutu (auto sirasi: brave-origin -> brave-origin-beta -> brave-browser)
BRAVE_CMD="auto"

# Variant tercihi (ileri seviye override icin)
BRAVE_VARIANT_PREFERENCE="origin"

# Proxy ayarları
PROXY_HOST="127.0.0.1"
PROXY_PORT="4999"
PROXY_TYPE="socks5"

# Ek Brave bayrakları (boşlukla ayrılmış)
CUSTOM_FLAGS=""

# Varsayılan profil
DEFAULT_PROFILE="Default"

# Debug modu (true/false)
DEBUG_MODE=false
