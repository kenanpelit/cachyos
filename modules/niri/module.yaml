tags:
- wm
- desktop
description: Niri compositor config (portable config)
depends_on:
- base
- xdg-dirs
- scripts
- fonts
- wayland-autostart
dotfiles:
- source: dotfiles/niri/config.kdl
  target: ~/.config/niri/config.kdl
- source: dotfiles/autostart/org.kde.kdeconnect.daemon.desktop
  target: ~/.config/autostart/org.kde.kdeconnect.daemon.desktop
- source: dotfiles/autostart/snapper-tools-check.desktop
  target: ~/.config/autostart/snapper-tools-check.desktop
- source: dotfiles/environment.d/10-niri-env.conf
  target: ~/.config/environment.d/10-niri-env.conf
- source: dotfiles/systemd/user/geoclue-agent.service
  target: ~/.config/systemd/user/geoclue-agent.service
- source: dotfiles/systemd/user/geoclue-agent.timer
  target: ~/.config/systemd/user/geoclue-agent.timer
- source: dotfiles/autostart/geoclue-demo-agent.desktop
  target: ~/.config/autostart/geoclue-demo-agent.desktop
- source: dotfiles/systemd/user/niri-session.target
  target: ~/.config/systemd/user/niri-session.target
- source: dotfiles/systemd/user/niri-daemons.target
  target: ~/.config/systemd/user/niri-daemons.target
- source: dotfiles/systemd/user/niri.service.d/10-session-bootstrap.conf
  target: ~/.config/systemd/user/niri.service.d/10-session-bootstrap.conf
- source: dotfiles/systemd/user/niri.service.d/10-priority.conf
  target: ~/.config/systemd/user/niri.service.d/10-priority.conf
- source: dotfiles/systemd/user/niri-polkit-agent.service
  target: ~/.config/systemd/user/niri-polkit-agent.service
- source: dotfiles/systemd/user/niri-nm-applet.service
  target: ~/.config/systemd/user/niri-nm-applet.service
- source: dotfiles/systemd/user/niri-blueman-applet.service
  target: ~/.config/systemd/user/niri-blueman-applet.service
- source: dotfiles/systemd/user/niri-snapper-tools-check.service
  target: ~/.config/systemd/user/niri-snapper-tools-check.service
- source: dotfiles/systemd/user/niri-bootstrap.service
  target: ~/.config/systemd/user/niri-bootstrap.service
- source: dotfiles/systemd/user/niri-post-bootstrap.service
  target: ~/.config/systemd/user/niri-post-bootstrap.service
- source: dotfiles/systemd/user/niri-sticky.service
  target: ~/.config/systemd/user/niri-sticky.service
- source: dotfiles/systemd/user/niri-niriswitcher.service
  target: ~/.config/systemd/user/niri-niriswitcher.service
- source: dotfiles/systemd/user/ppp-auto-profile.service
  target: ~/.config/systemd/user/ppp-auto-profile.service
- source: dotfiles/systemd/user/ppp-auto-profile.timer
  target: ~/.config/systemd/user/ppp-auto-profile.timer
post_install_hook: scripts/ensure-runtime-files.sh
post_hook_behavior: always
