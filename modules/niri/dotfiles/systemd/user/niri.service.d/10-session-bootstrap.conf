[Service]
ExecStartPost=/usr/bin/bash -lc 'if [[ -x "$HOME/.local/bin/niri-session-init" ]]; then "$HOME/.local/bin/niri-session-init"; elif command -v niri-session-init >/dev/null 2>&1; then niri-session-init; elif [[ -x "$HOME/.local/bin/niri-osc" ]]; then "$HOME/.local/bin/niri-osc" set env; elif command -v niri-osc >/dev/null 2>&1; then niri-osc set env; else systemctl --user start --no-block niri-session.target >/dev/null 2>&1 || true; fi'
