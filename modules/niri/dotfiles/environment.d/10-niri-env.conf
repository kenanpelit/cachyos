# Niri Session Specific Environment
# Only variables required for Niri startup and specific toolkit behaviors.

XDG_CURRENT_DESKTOP=niri
XDG_SESSION_TYPE=wayland
XDG_SESSION_DESKTOP=niri
DESKTOP_SESSION=niri

# Session-global defaults for systemd/dbus-activated apps and autostart entries.
PATH=%h/.local/bin:%h/bin:/usr/local/bin:/usr/bin
BROWSER=start-helium-kenp

# Niri specific toolkit hints
MOZ_ENABLE_WAYLAND=1
ELECTRON_OZONE_PLATFORM_HINT=auto
GTK_USE_PORTAL=1

# Cursors and Icons (Centralized for Niri session)
XCURSOR_THEME=catppuccin-mocha-dark-cursors
XCURSOR_SIZE=24
XDG_ICON_THEME=kora

# Flatpak and native app visibility
XDG_DATA_DIRS=%h/.local/share/flatpak/exports/share:/var/lib/flatpak/exports/share:/usr/local/share:/usr/share
