[Unit]
ConditionEnvironment=XDG_CURRENT_DESKTOP=niri
After=niri-session.target
PartOf=niri-session.target

[Service]
# Stop any standalone sunsetr instance before systemd takes ownership.
ExecStartPre=-/usr/bin/sunsetr stop

# Repo-managed config lives in ~/.config/sunsetr and is symlinked at 0755.
ConfigurationDirectoryMode=0755
