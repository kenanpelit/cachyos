#[Backend]
backend = "auto"           # Let sunsetr pick the active Wayland backend automatically
transition_mode = "static" # Timer-driven presets are authoritative; root config is just fallback

#[Smoothing]
smoothing = true
startup_duration = 0.3
shutdown_duration = 0.3
adaptive_interval = 1

#[Time-based config]
night_temp = 2600          # Deepest Hyprsunset stage (04:00)
day_temp = 2600            # Lightest Hyprsunset stage (07:30)
night_gamma = 95           # Deepest Hyprsunset stage gamma
day_gamma = 95             # Lightest Hyprsunset stage gamma
update_interval = 60

#[Static config]
static_temp = 2600         # Default fallback; service rewrites this to the current preset at startup
static_gamma = 95

#[Manual transitions]
sunset = "13:00:00"        # First evening-oriented Hyprsunset anchor
sunrise = "13:00:00"       # First morning Hyprsunset anchor
transition_duration = 5

#[Geolocation]
latitude = 41.008200
longitude = 28.978400
