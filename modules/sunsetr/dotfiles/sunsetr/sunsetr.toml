#[Backend]
backend = "auto"         # Let sunsetr pick Hyprland/Niri-compatible backend automatically
transition_mode = "static" # Mirror the first/last Hyprsunset anchors as an envelope

#[Smoothing]
smoothing = true         # Enable smooth transitions during startup and exit
startup_duration = 0.3   # Duration of smooth startup in seconds (0.1-60 | 0 = instant)
shutdown_duration = 0.3  # Duration of smooth shutdown in seconds (0.1-60 | 0 = instant)
adaptive_interval = 1    # Adaptive interval base for smooth transitions (1-1000)ms

#[Time-based config]
night_temp = 2400        # Deepest Hyprsunset stage
day_temp = 2400          # Lightest Hyprsunset stage
night_gamma = 92         # Deepest Hyprsunset stage gamma
day_gamma = 92           # Lightest Hyprsunset stage gamma
update_interval = 60     # Update frequency during transitions in seconds (10-300)

#[Static config]
static_temp = 2400       # Default manual fallback matches the 07:30 Hyprsunset stage
static_gamma = 92        # Default manual fallback matches the 07:30 Hyprsunset stage

#[Manual transitions]
sunset = "18:30:00"      # First evening Hyprsunset step
sunrise = "18:30:00"     # First morning Hyprsunset step
transition_duration = 5 # Best-effort envelope, Hyprsunset itself handles the finer ladder

#[Geolocation]
latitude = 41.008200     # Geographic latitude (auto-detected on first run)
longitude = 28.978400    # Geographic longitude (use 'sunsetr geo' to change)
