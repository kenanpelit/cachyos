# Shared Hyprland session environment.
# This file is the single source of truth for static session env.

env=XDG_SESSION_TYPE,wayland
env=XDG_SESSION_DESKTOP,Hyprland
env=XDG_CURRENT_DESKTOP,Hyprland
env=DESKTOP_SESSION,Hyprland
env=GDK_BACKEND,wayland,x11
env=SDL_VIDEODRIVER,wayland
env=CLUTTER_BACKEND,wayland
env=OZONE_PLATFORM,wayland
env=HYPRLAND_LOG_WLR,1
env=HYPRLAND_NO_RT,1
env=HYPRLAND_NO_SD_NOTIFY,1
env=HYPRLAND_NO_WATCHDOG_WARNING,1
env=GTK_THEME,catppuccin-mocha-mauve-standard+default
env=GTK_USE_PORTAL,1
env=GTK_APPLICATION_PREFER_DARK_THEME,1
env=XDG_ICON_THEME,kora
env=GDK_SCALE,1
env=HYPRCURSOR_SIZE,24
env=XCURSOR_THEME,capitaine-cursors
env=XCURSOR_SIZE,24
env=QT_QPA_PLATFORM,wayland;xcb
env=QT_QPA_PLATFORMTHEME,gtk3
env=QT_QPA_PLATFORMTHEME_QT6,gtk3
env=QT_STYLE_OVERRIDE,kvantum
env=QT_AUTO_SCREEN_SCALE_FACTOR,1
env=QT_WAYLAND_DISABLE_WINDOWDECORATION,1
env=QT_WAYLAND_FORCE_DPI,96
env=MOZ_ENABLE_WAYLAND,1
env=MOZ_WEBRENDER,1
env=MOZ_USE_XINPUT2,1
env=MOZ_CRASHREPORTER_DISABLE,1
env=_JAVA_AWT_WM_NONREPARENTING,1
env=LIBVA_DRIVER_NAME,iHD
env=FONTCONFIG_FILE,/etc/fonts/fonts.conf
env=EDITOR,nvim
env=VISUAL,nvim
env=TERMINAL,kitty
env=BROWSER,start-helium-kenp
env=CATPPUCCIN_FLAVOR,mocha
env=CATPPUCCIN_ACCENT,mauve
