# Core compositor behavior

animations {
  enabled = true

  # Match MangoWM's feel: compact pop-in for windows, fade-led close, and
  # shorter vertical workspace travel without spring overshoot.
  bezier = mango, 0.46, 1, 0.29, 0.99
  bezier = mango_soft, 0.25, 1, 0.5, 1

  animation = global, 1, 5, default
  animation = border, 1, 2, mango_soft
  animation = windows, 1, 2, mango
  animation = windowsIn, 1, 2, mango, popin 94%
  animation = windowsOut, 1, 2, mango, popin 98%
  animation = windowsMove, 1, 2, mango
  animation = fade, 1, 2, mango
  animation = fadeIn, 1, 2, mango
  animation = fadeOut, 1, 2, mango_soft
  animation = fadeSwitch, 1, 2, mango_soft
  animation = fadeShadow, 1, 2, mango_soft
  animation = fadeDim, 1, 2, mango_soft
  animation = layers, 1, 3, mango
  animation = workspaces, 1, 3, mango, slidevert 18%
  animation = workspacesIn, 1, 3, mango, slidevert 18%
  animation = workspacesOut, 1, 3, mango, slidevert 18%
  animation = specialWorkspace, 1, 2, mango, fade
  animation = specialWorkspaceIn, 1, 2, mango, fade
  animation = specialWorkspaceOut, 1, 2, mango_soft, fade
  animation = fadeLayers, 1, 2, mango_soft
  animation = layersIn, 1, 3, mango, slide
  animation = layersOut, 1, 2, mango_soft, slide
  animation = fadeLayersIn, 1, 2, mango
  animation = fadeLayersOut, 1, 2, mango_soft
  animation = fadePopups, 1, 2, mango
  animation = fadePopupsIn, 1, 2, mango
  animation = fadePopupsOut, 1, 2, mango_soft
}

binds {
  allow_workspace_cycles=true
  focus_preferred_method=0
  ignore_group_lock=true
  movefocus_cycles_groupfirst=true
  pass_mouse_when_bound=true
  workspace_back_and_forth=true
  workspace_center_on=1
}

cursor {
  enable_hyprcursor=true
}

general {
  $mainMod=SUPER
  allow_tearing=false
  extend_border_grab_area=15
  float_gaps=8
  gaps_in=6
  gaps_out=6
  hover_icon_on_border=true
  layout=scrolling
  resize_on_border=true

  snap {
    border_overlap=false
    enabled=true
    monitor_gap=8
    respect_gaps=true
    window_gap=8
  }
}

gestures {
  workspace_swipe_cancel_ratio=0.300000
  workspace_swipe_create_new=true
  workspace_swipe_direction_lock=true
  workspace_swipe_direction_lock_threshold=15
  workspace_swipe_distance=300
  workspace_swipe_forever=true
  workspace_swipe_invert=true
  workspace_swipe_min_speed_to_force=20
  workspace_swipe_touch=false
  workspace_swipe_touch_invert=false
}

group {
  auto_group=false
  drag_into_group=2
}

misc {
  allow_session_lock_restore=true
  always_follow_on_dnd=true
  animate_manual_resizes=true
  animate_mouse_windowdragging=true
  close_special_on_empty=true
  disable_autoreload=false
  disable_hyprland_guiutils_check=true
  disable_hyprland_logo=true
  disable_splash_rendering=true
  enable_swallow=true
  focus_on_activate=false
  force_default_wallpaper=0
  initial_workspace_tracking=1
  key_press_enables_dpms=true
  layers_hog_keyboard_focus=true
  mouse_move_enables_dpms=true
  mouse_move_focuses_monitor=false
  render_unfocused_fps=10
  swallow_exception_regex=^(wev|Wayland-desktop|wl-clipboard)$
  swallow_regex=^(kitty|alacritty)$
  vrr=1
}

render {
  direct_scanout=2
  new_render_scheduling=true
  send_content_type=true
}

scrolling {
  fullscreen_on_one_column=false
  column_width=0.786
  direction=right
  explicit_column_widths=0.333,0.50,0.667,0.800,1.0
  focus_fit_method=0
  follow_focus=true
  follow_min_visible=0.55
}
