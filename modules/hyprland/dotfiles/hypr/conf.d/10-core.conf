# Core compositor behavior

animations {
  enabled = true

  # Niri-like spring definitions
  # spring = name, damping, stiffness, epsilon, initial_velocity
  # Note: Hyprland spring syntax: name, enabled, speed, damping, initial_velocity
  # Or use newer bezier/animation with spring-like behavior if native spring is not available
  # However, let's use high-quality bezier curves that mimic the niri feel if spring is risky,
  # but user asked for "niri-like feeling" which is mostly about the elastic spring.

  bezier = niri_wobble, 0.15, 1.15, 0.25, 1.0
  bezier = niri_fluid, 0.18, 0.96, 0.22, 1.0

  animation = windowsIn, 1, 4, niri_fluid, popin 80%
  animation = windowsOut, 1, 2, niri_fluid, popin 90%
  animation = windowsMove, 1, 4, niri_fluid
  animation = workspaces, 1, 5, niri_fluid, slidevert
  animation = specialWorkspace, 1, 5, niri_fluid, fade
  animation = fade, 1, 3, niri_fluid
}

binds {
  allow_workspace_cycles=true
  focus_preferred_method=0
  ignore_group_lock=true
  pass_mouse_when_bound=true
  workspace_back_and_forth=true
  workspace_center_on=1
}

cursor {
  enable_hyprcursor=true
}

dwindle {
  default_split_ratio=1.000000
  force_split=2
  preserve_split=true
  pseudotile=true
  special_scale_factor=0.800000
  split_width_multiplier=1.000000
  use_active_for_splits=true
}

general {
  $mainMod=SUPER
  allow_tearing=false
  extend_border_grab_area=15
  float_gaps=8
  gaps_in=4
  gaps_out=8
  hover_icon_on_border=true
  layout=scrolling
  resize_on_border=true

  snap {
    border_overlap=false
    enabled=true
    monitor_gap=8
    respect_gaps=true
    window_gap=8
  }
}

gestures {
  workspace_swipe_cancel_ratio=0.300000
  workspace_swipe_create_new=true
  workspace_swipe_direction_lock=true
  workspace_swipe_direction_lock_threshold=15
  workspace_swipe_distance=300
  workspace_swipe_forever=true
  workspace_swipe_invert=true
  workspace_swipe_min_speed_to_force=20
  workspace_swipe_touch=false
  workspace_swipe_touch_invert=false
}

master {
  allow_small_split=false
  drop_at_cursor=false
  mfact=0.600000
  new_on_active=after
  new_on_top=false
  new_status=slave
  orientation=left
  smart_resizing=true
  special_scale_factor=0.800000
}

misc {
  allow_session_lock_restore=true
  always_follow_on_dnd=true
  animate_manual_resizes=true
  animate_mouse_windowdragging=true
  close_special_on_empty=true
  disable_autoreload=false
  disable_hyprland_guiutils_check=true
  disable_hyprland_logo=true
  disable_splash_rendering=true
  enable_swallow=true
  focus_on_activate=false
  force_default_wallpaper=0
  initial_workspace_tracking=1
  key_press_enables_dpms=true
  layers_hog_keyboard_focus=true
  mouse_move_enables_dpms=true
  mouse_move_focuses_monitor=false
  render_unfocused_fps=10
  swallow_exception_regex=^(wev|Wayland-desktop|wl-clipboard)$
  swallow_regex=^(kitty|alacritty|wezterm)$
  vfr=true
  vrr=1
}

render {
  direct_scanout=2
  new_render_scheduling=true
  send_content_type=true
}

scrolling {
  fullscreen_on_one_column=false
  column_width=0.850000
  direction=right
  explicit_column_widths=0.38,0.50,0.62,0.75,0.85,1.0
  focus_fit_method=0
  follow_focus=true
  follow_min_visible=0.55
}
