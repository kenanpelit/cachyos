# Core compositor behavior

animations {
  enabled = true

  # Niri-like curves mapped from Niri's ease-out-expo and ease-out-quad
  bezier = niri_expo, 0.16, 1, 0.3, 1
  bezier = niri_quad, 0.25, 1, 0.5, 1
  # Spring-like curve for workspace transitions (damping 0.85, stiffness 500)
  bezier = niri_spring, 0.18, 0.96, 0.22, 1.0

  animation = global, 1, 8, default
  animation = border, 1, 3, niri_quad
  animation = windows, 1, 4, niri_spring
  animation = windowsIn, 1, 4, niri_expo, popin 80%
  animation = windowsOut, 1, 2, niri_quad, popin 90%
  animation = windowsMove, 1, 4, niri_spring
  animation = fade, 1, 3, niri_expo
  animation = fadeIn, 1, 4, niri_expo
  animation = fadeOut, 1, 2, niri_quad
  animation = fadeSwitch, 1, 3, niri_quad
  animation = fadeShadow, 1, 2, niri_quad
  animation = fadeDim, 1, 2, niri_quad
  animation = layers, 1, 3, niri_expo
  animation = workspaces, 1, 5, niri_spring, slidevert
  animation = workspacesIn, 1, 5, niri_spring, slidevert
  animation = workspacesOut, 1, 5, niri_spring, slidevert
  animation = specialWorkspace, 1, 5, niri_spring, fade
  animation = specialWorkspaceIn, 1, 5, niri_spring, fade
  animation = specialWorkspaceOut, 1, 5, niri_spring, fade
  animation = fadeLayers, 1, 3, niri_expo
  animation = layersIn, 1, 3, niri_expo, fade
  animation = layersOut, 1, 2, niri_quad, fade
  animation = fadeLayersIn, 1, 3, niri_expo
  animation = fadeLayersOut, 1, 2, niri_quad
  animation = fadePopups, 1, 3, niri_expo
  animation = fadePopupsIn, 1, 3, niri_expo
  animation = fadePopupsOut, 1, 2, niri_quad
}

binds {
  allow_workspace_cycles=true
  focus_preferred_method=0
  ignore_group_lock=true
  movefocus_cycles_groupfirst=true
  pass_mouse_when_bound=true
  workspace_back_and_forth=true
  workspace_center_on=1
}

cursor {
  enable_hyprcursor=true
}

general {
  $mainMod=SUPER
  allow_tearing=false
  extend_border_grab_area=15
  float_gaps=8
  gaps_in=6
  gaps_out=6
  hover_icon_on_border=true
  layout=scrolling
  resize_on_border=true

  snap {
    border_overlap=false
    enabled=true
    monitor_gap=8
    respect_gaps=true
    window_gap=8
  }
}

gestures {
  workspace_swipe_cancel_ratio=0.300000
  workspace_swipe_create_new=true
  workspace_swipe_direction_lock=true
  workspace_swipe_direction_lock_threshold=15
  workspace_swipe_distance=300
  workspace_swipe_forever=true
  workspace_swipe_invert=true
  workspace_swipe_min_speed_to_force=20
  workspace_swipe_touch=false
  workspace_swipe_touch_invert=false
}

group {
  auto_group=false
  drag_into_group=2
}

misc {
  allow_session_lock_restore=true
  always_follow_on_dnd=true
  animate_manual_resizes=true
  animate_mouse_windowdragging=true
  close_special_on_empty=true
  disable_autoreload=false
  disable_hyprland_guiutils_check=true
  disable_hyprland_logo=true
  disable_splash_rendering=true
  enable_swallow=true
  focus_on_activate=false
  force_default_wallpaper=0
  initial_workspace_tracking=1
  key_press_enables_dpms=true
  layers_hog_keyboard_focus=true
  mouse_move_enables_dpms=true
  mouse_move_focuses_monitor=false
  render_unfocused_fps=10
  swallow_exception_regex=^(wev|Wayland-desktop|wl-clipboard)$
  swallow_regex=^(kitty|alacritty)$
  vfr=true
  vrr=1
}

render {
  direct_scanout=2
  new_render_scheduling=true
  send_content_type=true
}

scrolling {
  fullscreen_on_one_column=false
  column_width=0.786
  direction=right
  explicit_column_widths=0.50,0.618,0.786,0.900,1.0
  focus_fit_method=0
  follow_focus=true
  follow_min_visible=0.55
}
