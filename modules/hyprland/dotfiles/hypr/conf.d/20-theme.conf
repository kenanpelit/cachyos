# Theme palette and visual assignments

$gtkTheme = catppuccin-mocha-mauve-standard+default
$catppuccinFlavor = mocha
$catppuccinAccent = mauve

$rosewater = rgb(f5e0dc)
$rosewaterAlpha = f5e0dc

$flamingo = rgb(f2cdcd)
$flamingoAlpha = f2cdcd

$pink = rgb(f5c2e7)
$pinkAlpha = f5c2e7

$mauve = rgb(cba6f7)
$mauveAlpha = cba6f7

$red = rgb(f38ba8)
$redAlpha = f38ba8

$maroon = rgb(eba0ac)
$maroonAlpha = eba0ac

$peach = rgb(fab387)
$peachAlpha = fab387

$yellow = rgb(f9e2af)
$yellowAlpha = f9e2af

$green = rgb(a6e3a1)
$greenAlpha = a6e3a1

$teal = rgb(94e2d5)
$tealAlpha = 94e2d5

$sky = rgb(89dceb)
$skyAlpha = 89dceb

$sapphire = rgb(74c7ec)
$sapphireAlpha = 74c7ec

$blue = rgb(89b4fa)
$blueAlpha = 89b4fa

$lavender = rgb(b4befe)
$lavenderAlpha = b4befe

$text = rgb(cdd6f4)
$textAlpha = cdd6f4

$subtext1 = rgb(bac2de)
$subtext1Alpha = bac2de

$subtext0 = rgb(a6adc8)
$subtext0Alpha = a6adc8

$overlay2 = rgb(9399b2)
$overlay2Alpha = 9399b2

$overlay1 = rgb(7f849c)
$overlay1Alpha = 7f849c

$overlay0 = rgb(6c7086)
$overlay0Alpha = 6c7086

$surface2 = rgb(585b70)
$surface2Alpha = 585b70

$surface1 = rgb(45475a)
$surface1Alpha = 45475a

$surface0 = rgb(313244)
$surface0Alpha = 313244

$base = rgb(1e1e2e)
$baseAlpha = 1e1e2e

$mantle = rgb(181825)
$mantleAlpha = 181825

$crust = rgb(11111b)
$crustAlpha = 11111b

$accent = $mauve
$accentAlpha = $mauveAlpha
$highlight = rgb(00bcd4)
$highlightAlpha = 00bcd4
$themeBorderSize = 2
$themeRounding = 8
$themeFloatingRounding = 10

general {
  border_size=$themeBorderSize
  col.active_border=rgba($highlightAlphaff) rgba($accentAlphaff) 45deg
  col.inactive_border=rgba($surface1Alphaff)
}

decoration {
  blur {
    enabled=true
    ignore_opacity=true
    new_optimizations=true
    passes=2
    popups=true
    popups_ignorealpha=0.2
    size=9
    special=false
    vibrancy=0.155
    vibrancy_darkness=0.0
    xray=true
  }

  shadow {
    color=0x66000000
    enabled=true
    ignore_window=true
    offset=0 4
    range=27
    render_power=4
    scale=0.975
  }

  active_opacity=1.0
  dim_inactive=true
  dim_strength=0.12
  fullscreen_opacity=1.0
  inactive_opacity=0.88
  rounding=$themeRounding
}

group {
  groupbar {
    col.active=rgba($blueAlphaed)
    col.inactive=rgba($overlay0Alphaa8)
    col.locked_active=rgba($accentAlphaed)
    col.locked_inactive=rgba($surface1Alphaa8)
    font_size=10
    gradients=false
    render_titles=false
  }
  col.border_active=rgba($highlightAlphaff) rgba($accentAlphaff) 45deg
  col.border_inactive=rgba($surface1Alphaa8) rgba($overlay0Alphaa8) 45deg
  col.border_locked_active=rgba($highlightAlphaff) rgba($accentAlphaff) 45deg
  col.border_locked_inactive=rgba($surface1Alphaa8) rgba($overlay0Alphaa8) 45deg
}

misc {
  background_color=rgba($baseAlphaff)
}

# Workspace chrome exceptions
workspace=f[1], gapsout:0, gapsin:0, rounding:0, shadow:0
workspace=special:dropdown, gapsout:0, gapsin:0, bordersize:0, rounding:0, shadow:0
workspace=special:scratchpad, gapsout:0, gapsin:0, bordersize:0, rounding:0, shadow:0
