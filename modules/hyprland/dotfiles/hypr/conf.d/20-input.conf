# Input devices

input {
  touchpad {
    clickfinger_behavior=true
    disable_while_typing=true
    drag_lock=true
    middle_button_emulation=true
    natural_scroll=false
    scroll_factor=1.000000
    tap-and-drag=true
    tap-to-click=true
  }
  accel_profile=adaptive
  float_switch_override_focus=2
  follow_mouse=1
  # Keep acceleration enabled globally and override per-device where needed.
  force_no_accel=false
  kb_layout=tr
  kb_options=ctrl:nocaps
  kb_variant=f
  left_handed=false
  numlock_by_default=false
  repeat_delay=250
  repeat_rate=35
  scroll_factor=1.000000
  sensitivity=1.000000
}

# Host-specific device tuning for ThinkPad E14 input stack.
device {
  name=ELAN06C6:00 04F3:3193 Touchpad
  accel_profile=adaptive
  sensitivity=1.000000
}

device {
  name=ELAN06C6:00 04F3:3193 Mouse
  accel_profile=adaptive
  sensitivity=0.350000
}

device {
  name=TPPS/2 Elan TrackPoint
  accel_profile=adaptive
  sensitivity=0.550000
}
