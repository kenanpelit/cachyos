# Dialog and transient window rules

windowrule {
  name=branch-dialog
  float=true
  match:initial_title=^(branchdialog)$
}

windowrule {
  name=file-progress-dialog
  float=true
  match:class=^(file_progress)$
}

windowrule {
  name=confirm-dialog
  float=true
  match:class=^(confirm)$
}

windowrule {
  name=dialog-generic
  float=true
  match:class=^(dialog)$
}

windowrule {
  name=download-dialog
  float=true
  match:class=^(download)$
}

windowrule {
  name=notification-dialog
  float=true
  match:class=^(notification)$
}

windowrule {
  name=error-dialog
  float=true
  match:class=^(error)$
}

windowrule {
  name=confirmreset-dialog
  float=true
  match:class=^(confirmreset)$
}
