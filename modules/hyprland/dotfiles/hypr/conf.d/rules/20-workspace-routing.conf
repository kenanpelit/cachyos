# Static workspace placement.
# Monitor ownership and persistence stay in 70-monitors.conf.

windowrule = match:class ^(vlc)$, workspace 6 silent
windowrule = match:class ^(audacious|Audacious)$, workspace 5 silent
windowrule = match:class ^(Discord)$, workspace 5 silent
windowrule = match:class ^(WebCord)$, workspace 5
windowrule = match:class ^(discord)$, workspace 5 silent
windowrule = match:class ^(Brave-browser)$, match:initial_title ^(web.whatsapp.com)$, workspace 9 silent
windowrule = match:initial_title ^(web.whatsapp.com)$, workspace 9 silent
windowrule = match:class ^(Ferdium|ferdium)$, workspace 9 silent
windowrule = match:initial_title ^(Meet).*$, workspace 4
windowrule = match:class ^(Vncviewer)$, match:initial_title ^(.*TigerVNC)$, workspace 6
windowrule = match:class ^(evince)$, workspace 3
windowrule = match:initial_title ^(New Private Tab - Brave)$, workspace 6 silent
windowrule = match:class ^(Kenp)$, workspace 1 silent
windowrule = match:initial_title ^Kenp Browser (Inkognito)$, workspace 6 silent
windowrule = match:class ^((brave|chrome)-youtube\.com__-Default)$, workspace 7 silent
windowrule = match:class ^(Brave-browser)$, match:initial_title ^(Spotify - Web Player).*, workspace 8 silent
windowrule = match:class ^(Tmux)$, match:initial_title ^(Tmux)$, workspace 2 silent
windowrule = match:class ^(kitty|org.wezfurlong.wezterm)$, match:initial_title ^(Tmux)$, workspace 2 silent
windowrule = match:class ^(TmuxKenp)$, workspace 2 silent
windowrule = match:class ^(Ai)$, workspace 3 silent
windowrule = match:class ^(CompecTA)$, workspace 4 silent
windowrule = match:initial_title ^(compecta)$, workspace 4 silent
windowrule = match:class ^(org.telegram.desktop)$, workspace 6 silent
windowrule = match:class ^(com.rtosta.zapzap|zapzap)$, workspace 9 silent
windowrule = match:class ^(remote-viewer)$, workspace 6 silent
windowrule = match:class ^(org.keepassxc.KeePassXC)$, workspace 7 silent
windowrule = match:class ^(transmission|com.transmissionbt.transmission.*)$, workspace 7 silent
windowrule = match:class ^(Spotify|spotify|com.spotify.Client)$, workspace 8 silent
windowrule = match:class ^(qemu-system-x86_64)$, workspace 6 silent
windowrule = match:class ^(qemu)$, workspace 6 silent
