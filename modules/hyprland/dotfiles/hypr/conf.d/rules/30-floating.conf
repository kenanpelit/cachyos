# Floating, utility, and app-specific layout rules

windowrule {
  name=imv-float
  center=true
  float=true
  match:class=^(imv)$
  persistent_size=true
  size=1200 725
}

windowrule {
  name=imv-opacity
  match:class=^(imv)$
  opacity=1.0 override 1.0 override
}

windowrule {
  name=pip-window
  float=true
  match:initial_title=(?i)^picture[- ]in[- ]picture$
  move=(monitor_w-640-32) 96
  opacity=1.0 override 1.0 override
  persistent_size=true
  size=640 360
}

windowrule {
  name=discord-lowercase
  match:class=^(discord)$
  tile=true
}

windowrule {
  name=webcord-link-warning
  center=true
  float=true
  match:class=^(WebCord)$
  match:initial_title=^(Warning: Opening link in external app)$
}

windowrule {
  name=discord-blob
  center=true
  float=true
  match:initial_title=^(blob:https://discord.com).*$
}

windowrule {
  name=google-meet
  center=true
  float=true
  match:initial_title=^(Meet).*$
  persistent_size=true
  size=918 558
}

windowrule {
  name=htop-float
  center=true
  float=true
  match:class=^(htop)$
  persistent_size=true
  size=(monitor_w*0.80) (monitor_h*0.80)
}

windowrule {
  name=yazi-float
  center=true
  float=true
  match:class=^(yazi)$
  persistent_size=true
  size=1920 1080
}

windowrule {
  name=vnc-float
  center=true
  float=true
  match:class=^(Vncviewer)$
  persistent_size=true
}

windowrule {
  name=vnc-fullscreen
  fullscreen=true
  match:class=^(Vncviewer)$
  match:initial_title=^(.*TigerVNC)$
}

windowrule {
  name=evince-workspace
  match:class=^(evince)$
  opacity=1.0 override 1.0 override
}

windowrule {
  name=rofi-pin
  match:class=^(rofi)$
  pin=true
}

windowrule {
  name=dropdown-terminal
  float=true
  match:class=^(dropdown|dropdown-terminal)$
  move=(monitor_w*0.10) 20
  persistent_size=true
  size=(monitor_w*0.80) 600
  workspace=special:dropdown
}

windowrule {
  name=scratchpad-float
  center=true
  float=true
  match:class=^(scratchpad)$
}

windowrule {
  name=kitty-scratch-float
  center=true
  float=true
  match:class=^(kitty-scratch)$
  persistent_size=true
  size=(monitor_w*0.75) (monitor_h*0.60)
}

windowrule {
  name=transmission-float
  float=true
  match:initial_title=^(Transmission)$
  persistent_size=true
}

windowrule {
  name=polkit-agent
  center=true
  float=true
  match:class=^(polkit-gnome-authentication-agent-1)$
  size=520 240
}

windowrule {
  name=gcr-prompter
  float=true
  match:class=^(gcr-prompter)$
  move=(monitor_w*0.5-300) 96
  size=600 230
}

windowrule {
  name=sidepanel-utils
  float=true
  match:class=^(clipse|clipse-gui|wiremix|org.pulseaudio.pavucontrol|pavucontrol|io.ente.auth|com.github.hluk.copyq|copyq)$
  move=(monitor_w*0.75-32) 144
  persistent_size=true
  size=(monitor_w*0.25) (monitor_h*0.80)
}

windowrule {
  name=calculator
  float=true
  match:class=^(org.gnome.Calculator|kcalc)$
  move=(monitor_w*0.5-200) 100
  persistent_size=true
  size=400 600
}

windowrule {
  name=decibels
  float=true
  match:class=^(org.gnome.Decibels)$
  move=(monitor_w-640-32) 96
  opacity=0.5 0.5
  persistent_size=true
  size=640 360
}

windowrule {
  name=hyprland-share-picker
  center=true
  float=true
  match:class=^(hyprland-share-picker)$
}

windowrule {
  name=quickshell-float
  float=true
  match:class=^(org.quickshell)$
}

windowrule {
  name=volume-control-float
  float=true
  match:initial_title=^(Volume Control)$
  move=40 55%
  persistent_size=true
  size=700 450
}

windowrule {
  name=nm-connection-editor
  center=true
  float=true
  match:class=^(blueman-manager|nm-connection-editor|org.gnome.Settings|gnome-disks)$
  persistent_size=true
  size=900 650
}

windowrule {
  name=nm-applet-float
  center=true
  float=true
  match:class=^(nm-applet)$
  persistent_size=true
  size=360 440
}

windowrule {
  name=firefox-sharing-indicator
  float=true
  match:initial_title=^(Firefox — Sharing Indicator)$
  move=0 0
}

windowrule {
  name=firefox-idle-inhibit
  idle_inhibit=fullscreen
  match:class=^(firefox)$
  match:fullscreen=true
}

windowrule {
  name=file-dialogs
  center=true
  float=true
  match:initial_title=^(Open File|File Upload|Save As|Confirm to replace files|File Operation Progress|Extract archive|Compress\.\.\.)$
  persistent_size=true
  size=(monitor_w*0.60) (monitor_h*0.75)
}

windowrule {
  name=kenp-save-file
  center=true
  float=true
  match:class=^(Kenp)$
  match:initial_title=^(Save File)$
  persistent_size=true
  size=1280 933
}
