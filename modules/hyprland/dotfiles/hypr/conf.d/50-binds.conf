# Key bindings

# Core focus and navigation
bind=$mainMod, left, exec, ~/.local/bin/hypr-scroll focus l
bind=$mainMod, right, exec, ~/.local/bin/hypr-scroll focus r
bind=$mainMod, up, workspace, e-1
bind=$mainMod, down, workspace, e+1
bind=$mainMod, h, exec, ~/.local/bin/hypr-scroll focus l
bind=$mainMod, l, exec, ~/.local/bin/hypr-scroll focus r
bind=$mainMod, k, workspace, e-1
bind=$mainMod, j, workspace, e+1
bind=$mainMod CTRL, K, movefocus, u
bind=$mainMod CTRL, J, movefocus, d
bind=$mainMod SHIFT, left, exec, ~/.local/bin/hypr-scroll swapcol l
bind=$mainMod SHIFT, right, exec, ~/.local/bin/hypr-scroll swapcol r
bind=$mainMod SHIFT, up, exec, ~/.local/bin/hypr-scroll movewindowto u
bind=$mainMod SHIFT, down, exec, ~/.local/bin/hypr-scroll movewindowto d
bind=$mainMod SHIFT, h, exec, ~/.local/bin/hypr-scroll swapcol l
bind=$mainMod SHIFT, l, exec, ~/.local/bin/hypr-scroll swapcol r
bind=$mainMod SHIFT, k, exec, ~/.local/bin/hypr-scroll movewindowto u
bind=$mainMod SHIFT, j, exec, ~/.local/bin/hypr-scroll movewindowto d

# Window actions
bind=$mainMod, Q, killactive
bind=$mainMod, F, fullscreen, 0
bind=$mainMod, M, exec, ~/.local/bin/hypr-osc maximize-column
bind=$mainMod, C, exec, ~/.local/bin/hypr-scroll togglefit

# Column sizing and layout tweaks
bind=$mainMod, R, exec, ~/.local/bin/hypr-scroll colresize +conf
bind=$mainMod SHIFT, R, exec, ~/.local/bin/hypr-scroll colresize 0.85
bind=$mainMod, 0, exec, ~/.local/bin/hypr-scroll colresize 0.5
bind=$mainMod SHIFT, 0, exec, ~/.local/bin/hypr-scroll colresize 0.7
bind=$mainMod CTRL, 0, exec, ~/.local/bin/hypr-scroll colresize 1.0
bind=$mainMod, minus, exec, ~/.local/bin/hypr-scroll colresize -0.05
bind=$mainMod, equal, exec, ~/.local/bin/hypr-scroll colresize +0.05
bind=$mainMod SHIFT, minus, resizeactive, 0 -50
bind=$mainMod SHIFT, equal, resizeactive, 0 50

# Float, group, zen, pin, opacity, overview
bind=ALT, G, exec, ~/.local/bin/hypr-osc maximize-window-to-edges
bind=$mainMod CTRL, W, togglegroup
bind=$mainMod, G, exec, ~/.local/bin/hypr-osc toggle-float
bind=$mainMod CTRL, BackSpace, exec, ~/.local/bin/hypr-osc focus-float-tile
bind=$mainMod, Z, exec, ~/.local/bin/hypr-osc zen
bind=$mainMod, P, exec, ~/.local/bin/hypr-osc pin
bind=$mainMod ALT, O, exec, ~/.local/bin/hypr-expo toggle
bind=$mainMod CTRL, left, exec, ~/.local/bin/hypr-osc consume-or-expel left
bind=$mainMod CTRL, right, exec, ~/.local/bin/hypr-osc consume-or-expel right
bind=$mainMod CTRL, h, exec, ~/.local/bin/hypr-osc consume-or-expel left
bind=$mainMod CTRL, l, exec, ~/.local/bin/hypr-osc consume-or-expel right
bind=$mainMod, O, exec, ~/.local/bin/hypr-osc opacity toggle
bind=$mainMod SHIFT, mouse_down, exec, ~/.local/bin/hypr-osc opacity -0.1
bind=$mainMod SHIFT, mouse_up, exec, ~/.local/bin/hypr-osc opacity +0.1

# Shell router launchers
bind=$mainMod, Space, exec, ~/.local/bin/osc-shell ipc call launcher toggle
bind=$mainMod SHIFT, Space, exec, ~/.local/bin/osc-shell ipc call launcher command
bind=$mainMod, V, exec, copyq toggle
bind=$mainMod SHIFT, V, exec, osc-clipview
bind=$mainMod, D, exec, ~/.local/bin/osc-shell ipc call control-center toggle
bind=$mainMod CTRL, D, exec, ~/.local/bin/osc-shell ipc call settings toggle
bind=$mainMod ALT, D, exec, ~/.local/bin/osc-shell ipc call dash toggle overview
bind=$mainMod SHIFT, D, exec, ~/.local/bin/osc-shell ipc call launcher windows
bind=$mainMod CTRL SHIFT, D, exec, uwsm app -- kitty --class hypr-doctor -e bash -lc '~/.local/bin/hypr-osc doctor; echo; read -n 1 -s -r -p "Press any key to close"'
bind=$mainMod SHIFT, P, exec, ~/.local/bin/osc-shell ipc call systemMonitor toggle
bind=$mainMod, N, exec, ~/.local/bin/osc-shell ipc call notifications toggleHistory
bind=$mainMod CTRL, N, exec, ~/.local/bin/osc-shell ipc call plugin:notes togglePanel
bind=$mainMod, comma, exec, ~/.local/bin/osc-shell ipc call settings toggle

# Shell UI and session
bind=$mainMod, Tab, focuscurrentorlast
bind=$mainMod SHIFT, Tab, focuscurrentorlast
bind=ALT, Tab, exec, ~/.local/bin/osc-shell ipc call launcher windows
bind=$mainMod, B, exec, ~/.local/bin/osc-shell ipc call bar toggle
bind=$mainMod SHIFT, B, exec, ~/.local/bin/osc-shell ipc call dock toggle
bind=$mainMod CTRL, B, exec, ~/.local/bin/osc-shell ipc call bar toggleAutoHide
bind=$mainMod, Delete, exec, ~/.local/bin/osc-shell ipc call sessionMenu toggle
bind=ALT, L, exec, ~/.local/bin/osc-shell ipc call lockScreen lock
bind=$mainMod SHIFT, Delete, exec, ~/.local/bin/osc-shell ipc call idleInhibitor toggle
bind=$mainMod, Y, exec, ~/.local/bin/osc-shell ipc call wallpaper toggle
bind=$mainMod, U, exec, ~/.local/bin/osc-shell ipc call plugin:assistant-panel toggle
bind=$mainMod, W, exec, ~/.local/bin/osc-shell ipc call wallpaper next
bind=$mainMod SHIFT, W, exec, ~/.local/bin/osc-shell ipc call wallpaper prev
bind=$mainMod SHIFT, T, exec, ~/.local/bin/osc-shell ipc call darkMode toggle
bind=$mainMod SHIFT, N, exec, ~/.local/bin/osc-shell ipc call nightLight toggle
bind=$mainMod ALT, Slash, exec, ~/.local/bin/osc-shell ipc call plugin:keybind-cheatsheet toggle
bind=$mainMod, F1, exec, ~/.local/bin/osc-shell ipc call plugin:keybind-cheatsheet toggle
bind=ALT, F1, exec, ~/.local/bin/osc-shell ipc call plugin:keybind-cheatsheet toggle

# Media and system controls
bind=ALT, A, exec, ~/.local/bin/osc-soundctl switch
bind=ALT CTRL, A, exec, ~/.local/bin/osc-soundctl switch-mic
bind=ALT, E, exec, ~/.local/bin/osc-spotify
bind=ALT CTRL, N, exec, ~/.local/bin/osc-spotify next
bind=ALT CTRL, B, exec, ~/.local/bin/osc-spotify prev
bind=ALT CTRL, E, exec, ~/.local/bin/mpc-control toggle
bind=ALT, I, exec, ~/.local/bin/hypr-osc vlc-toggle
bind=$mainMod SHIFT, C, exec, hyprpicker -a
bind=$mainMod CTRL, V, exec, ~/.local/bin/osc-shell ipc call plugin:clipper toggle
bind=$mainMod ALT, V, exec, uwsm app -- kitty --class clipse -e clipse
bind=, F10, exec, ~/.local/bin/bluetooth_toggle
bind=ALT, F12, exec, ~/.local/bin/osc-mullvad toggle --with-blocky
bind=$mainMod ALT, F12, exec, ~/.local/bin/osc-mullvad-slot
bind=CTRL ALT, P, exec, ~/.local/bin/power-profile
bind=CTRL ALT, M, exec, ~/.local/bin/osc-wiremix

# Screenshots and reload
bind=, Print, exec, ~/.local/bin/screenshot rec
bind=CTRL, Print, exec, ~/.local/bin/screenshot si
bind=ALT, Print, exec, ~/.local/bin/screenshot wi
bind=$mainMod CTRL ALT, R, exec, hyprctl reload
bind=$mainMod CTRL ALT, S, exec, ~/.local/bin/hypr-session-init --no-start-target
bind=$mainMod CTRL ALT, D, exec, uwsm app -- kitty --class hypr-doctor -e bash -lc '~/.local/bin/hypr-osc doctor; echo; read -n 1 -s -r -p "Press any key to close"'

# App launchers
bind=ALT, T, exec, uwsm app -- ~/.local/bin/start-kkenp
bind=$mainMod ALT, Return, exec, ~/.local/bin/semsumo-daily
bind=ALT, N, exec, uwsm app -- anotes
bind=$mainMod SHIFT, A, exec, ~/.local/bin/hypr-osc arrange-windows
bind=$mainMod, Return, exec, ~/.local/bin/osc-ndrop --hypr-hide-special dropdown kitty --class dropdown
bind=Alt, Space, exec, uwsm app -- ~/.local/bin/rofi-launcher
bind=$mainMod CTRL, F, exec, uwsm app -- env GTK_THEME=$gtkTheme nemo
bind=ALT CTRL, F, exec, uwsm app -- kitty -e yazi
bind=$mainMod, T, exec, uwsm app -- kitty

# Smart focus and pull
bind=$mainMod ALT, T, exec, ~/.local/bin/hypr-osc smart-focus kitty
bind=$mainMod ALT, B, exec, ~/.local/bin/hypr-osc smart-focus brave
bind=$mainMod ALT, M, exec, ~/.local/bin/hypr-osc smart-focus spotify
bind=$mainMod ALT, N, exec, ~/.local/bin/hypr-osc smart-focus anotes
bind=$mainMod ALT SHIFT, T, exec, ~/.local/bin/hypr-osc pull-window kitty
bind=$mainMod ALT SHIFT, B, exec, ~/.local/bin/hypr-osc pull-window brave
bind=$mainMod ALT SHIFT, M, exec, ~/.local/bin/hypr-osc pull-window spotify
bind=$mainMod ALT SHIFT, N, exec, ~/.local/bin/hypr-osc pull-window anotes

# Scratchpad
bind=$mainMod, BackSpace, movetoworkspace, special:scratchpad
bind=ALT, BackSpace, togglespecialworkspace, scratchpad
bind=$mainMod ALT, BackSpace, togglespecialworkspace, scratchpad

# MPV manager
bind=ALT, U, exec, mpv-manager playback
bind=$mainMod CTRL, Y, exec, ~/.local/bin/mpv-manager play-yt
bind=$mainMod CTRL, F9, exec, ~/.local/bin/mpv-manager stick
bind=$mainMod CTRL, F10, exec, ~/.local/bin/mpv-manager move
bind=$mainMod CTRL, F11, exec, ~/.local/bin/mpv-manager save-yt
bind=$mainMod CTRL, F12, exec, ~/.local/bin/mpv-manager wallpaper

# Workspace flow and here-to-window
bind=$mainMod CTRL, C, movetoworkspace, empty
bind=$mainMod, Page_Up, exec, ~/.local/bin/hypr-osc window-move workspace prev
bind=$mainMod, Page_Down, exec, ~/.local/bin/hypr-osc window-move workspace next
bind=$mainMod, mouse_down, workspace, e+1
bind=$mainMod, mouse_up, workspace, e-1
bind=$mainMod, mouse_left, exec, ~/.local/bin/hypr-scroll focus l
bind=$mainMod, mouse_right, exec, ~/.local/bin/hypr-scroll focus r
bind=ALT, 1, exec, ~/.local/bin/hypr-osc here Kenp
bind=ALT, 2, exec, ~/.local/bin/hypr-osc here TmuxKenp
bind=ALT, 3, exec, ~/.local/bin/hypr-osc here Ai
bind=ALT, 4, exec, ~/.local/bin/hypr-osc here CompecTA
bind=ALT, 5, exec, ~/.local/bin/hypr-osc here WebCord
bind=ALT, 6, exec, ~/.local/bin/hypr-osc here org.telegram.desktop
bind=ALT, 7, exec, ~/.local/bin/hypr-osc here brave-youtube.com__-Default
bind=ALT, 8, exec, ~/.local/bin/hypr-osc here spotify
bind=ALT, 9, exec, ~/.local/bin/hypr-osc here ferdium
bind=ALT, 0, exec, ~/.local/bin/hypr-osc here all
bind=$mainMod ALT, 0, exec, ~/.local/bin/hypr-osc arrange-windows

# Monitor focus and move
bind=$mainMod ALT, H, focusmonitor, l
bind=$mainMod ALT, L, focusmonitor, r
bind=$mainMod ALT, K, focusmonitor, u
bind=$mainMod ALT, J, focusmonitor, d
bind=$mainMod ALT, left, focusmonitor, l
bind=$mainMod ALT, right, focusmonitor, r
bind=$mainMod ALT, up, exec, ~/.local/bin/hypr-osc column-move monitor up
bind=$mainMod ALT, down, exec, ~/.local/bin/hypr-osc column-move monitor down
bind=$mainMod ALT SHIFT, left, exec, ~/.local/bin/hypr-osc column-move monitor left
bind=$mainMod ALT SHIFT, right, exec, ~/.local/bin/hypr-osc column-move monitor right
bind=$mainMod ALT SHIFT, h, exec, ~/.local/bin/hypr-osc column-move monitor left
bind=$mainMod ALT SHIFT, l, exec, ~/.local/bin/hypr-osc column-move monitor right
bind=$mainMod CTRL, up, exec, ~/.local/bin/hypr-osc window-move monitor up
bind=$mainMod CTRL, down, exec, ~/.local/bin/hypr-osc window-move monitor down
bind=$mainMod, A, focusmonitor, +1
bind=$mainMod, E, movecurrentworkspacetomonitor, +1
bind=$mainMod, Escape, exec, ~/.local/bin/hypr-osc workspace-move-or-focus
bind=$mainMod, 1, workspace, 1
bind=$mainMod, 2, workspace, 2
bind=$mainMod, 3, workspace, 3
bind=$mainMod, 4, workspace, 4
bind=$mainMod, 5, workspace, 5
bind=$mainMod, 6, workspace, 6
bind=$mainMod, 7, workspace, 7
bind=$mainMod, 8, workspace, 8
bind=$mainMod, 9, workspace, 9
bind=$mainMod SHIFT, 1, movetoworkspace, 1
bind=$mainMod SHIFT, 2, movetoworkspace, 2
bind=$mainMod SHIFT, 3, movetoworkspace, 3
bind=$mainMod SHIFT, 4, movetoworkspace, 4
bind=$mainMod SHIFT, 5, movetoworkspace, 5
bind=$mainMod SHIFT, 6, movetoworkspace, 6
bind=$mainMod SHIFT, 7, movetoworkspace, 7
bind=$mainMod SHIFT, 8, movetoworkspace, 8
bind=$mainMod SHIFT, 9, movetoworkspace, 9

bindl=, XF86AudioRaiseVolume, exec, ~/.local/bin/osc-shell ipc call volume increase
bindl=, XF86AudioLowerVolume, exec, ~/.local/bin/osc-shell ipc call volume decrease
bindl=, XF86AudioMute, exec, ~/.local/bin/osc-shell ipc call volume muteOutput
bindl=, XF86AudioMicMute, exec, ~/.local/bin/osc-shell ipc call volume muteInput
bindl=, XF86MonBrightnessUp, exec, ~/.local/bin/osc-shell ipc call brightness increase
bindl=, XF86MonBrightnessDown, exec, ~/.local/bin/osc-shell ipc call brightness decrease
bindel=SHIFT, XF86MonBrightnessUp, exec, hyprctl hyprsunset gamma +10
bindel=SHIFT, XF86MonBrightnessDown, exec, hyprctl hyprsunset gamma -10
#bindl=, XF86AudioPlay, exec, dms ipc call mpris playPause
#bindl=, XF86AudioNext, exec, dms ipc call mpris next
#bindl=, XF86AudioPrev, exec, dms ipc call mpris previous
#bindl=, XF86AudioStop, exec, dms ipc call mpris stop

bindm=$mainMod, mouse:272, movewindow
bindm=$mainMod, mouse:273, resizewindow
bindm=$mainMod, mouse:274, killactive
