# Hyprland configuration (managed by dcli)

# Session bootstrap
exec-once = ~/.local/bin/hypr-session-init

# Theme
source=~/.config/hypr/themes/mocha.conf
source=~/.config/hypr/themes/hyprland-mauve-accent.conf

# Managed monitor/workspace routing
source=~/.config/hypr/conf.d/92-monitors.conf

# Static config split for reviewability
source=~/.config/hypr/conf.d/10-core.conf
source=~/.config/hypr/conf.d/20-input.conf
source=~/.config/hypr/conf.d/30-rules.conf
source=~/.config/hypr/conf.d/40-binds.conf
source=~/.config/hypr/conf.d/50-workspaces.conf
source=~/.config/hypr/conf.d/60-submaps.conf
