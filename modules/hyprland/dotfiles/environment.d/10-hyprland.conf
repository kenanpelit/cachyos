# Hyprland session defaults for systemd --user, portals and autostarted apps.

XDG_CURRENT_DESKTOP=Hyprland
XDG_SESSION_TYPE=wayland
XDG_SESSION_DESKTOP=Hyprland
DESKTOP_SESSION=Hyprland

PATH=${HOME}/.local/bin:${HOME}/bin:/usr/local/bin:/usr/bin:/bin:/usr/local/sbin
BROWSER=start-helium-kenp
EDITOR=nvim
VISUAL=nvim
TERMINAL=kitty

GDK_BACKEND=wayland,x11
GDK_SCALE=1
GTK_THEME=catppuccin-mocha-mauve-standard+default
GTK_USE_PORTAL=1
GTK_APPLICATION_PREFER_DARK_THEME=1
SDL_VIDEODRIVER=wayland
CLUTTER_BACKEND=wayland
OZONE_PLATFORM=wayland
ELECTRON_OZONE_PLATFORM_HINT=auto

MOZ_ENABLE_WAYLAND=1
MOZ_WEBRENDER=1
MOZ_USE_XINPUT2=1
MOZ_CRASHREPORTER_DISABLE=1
_JAVA_AWT_WM_NONREPARENTING=1

XCURSOR_THEME=capitaine-cursors
XCURSOR_SIZE=24
HYPRCURSOR_THEME=capitaine-cursors
HYPRCURSOR_SIZE=24
XDG_ICON_THEME=kora
ICON_THEME=kora
FONTCONFIG_FILE=/etc/fonts/fonts.conf
LIBVA_DRIVER_NAME=iHD

QT_QPA_PLATFORM=wayland;xcb
QT_QPA_PLATFORMTHEME=gtk3
QT_QPA_PLATFORMTHEME_QT6=gtk3
QT_STYLE_OVERRIDE=kvantum
QT_AUTO_SCREEN_SCALE_FACTOR=1
QT_WAYLAND_DISABLE_WINDOWDECORATION=1
QT_WAYLAND_FORCE_DPI=96
QT_FONT_DPI=96
QT_ENABLE_HIGHDPI_SCALING=1
QT_QPA_SYSTEMTRAY_DARK_MODE=1
QT_ICON_THEME=kora

CATPPUCCIN_FLAVOR=mocha
CATPPUCCIN_ACCENT=mauve

XDG_DATA_DIRS=${HOME}/.local/share/flatpak/exports/share:/var/lib/flatpak/exports/share:/usr/local/share:/usr/share
