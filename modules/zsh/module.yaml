tags:
- shell
- tool
description: Zsh config (portable config)
depends_on:
- base
- zsh-completions
dotfiles:
- source: dotfiles/.zshenv
  target: ~/.zshenv
- source: dotfiles/zsh/.zshrc
  target: ~/.zshrc
- source: dotfiles/zsh/.zprofile
  target: ~/.zprofile
- source: dotfiles/zsh
  target: ~/.config/zsh
