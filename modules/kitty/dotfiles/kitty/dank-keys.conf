# ==============================================================================
# kitty keymap: tmux-less local workflow
# ------------------------------------------------------------------------------
# Goals:
# - split/navigation/layout flow similar to tmux habits
# - no tmux dependency for local desktop sessions
# - keep shortcuts readable and centralized
# ==============================================================================

# Reusable actions
action_alias split_h launch --location=hsplit --cwd=current
action_alias split_v launch --location=vsplit --cwd=current
action_alias new_win launch --cwd=current
action_alias new_os launch --type=os-window --cwd=current

# Clipboard
map ctrl+shift+c copy_to_clipboard
map ctrl+shift+v paste_from_clipboard
map kitty_mod+y copy_to_clipboard
map kitty_mod+p paste_from_clipboard

# Scrollback / search
map kitty_mod+f show_scrollback
map kitty_mod+g show_last_command_output
map kitty_mod+/ search_scrollback
map shift+page_up scroll_page_up
map shift+page_down scroll_page_down
map ctrl+shift+home scroll_home
map ctrl+shift+end scroll_end

# Split / window flow (tmux-like)
map kitty_mod+v split_v
map kitty_mod+s split_h
map kitty_mod+enter new_win
map kitty_mod+r start_resizing_window
map kitty_mod+h previous_window
map kitty_mod+l next_window
map kitty_mod+x close_window
map kitty_mod+f7 move_window_to_top

# Tab flow
map kitty_mod+c new_tab_with_cwd
map kitty_mod+j next_tab
map kitty_mod+k previous_tab
map kitty_mod+comma move_tab_backward
map kitty_mod+period move_tab_forward
map kitty_mod+q close_tab

# Fast tab selection
map kitty_mod+1 goto_tab 1
map kitty_mod+2 goto_tab 2
map kitty_mod+3 goto_tab 3
map kitty_mod+4 goto_tab 4
map kitty_mod+5 goto_tab 5
map kitty_mod+6 goto_tab 6
map kitty_mod+7 goto_tab 7
map kitty_mod+8 goto_tab 8
map kitty_mod+9 goto_tab 9
map kitty_mod+0 goto_tab 10

# Layout helpers (zoom style)
map kitty_mod+z toggle_layout stack
map kitty_mod+t next_layout

# Utility
map kitty_mod+e open_url_with_hints
map kitty_mod+o pass_selection_to_program
map kitty_mod+n new_os
map kitty_mod+u kitten unicode_input
map kitty_mod+escape kitty_shell window
map kitty_mod+f5 load_config_file
map ctrl+shift+q quit
