# Generated by Home Manager.
# See https://sw.kovidgoyal.net/kitty/conf.html
font_family Maple Mono NF
font_size 13

include themes/Catppuccin-Mocha.conf
# Shell integration is sourced and configured manually
shell_integration no-rc

active_tab_font_style bold
adjust_column_width 0
adjust_line_height 2
box_drawing_scale 0.001, 1, 1.5, 2
copy_on_select yes
cursor_beam_thickness 1.5
cursor_blink_interval 0.5
cursor_shape block
detect_urls yes
disable_ligatures never
editor nvim
enable_audio_bell no
force_ltr no
inactive_tab_font_style normal
input_delay 3
repaint_delay 10
scrollback_lines 10000
sync_to_monitor yes
tab_bar_style powerline
tab_powerline_style angled
term xterm-256color
touch_scroll_multiplier 1.0
url_style curly
visual_bell_duration 0.0
wheel_scroll_multiplier 5.0
window_alert_on_bell yes
window_padding_width 8

# tmux-less workflow layer
# - keeps kitty usable without tmux locally
# - still leaves tmux available for remote servers if needed
kitty_mod ctrl+alt
include dank-keys.conf



# Font variants
bold_font        Maple Mono NF Bold
italic_font      Maple Mono NF Italic
bold_italic_font Maple Mono NF Bold Italic

# Icon and symbol fonts  
symbol_map U+E0A0-U+E0A2,U+E0B0-U+E0B3 Maple Mono NF
symbol_map U+F000-U+F2E0 Maple Mono NF

# Font features
font_features +liga,+calt

# Performance optimizations
input_delay 3
repaint_delay 10
