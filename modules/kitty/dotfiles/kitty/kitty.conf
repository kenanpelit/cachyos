# ==============================================================================
# kitty — main config
# ------------------------------------------------------------------------------
# Only non-default values live here. Before adding an "optimization", check it
# against the real default:
#   kitty +runpy 'from kitty.options.types import defaults; print(defaults.input_delay)'
# Validate:    kitty +runpy 'from kitty.config import load_config; load_config(); print("ok")'
# Live reload: pkill -USR1 -x kitty   (or the kitty_mod+f5 bind)
# ==============================================================================

# ── Font ──────────────────────────────────────────────────────────────────────
# Maple Mono NF ships its own Nerd Font glyphs — no symbol_map needed.
# Ligatures (liga/calt) are on by default.
font_family      Maple Mono NF
bold_font        Maple Mono NF Bold
italic_font      Maple Mono NF Italic
bold_italic_font Maple Mono NF Bold Italic
font_size        13
# Modern form of the old `adjust_line_height 2`.
modify_font cell_height +2px

# ── Theme ─────────────────────────────────────────────────────────────────────
include themes/Catppuccin-Mocha.conf

# ── Cursor ────────────────────────────────────────────────────────────────────
cursor_blink_interval 0.5

# ── Scrollback ────────────────────────────────────────────────────────────────
scrollback_lines 10000
# Extra pager-only history (MB) so kitty_mod+f / kitty_mod+/ can reach further
# back than the in-memory buffer.
scrollback_pager_history_size 10

# ── Mouse / clipboard ─────────────────────────────────────────────────────────
copy_on_select yes
strip_trailing_spaces smart

# ── Bell ──────────────────────────────────────────────────────────────────────
enable_audio_bell no

# ── Tabs ──────────────────────────────────────────────────────────────────────
tab_bar_style powerline
active_tab_font_style bold

# ── Layouts / windows ─────────────────────────────────────────────────────────
# splits must come first: the tmux-like split binds in dank-keys.conf use
# `launch --location=hsplit/vsplit`, which only works in the splits layout.
# stack stays enabled for the kitty_mod+z zoom toggle.
enabled_layouts splits,stack
window_padding_width 8

# ── Integration ───────────────────────────────────────────────────────────────
editor nvim
# Shell integration is sourced and configured manually
shell_integration no-rc
# Deliberate: xterm-kitty terminfo is missing on most remote servers, and raw
# `ssh` (without the kitten) is common here — xterm-256color keeps those sane
# at the cost of a few kitty-only features.
term xterm-256color

# ── Keymap: tmux-less local workflow (see dank-keys.conf) ────────────────────
kitty_mod ctrl+alt
include dank-keys.conf
