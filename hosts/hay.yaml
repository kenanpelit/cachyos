host: hay
description: CachyOS setup (ported from nixosc via dcli)
enabled_modules:
- base
- pacman
- paru
- xdg-dirs
- scripts
# - sops # disabled: requires manual creation of modules/sops/files/keys.txt.age before sync
- packages
- flatpak
- system-packages-hay
- admin
- logind
- tty
- logs
- kernel
- firewall
- fail2ban
- blocky
- tcp
- oomd
- bash
- zsh
- starship
- git
- command-not-found
- bat
- btop
- fastfetch
- fzf
- rsync
- lazygit
- yazi
- nvim
- tmux
- sesh
- clipse
- kitty
- wezterm
- alacritty
- ghostty
- gtk
- qt
- niri
- hyprland
- sessions
- sway
- stasis
- xdg-portal
- rofi
# - walker
- dms
- noctalia
# - dms-greeter
- gdm
- fusuma
- bt
- connect
- sunsetr
- anydesk
- mpv
- ytdlp
- mpd
- rmpc
- cava
- radio
- subliminal
- transmission
- brave
- helium
- webcord
- user-services
- ai
- copyq
- xdg-mimes
module_processing: sequential
flatpak_scope: user
aur_helper: paru
auto_prune: false
services:
  enabled:
  - bluetooth
  - NetworkManager
config_backups:
  enabled: true
  max_backups: 5
system_backups:
  enabled: true
  backup_on_sync: true
  backup_on_update: true
  tool: snapper
  snapper_config: root
  max_backups: 5
default_apps:
  scope: user
  browser: brave-browser.desktop
  text_editor: kitty-nvim.desktop
  file_manager: nemo.desktop
  terminal: kitty.desktop
  office: libreoffice-startcenter.desktop
  pdf: org.gnome.Evince.desktop
  archive: org.gnome.FileRoller.desktop
  video: mpv.desktop
  music: mpv.desktop
  image: imv-dir.desktop
  discord: webcord.desktop
  mpv_handler: open-in-mpv.desktop
  mime_types:
    text/html: brave-browser.desktop
    application/xhtml+xml: brave-browser.desktop
    x-scheme-handler/http: brave-browser.desktop
    x-scheme-handler/https: brave-browser.desktop
    x-scheme-handler/about: brave-browser.desktop
    x-scheme-handler/unknown: brave-browser.desktop
    text/plain: kitty-nvim.desktop
    image/bmp: imv-dir.desktop
    image/gif: imv-dir.desktop
    image/jpeg: imv-dir.desktop
    image/jpg: imv-dir.desktop
    image/png: imv-dir.desktop
    image/svg+xml: imv-dir.desktop
    image/tiff: imv-dir.desktop
    image/vnd.microsoft.icon: imv-dir.desktop
    image/webp: imv-dir.desktop
    audio/aac: mpv.desktop
    audio/mpeg: mpv.desktop
    audio/ogg: mpv.desktop
    audio/opus: mpv.desktop
    audio/wav: mpv.desktop
    audio/webm: mpv.desktop
    audio/x-matroska: mpv.desktop
    video/mp2t: mpv.desktop
    video/mp4: mpv.desktop
    video/mpeg: mpv.desktop
    video/ogg: mpv.desktop
    video/webm: mpv.desktop
    video/x-flv: mpv.desktop
    video/x-matroska: mpv.desktop
    video/x-msvideo: mpv.desktop
    inode/directory: nemo.desktop
    application/vnd.oasis.opendocument.text: libreoffice-writer.desktop
    application/vnd.oasis.opendocument.spreadsheet: libreoffice-calc.desktop
    application/vnd.oasis.opendocument.presentation: libreoffice-impress.desktop
    application/vnd.openxmlformats-officedocument.wordprocessingml.document: libreoffice-writer.desktop
    application/vnd.openxmlformats-officedocument.spreadsheetml.sheet: libreoffice-calc.desktop
    application/vnd.openxmlformats-officedocument.presentationml.presentation: libreoffice-impress.desktop
    application/msword: libreoffice-writer.desktop
    application/vnd.ms-excel: libreoffice-calc.desktop
    application/vnd.ms-powerpoint: libreoffice-impress.desktop
    application/rtf: libreoffice-writer.desktop
    application/pdf: org.gnome.Evince.desktop
    application/zip: org.gnome.FileRoller.desktop
    application/rar: org.gnome.FileRoller.desktop
    application/7z: org.gnome.FileRoller.desktop
    application/*tar: org.gnome.FileRoller.desktop
    x-scheme-handler/discord: webcord.desktop
    x-scheme-handler/mpv: open-in-mpv.desktop
